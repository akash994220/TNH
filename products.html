<style>
  :root{
    --ink:#f3efe4;
    --ink-soft:rgba(243,239,228,0.62);
    --ink-faint:rgba(243,239,228,0.4);
    --gold:#d9b872;
    --gold-soft:#a9884f;
    --green:#3a8562;
    --green-deep:#1f4a35;
    --red:#e08b7d;
    --amber:#d9a45c;
    --glass:rgba(255,255,255,0.055);
    --glass-strong:rgba(255,255,255,0.09);
    --glass-border:rgba(255,255,255,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Poppins',sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:48px 16px;
    background:
      radial-gradient(900px 560px at 15% -8%, rgba(217,184,114,0.16), transparent 60%),
      radial-gradient(1000px 700px at 100% 10%, rgba(26,58,143,0.35), transparent 55%),
      radial-gradient(800px 600px at 50% 120%, rgba(26,58,143,0.22), transparent 55%),
      linear-gradient(160deg, #0d1535 0%, #080d1e 45%, #120828 100%);
    background-attachment:fixed;
  }

  .app{ width:100%; max-width:560px; }

  header{ text-align:center; margin-bottom:22px; }
  .crest{ display:inline-flex; align-items:center; gap:12px; margin-bottom:10px; }
  .crest-line{ width:30px; height:1px; background:linear-gradient(90deg, transparent, var(--gold)); }
  .crest-line.right{background:linear-gradient(90deg, var(--gold), transparent);}
  .brand{
    font-family:'Poppins',sans-serif;
    font-size:12px; letter-spacing:4.5px; text-transform:uppercase;
    color:var(--gold); font-weight:400;
  }
  h1{
    font-family:'Poppins',sans-serif;
    font-weight:400; font-size:28px; letter-spacing:0.3px; margin:0;
    color:var(--ink); text-shadow:0 2px 20px rgba(0,0,0,0.4);
  }
  .subtitle{ font-size:12.5px; color:var(--ink-faint); margin-top:6px; letter-spacing:0.4px; }

  .panel{
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:28px;
    padding:20px;
    backdrop-filter:blur(24px) saturate(140%);
    -webkit-backdrop-filter:blur(24px) saturate(140%);
    box-shadow:
      0 24px 60px -20px rgba(0,0,0,0.6),
      0 2px 0 rgba(255,255,255,0.05) inset,
      0 -1px 0 rgba(0,0,0,0.3) inset;
    margin-bottom:16px;
  }

  .add-cat-btn{
    width:100%; padding:11px; font-size:12.5px; letter-spacing:0.3px; text-align:center;
    border-radius:14px; cursor:pointer; background:rgba(217,184,114,0.08);
    border:1px dashed rgba(217,184,114,0.5); color:var(--gold);
    transition:all .15s ease; margin-bottom:14px; font-family:inherit; font-weight:600;
  }
  .add-cat-btn:hover{ background:rgba(217,184,114,0.16); border-color:rgba(217,184,114,0.8); }

  .cat-add-product{
    flex:0 0 auto; width:26px; height:26px; border-radius:50%;
    background:rgba(217,184,114,0.1); border:1px dashed rgba(217,184,114,0.55);
    color:var(--gold); font-size:15px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:all .15s ease;
  }
  .cat-add-product:hover{ background:rgba(217,184,114,0.2); }

  .search-row{ margin-bottom:14px; }
  .search-row input{
    width:100%; padding:12px 16px; font-size:13.5px; border:1px solid rgba(255,255,255,0.12);
    border-radius:999px; background:rgba(0,0,0,0.22); color:var(--ink); font-family:inherit;
    outline:none;
  }
  .search-row input:focus{ border-color:rgba(217,184,114,0.5); }
  .search-row input::placeholder{ color:var(--ink-faint); }

  .empty-hint{
    text-align:center; padding:36px 20px; color:var(--ink-faint); font-size:13px;
    border:1px dashed rgba(255,255,255,0.14); border-radius:20px; background:rgba(255,255,255,0.02);
  }
  .empty-hint span{ display:block; font-family:'Poppins',sans-serif; font-size:16px; color:var(--gold); margin-bottom:5px; }

  .categories{ display:flex; flex-direction:column; gap:14px; }
  .category{
    background:var(--glass-strong); border:1px solid var(--glass-border); border-radius:20px;
    padding:16px;
  }
  .cat-header{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    cursor:pointer; user-select:none;
  }
  .category.expanded .cat-header{ margin-bottom:12px; }
  .cat-header-left{ display:flex; align-items:center; gap:10px; min-width:0; flex:1; }
  .cat-chevron{
    flex:0 0 auto; width:18px; height:18px; color:var(--gold); opacity:0.75;
    display:flex; align-items:center; justify-content:center;
    transition:transform .2s ease;
  }
  .cat-chevron svg{ width:12px; height:12px; }
  .category.expanded .cat-chevron{ transform:rotate(90deg); }
  .cat-title{
    font-family:'Poppins',sans-serif; font-size:16px; color:var(--gold);
    letter-spacing:0.2px; word-break:break-word;
  }
  .cat-count{ font-size:10.5px; color:var(--ink-faint); margin-top:3px; }

  .items{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .item{
    background:rgba(0,0,0,0.16); border:1px solid rgba(255,255,255,0.08); border-radius:14px;
    padding:11px 12px; display:flex; align-items:center; gap:10px;
  }
  .item-info{ flex:1 1 auto; min-width:0; }
  .item-name{ font-size:13.5px; line-height:1.4; word-break:break-word; }
  .item-price{ font-size:11.5px; color:var(--gold); margin-top:2px; }
  .item-cat-label{ font-size:10px; color:var(--ink-faint); margin-top:1px; }
  .item-actions{ flex:0 0 auto; display:flex; gap:5px; }
  .item-action{
    width:26px; height:26px; border-radius:50%; background:rgba(0,0,0,0.22); border:none;
    color:var(--ink-faint); cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all .15s ease;
  }
  .item-action:hover{ color:var(--gold); background:rgba(217,184,114,0.14); }
  .item-action.danger:hover{ color:var(--red); background:rgba(224,139,125,0.14); }
  .item-action svg{ width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:1.8; }

  .add-item-btn{
    width:100%; padding:10px; font-size:12px; letter-spacing:0.3px; text-align:center;
    border-radius:12px; cursor:pointer; background:transparent;
    border:1px dashed rgba(217,184,114,0.4); color:var(--gold);
    transition:all .15s ease; margin-top:14px; font-family:inherit;
  }
  .add-item-btn:hover{ background:rgba(217,184,114,0.08); border-color:rgba(217,184,114,0.7); }

  .form{
    margin-top:12px; padding:14px; border-radius:14px;
    background:rgba(0,0,0,0.22); border:1px solid rgba(217,184,114,0.25);
    display:flex; flex-direction:column; gap:8px;
  }
  .form input, .form select{
    width:100%; padding:10px 14px; font-size:13px; border:1px solid rgba(255,255,255,0.12);
    border-radius:12px; background:rgba(0,0,0,0.25); color:var(--ink); font-family:inherit;
    outline:none;
  }
  .form input:focus, .form select:focus{ border-color:rgba(217,184,114,0.5); }
  .form input::placeholder{ color:var(--ink-faint); }
  .form-label{ font-size:10.5px; color:var(--ink-faint); letter-spacing:0.3px; margin-bottom:-3px; }
  .form-row{ display:flex; gap:8px; }
  .form-row button{
    flex:1; padding:10px; font-size:12.5px; letter-spacing:0.2px; border-radius:12px; cursor:pointer;
    font-family:inherit; transition:all .15s ease;
  }
  .form-save{ background:linear-gradient(135deg,#e3c684,#a9884f); border:none; color:#1b1a15; font-weight:600; }
  .form-save:hover{ opacity:0.9; }
  .form-cancel{ background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.14); color:var(--ink-soft); }
  .form-cancel:hover{ color:var(--gold); border-color:rgba(217,184,114,0.4); }

  .concurrency-banner{
    display:none; font-size:11px; line-height:1.5; color:var(--amber);
    background:rgba(217,164,92,0.1); border:1px solid rgba(217,164,92,0.35);
    border-radius:10px; padding:8px 10px; margin-top:2px;
  }
  .concurrency-banner.show{ display:block; }

  footer{ text-align:center; margin-top:24px; font-size:11px; color:var(--ink-faint); letter-spacing:0.3px; }
  .footer-gold{color:var(--gold);}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
  @media (max-width:420px){
    .panel{border-radius:22px; padding:16px;}
    h1{font-size:24px;}
  }

  /* ── Light mode (navy blue) ── */
  body.light{
    --ink:#0a1f44; --ink-soft:rgba(10,31,68,0.68); --ink-faint:rgba(10,31,68,0.42);
    --gold:#1a3a8f; --gold-soft:#15316f;
    --glass:rgba(255,255,255,0.7); --glass-strong:rgba(255,255,255,0.85); --glass-border:rgba(26,58,143,0.15);
    background:
      radial-gradient(900px 560px at 15% -8%, rgba(26,58,143,0.06), transparent 60%),
      radial-gradient(1000px 700px at 100% 10%, rgba(26,58,143,0.08), transparent 55%),
      linear-gradient(160deg, #f5f7fc 0%, #eef1fa 55%, #f2effa 100%);
  }
  body.light .search-row input,
  body.light .form input, body.light .form select{ background:#fff; border-color:rgba(26,58,143,0.18); }
  body.light .item{ background:rgba(255,255,255,0.6); border-color:rgba(26,58,143,0.12); }
  body.light .item-action{ background:rgba(26,58,143,0.06); }
  body.light .empty-hint{ background:rgba(255,255,255,0.4); border-color:rgba(26,58,143,0.18); }
  body.light .form{ background:rgba(255,255,255,0.6); border-color:rgba(26,58,143,0.2); }
  body.light .form-cancel{ background:rgba(26,58,143,0.05); border-color:rgba(26,58,143,0.16); }
</style>
</head>
<body>

</div>

  let state = null;      // { items: [{id,name,category,price}], categories: [name,...], updatedAt }
  let docRef = null;
  let searchQuery = '';
  let expandedCats = new Set();
  let addFormCategory = null;  // category name whose inline "add product" form is open, or null
  let editingId = null;
  let formBaseline = null;           // deep copy of the item as it was when its edit form opened
  let remoteChangedWhileEditing = false; // true if a snapshot arrived while a form was open

  const subtitleEl = document.getElementById('subtitle');
  const viewBodyEl = document.getElementById('viewBody');
  const searchInput = document.getElementById('searchInput');

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function fmtPrice(p){
    const n = Number(p);
    return isFinite(n) ? '\u09f3' + n.toLocaleString() : '';
  }

  // ---------- Load ----------
  function load(){
    subtitleEl.textContent = 'Connecting\u2026';
    window.thAuthReady.then(function(){
      docRef = window.thDB.collection(DOC_COLLECTION).doc(DOC_ID);
      docRef.onSnapshot(function(snap){
        if(snap.metadata.hasPendingWrites) return;
        if(snap.exists){
          state = snap.data();
          if(!Array.isArray(state.items)) state.items = [];
          if(!Array.isArray(state.categories)){
            // Migrate: derive the category list from whatever items already exist.
            const set = new Set();
            state.items.forEach(it => { if(it.category) set.add(it.category); });
            state.categories = [...set];
            save();
          }
        } else {
          const set = new Set();
          SEED_PRODUCTS.forEach(it => { if(it.category) set.add(it.category); });
          state = { items: SEED_PRODUCTS.slice(), categories: [...set] };
          save();
        }
        // A form left open shouldn't get silently rebuilt out from under
        // someone mid-edit — that would wipe whatever they'd typed. Refresh
        // the underlying data, but only re-render (and only warn) instead
        // of tearing down the open form.
        if(editingId !== null || addFormCategory !== null){
          remoteChangedWhileEditing = true;
          updateConcurrencyBanner();
        } else {
          render();
        }
      }, function(err){
        console.error('Products sync error', err);
        subtitleEl.textContent = 'Could not connect \u2014 check your internet connection.';
      });
    });
  }

  function updateConcurrencyBanner(){
    const banner = document.getElementById('concurrencyBanner');
    if(!banner) return;
    if(remoteChangedWhileEditing){
      banner.textContent = 'Someone else updated the product list while you were editing. Your changes here are still safe \u2014 saving will ask you to confirm before overwriting theirs.';
      banner.classList.add('show');
    } else {
      banner.classList.remove('show');
    }
  }

  function save(){
    if(!docRef || !state) return;
    const payload = Object.assign({}, state, { updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    docRef.set(payload).catch(e => console.error('Could not save products', e));
  }

  // ---------- Data helpers ----------
  function categoriesOf(items){
    const map = new Map();
    items.forEach(it => {
      const cat = it.category || 'Uncategorised';
      if(!map.has(cat)) map.set(cat, []);
      map.get(cat).push(it);
    });
    return map;
  }

  function existingCategories(){
    const set = new Set(state.categories || []);
    (state.items || []).forEach(it => { if(it.category) set.add(it.category); });
    return [...set].sort((a,b) => a.localeCompare(b));
  }

  function allProductNames(){
    const set = new Set();
    (state.items || []).forEach(it => { if(it.name) set.add(it.name); });
    return [...set].sort((a,b) => a.localeCompare(b));
  }

  function firstPriceForName(name){
    const hit = (state.items || []).find(it => it.name === name);
    return (hit && hit.price !== undefined && hit.price !== null && hit.price !== '') ? hit.price : '';
  }

  async function addCategory(){
    const name = await THDialog.prompt('New category name:', '', { title: 'Add category' });
    if(name === null) return;
    const trimmed = name.trim();
    if(!trimmed) return;
    if(!state.categories) state.categories = [];
    if(existingCategories().includes(trimmed)){
      await THDialog.alert('That category already exists.');
      return;
    }
    state.categories.push(trimmed);
    expandedCats.add(trimmed);
    save();
    render();
  }

  function filteredItems(){
    const items = (state.items || []).slice().sort((a,b) => a.name.localeCompare(b.name));
    const q = searchQuery.trim().toLowerCase();
    if(!q) return items;
    return items.filter(it => it.name.toLowerCase().includes(q) || (it.category||'').toLowerCase().includes(q));
  }

  // ---------- Render ----------
  function render(){
    if(!state){
      subtitleEl.textContent = 'Connecting\u2026';
      viewBodyEl.innerHTML = '';
      return;
    }
    const total = (state.items || []).length;
    subtitleEl.textContent = total + ' product' + (total === 1 ? '' : 's') + ' in the catalog';

    viewBodyEl.innerHTML = '';

    const items = filteredItems();

    if(searchQuery.trim()){
      // Flat filtered list while searching (category grouping isn't useful mid-search)
      if(items.length === 0){
        const hint = document.createElement('div');
        hint.className = 'empty-hint';
        hint.innerHTML = '<span>No matches</span>Try a different search term.';
        viewBodyEl.appendChild(hint);
      } else {
        const ul = document.createElement('ul');
        ul.className = 'items';
        items.forEach(it => ul.appendChild(renderItemRow(it)));
        viewBodyEl.appendChild(ul);
      }
    } else {
      const allCats = existingCategories();
      if(allCats.length === 0){
        const hint = document.createElement('div');
        hint.className = 'empty-hint';
        hint.innerHTML = '<span>No categories yet</span>Tap "+ Add category" above to get started.';
        viewBodyEl.appendChild(hint);
      } else {
        const grouped = categoriesOf(items);
        const catsWrap = document.createElement('div');
        catsWrap.className = 'categories';
        allCats.forEach(cat => {
          catsWrap.appendChild(renderCategory(cat, grouped.get(cat) || []));
        });
        viewBodyEl.appendChild(catsWrap);
      }
    }
  }

  function renderCategory(cat, items){
    const isFormOpenHere = addFormCategory === cat;
    const isExpanded = expandedCats.has(cat) || isFormOpenHere;
    const card = document.createElement('div');
    card.className = 'category' + (isExpanded ? ' expanded' : '');

    const header = document.createElement('div');
    header.className = 'cat-header';
    header.addEventListener('click', () => {
      if(expandedCats.has(cat)) expandedCats.delete(cat); else expandedCats.add(cat);
      render();
    });

    const left = document.createElement('div');
    left.className = 'cat-header-left';
    const chevron = document.createElement('div');
    chevron.className = 'cat-chevron';
    chevron.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    const titleWrap = document.createElement('div');
    const title = document.createElement('div');
    title.className = 'cat-title';
    title.textContent = cat;
    const count = document.createElement('div');
    count.className = 'cat-count';
    count.textContent = items.length + ' item' + (items.length === 1 ? '' : 's');
    titleWrap.appendChild(title);
    titleWrap.appendChild(count);
    left.appendChild(chevron);
    left.appendChild(titleWrap);
    header.appendChild(left);

    const addProductBtn = document.createElement('button');
    addProductBtn.className = 'cat-add-product';
    addProductBtn.textContent = '+';
    addProductBtn.title = 'Add product to ' + cat;
    addProductBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      editingId = null;
      addFormCategory = cat;
      expandedCats.add(cat);
      formBaseline = null;
      remoteChangedWhileEditing = false;
      render();
    });
    header.appendChild(addProductBtn);

    card.appendChild(header);

    if(isExpanded){
      if(items.length){
        const ul = document.createElement('ul');
        ul.className = 'items';
        items.sort((a,b) => a.name.localeCompare(b.name)).forEach(it => ul.appendChild(renderItemRow(it)));
        card.appendChild(ul);
      }
      if(isFormOpenHere){
        card.appendChild(renderForm(null, cat));
      }
    }

    return card;
  }

  function renderItemRow(it){
    const li = document.createElement('li');
    li.className = 'item';

    if(editingId === it.id){
      const wrap = document.createElement('div');
      wrap.style.flex = '1 1 auto';
      wrap.appendChild(renderForm(it));
      li.appendChild(wrap);
      li.style.padding = '0';
      li.style.background = 'transparent';
      li.style.border = 'none';
      return li;
    }

    const info = document.createElement('div');
    info.className = 'item-info';
    const name = document.createElement('div');
    name.className = 'item-name';
    name.textContent = it.name;
    const meta = document.createElement('div');
    meta.className = 'item-price';
    meta.textContent = fmtPrice(it.price);
    const catLabel = document.createElement('div');
    catLabel.className = 'item-cat-label';
    catLabel.textContent = it.category || 'Uncategorised';
    info.appendChild(name);
    if(it.price !== undefined && it.price !== null && it.price !== '') info.appendChild(meta);
    info.appendChild(catLabel);

    const actions = document.createElement('div');
    actions.className = 'item-actions';

    const editBtn = document.createElement('button');
    editBtn.className = 'item-action';
    editBtn.title = 'Edit';
    editBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 20h9" stroke-linecap="round"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" stroke-linejoin="round"/></svg>';
    editBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      addFormCategory = null;
      editingId = it.id;
      formBaseline = JSON.parse(JSON.stringify(it));
      remoteChangedWhileEditing = false;
      render();
    });

    const delBtn = document.createElement('button');
    delBtn.className = 'item-action danger';
    delBtn.title = 'Delete';
    delBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 6h18" stroke-linecap="round"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" stroke-linejoin="round"/></svg>';
    delBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const typed = await THDialog.prompt(
        'Delete \u201c' + it.name + '\u201d from the product catalog?\n\n' +
        'This removes it everywhere it\u2019s used for search \u2014 the station checklist, requirements, and the service calculator.\n\n' +
        'Type DELETE to confirm.',
        '',
        { title: 'Delete product', placeholder: 'DELETE', okText: 'Confirm' }
      );
      if(typed === null) return; // cancelled
      if(typed.trim() !== 'DELETE'){
        await THDialog.alert('Didn\u2019t match \u2014 nothing was deleted.');
        return;
      }
      if(!(state.items || []).some(x => x.id === it.id)){
        await THDialog.alert('This product was already deleted (possibly by someone else).');
        render();
        return;
      }
      state.items = state.items.filter(x => x.id !== it.id);
      save();
      render();
    });

    actions.appendChild(editBtn);
    actions.appendChild(delBtn);

    li.appendChild(info);
    li.appendChild(actions);
    return li;
  }

  function renderForm(existing, presetCategory){
    const wrap = document.createElement('div');
    wrap.className = 'form';

    const banner = document.createElement('div');
    banner.className = 'concurrency-banner';
    banner.id = 'concurrencyBanner';
    wrap.appendChild(banner);

    const nameLabel = document.createElement('div');
    nameLabel.className = 'form-label';
    nameLabel.textContent = 'Product name';

    const NEW_NAME = '__newname__';
    let nameSelect = null, nameNewInput = null, namePlainInput = null;

    if(existing){
      // Editing a specific record — plain text, renaming this exact item.
      namePlainInput = document.createElement('input');
      namePlainInput.type = 'text';
      namePlainInput.placeholder = 'e.g. 1805 Aftershave Balm';
      namePlainInput.value = existing.name;
    } else {
      // Adding — pick from every product already in the catalog, or add a new one.
      const names = allProductNames();
      nameSelect = document.createElement('select');
      names.forEach(n => {
        const opt = document.createElement('option');
        opt.value = n;
        opt.textContent = n;
        nameSelect.appendChild(opt);
      });
      const newOpt = document.createElement('option');
      newOpt.value = NEW_NAME;
      newOpt.textContent = '+ Add new product\u2026';
      nameSelect.appendChild(newOpt);

      nameNewInput = document.createElement('input');
      nameNewInput.type = 'text';
      nameNewInput.placeholder = 'New product name';
      nameNewInput.style.display = 'none';

      if(names.length === 0){
        nameSelect.value = NEW_NAME;
        nameNewInput.style.display = 'block';
      }
      nameSelect.addEventListener('change', () => {
        const isNew = nameSelect.value === NEW_NAME;
        nameNewInput.style.display = isNew ? 'block' : 'none';
        if(isNew){
          nameNewInput.focus();
        } else if(!priceInput.value){
          const p = firstPriceForName(nameSelect.value);
          if(p !== '') priceInput.value = p;
        }
      });
    }

    const catLabel = document.createElement('div');
    catLabel.className = 'form-label';
    catLabel.textContent = presetCategory ? 'Category' : 'Category';

    const NEW_CAT = '__new__';
    let catSelect = null, newCatInput = null, presetCatNote = null;

    if(presetCategory){
      presetCatNote = document.createElement('div');
      presetCatNote.style.cssText = 'padding:10px 14px;font-size:13px;border-radius:12px;background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.12);color:var(--ink-soft);';
      presetCatNote.textContent = presetCategory;
    } else {
      const cats = existingCategories();
      catSelect = document.createElement('select');
      cats.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        catSelect.appendChild(opt);
      });
      const existingCat = existing ? (existing.category || '') : '';
      if(existingCat && !cats.includes(existingCat)){
        // The item's own category isn't in the current list (edge case, e.g.
        // stale data) — keep it selectable so saving doesn't silently change it.
        const opt = document.createElement('option');
        opt.value = existingCat;
        opt.textContent = existingCat;
        catSelect.appendChild(opt);
      }
      const newCatOpt = document.createElement('option');
      newCatOpt.value = NEW_CAT;
      newCatOpt.textContent = '+ Add new category\u2026';
      catSelect.appendChild(newCatOpt);

      newCatInput = document.createElement('input');
      newCatInput.type = 'text';
      newCatInput.placeholder = 'New category name';
      newCatInput.style.display = 'none';

      if(existingCat){
        catSelect.value = existingCat;
      } else if(cats.length === 0){
        catSelect.value = NEW_CAT;
        newCatInput.style.display = 'block';
      }
      catSelect.addEventListener('change', () => {
        const isNew = catSelect.value === NEW_CAT;
        newCatInput.style.display = isNew ? 'block' : 'none';
        if(isNew) newCatInput.focus();
      });
    }

    const priceLabel = document.createElement('div');
    priceLabel.className = 'form-label';
    priceLabel.textContent = 'Price (\u09f3, optional)';
    const priceInput = document.createElement('input');
    priceInput.type = 'number';
    priceInput.inputMode = 'numeric';
    priceInput.placeholder = 'e.g. 9300';
    priceInput.value = existing && existing.price !== undefined && existing.price !== null ? existing.price : '';

    const row = document.createElement('div');
    row.className = 'form-row';
    const saveBtn = document.createElement('button');
    saveBtn.className = 'form-save';
    saveBtn.textContent = existing ? 'Save changes' : 'Add product';
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'form-cancel';
    cancelBtn.textContent = 'Cancel';

    saveBtn.addEventListener('click', async () => {
      const name = existing
        ? namePlainInput.value.trim()
        : (nameSelect.value === NEW_NAME ? nameNewInput.value.trim() : nameSelect.value);
      const category = presetCategory
        ? presetCategory
        : (catSelect.value === NEW_CAT ? newCatInput.value.trim() : catSelect.value);
      const priceRaw = priceInput.value.trim();
      const price = priceRaw === '' ? null : Number(priceRaw);
      if(!name){ await THDialog.alert('Please enter a product name.'); return; }
      if(!category){ await THDialog.alert('Please enter or choose a category.'); return; }
      if(priceRaw !== '' && !isFinite(price)){ await THDialog.alert('Price must be a number.'); return; }

      if(existing){
        const live = (state.items || []).find(x => x.id === existing.id);
        if(!live){
          await THDialog.alert('This product was deleted elsewhere while you were editing it. Your changes were not saved.');
          editingId = null;
          formBaseline = null;
          render();
          return;
        }

        // Optimistic concurrency check: did someone else change this product
        // since this form was opened?
        if(formBaseline){
          const changedElsewhere =
            live.name !== formBaseline.name ||
            live.category !== formBaseline.category ||
            String(live.price) !== String(formBaseline.price);
          if(changedElsewhere){
            const proceed = await THDialog.confirm(
              'This product was changed elsewhere while you were editing it.\n\n' +
              'Their current version \u2014 "' + live.name + '", ' + (live.category || 'Uncategorised') + ', ' + fmtPrice(live.price) + '\n\n' +
              'Save your version anyway and overwrite theirs?',
              { title: 'Conflicting changes', okText: 'Overwrite', danger: true }
            );
            if(!proceed){
              editingId = null;
              formBaseline = null;
              remoteChangedWhileEditing = false;
              render();
              return;
            }
          }
        }

        // Extra confirmation specifically for price changes, since a wrong
        // price goes live in the calculator immediately.
        const oldPrice = (live.price === undefined || live.price === null || live.price === '') ? null : Number(live.price);
        if(oldPrice !== price){
          const oldLabel = oldPrice === null ? 'no price set' : fmtPrice(oldPrice);
          const newLabel = price === null ? 'no price set' : fmtPrice(price);
          const okPrice = await THDialog.confirm('Change price of "' + name + '" from ' + oldLabel + ' to ' + newLabel + '?\n\nThis updates live in the Service Calculator.', { title: 'Confirm price change', okText: 'Change price' });
          if(!okPrice) return;
        }

        const idx = state.items.findIndex(x => x.id === existing.id);
        if(idx > -1) state.items[idx] = Object.assign({}, live, { name, category, price });
        editingId = null;
        formBaseline = null;
      } else {
        if(!state.categories) state.categories = [];
        if(!state.categories.includes(category)) state.categories.push(category);
        state.items.push({ id: uid(), name, category, price });
        addFormCategory = null;
        expandedCats.add(category);
      }
      remoteChangedWhileEditing = false;
      save();
      render();
    });

    cancelBtn.addEventListener('click', () => {
      if(existing) editingId = null; else addFormCategory = null;
      formBaseline = null;
      remoteChangedWhileEditing = false;
      render();
    });

    row.appendChild(saveBtn);
    row.appendChild(cancelBtn);

    wrap.appendChild(nameLabel);
    if(existing){
      wrap.appendChild(namePlainInput);
    } else {
      wrap.appendChild(nameSelect);
      wrap.appendChild(nameNewInput);
    }
    wrap.appendChild(catLabel);
    if(presetCategory){
      wrap.appendChild(presetCatNote);
    } else {
      wrap.appendChild(catSelect);
      wrap.appendChild(newCatInput);
    }
    wrap.appendChild(priceLabel);
    wrap.appendChild(priceInput);
    wrap.appendChild(row);

    setTimeout(() => {
      (existing ? namePlainInput : (nameSelect.value === NEW_NAME ? nameNewInput : nameSelect)).focus();
      updateConcurrencyBanner();
    }, 0);

    return wrap;
  }

  searchInput.addEventListener('input', () => {
    searchQuery = searchInput.value;
    render();
  });

  document.getElementById('addCatBtn').addEventListener('click', addCategory);

  load();
})();
</script>
<script src="nav.js"></script>
<script src="shared.js"></script>
