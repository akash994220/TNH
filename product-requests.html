<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Truefitt &amp; Hill — Product Requests</title>
<style>html,body{background:#0d1535;}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="auth.js"></script>
<script src="catalog.js"></script>
<style>
  :root{
    --ink:#f3efe4;
    --ink-soft:rgba(243,239,228,0.62);
    --ink-faint:rgba(243,239,228,0.4);
    --gold:#d9b872;
    --gold-soft:#a9884f;
    --green:#3a8562;
    --green-deep:#1f4a35;
    --red:#e08b7d;
    --amber:#d9a45c;
    --glass:rgba(255,255,255,0.055);
    --glass-strong:rgba(255,255,255,0.09);
    --glass-border:rgba(255,255,255,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Poppins',sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:48px 16px;
    background:
      radial-gradient(900px 560px at 15% -8%, rgba(217,184,114,0.16), transparent 60%),
      radial-gradient(1000px 700px at 100% 10%, rgba(26,58,143,0.35), transparent 55%),
      radial-gradient(800px 600px at 50% 120%, rgba(26,58,143,0.22), transparent 55%),
      linear-gradient(160deg, #0d1535 0%, #080d1e 45%, #120828 100%);
    background-attachment:fixed;
  }

  .app{ width:100%; max-width:560px; }
  @media (min-width: 1024px){
    .app{ max-width: 980px; }
  }

  header{ text-align:center; margin-bottom:22px; }
  .crest{ display:inline-flex; align-items:center; gap:12px; margin-bottom:10px; }
  .crest-line{ width:30px; height:1px; background:linear-gradient(90deg, transparent, var(--gold)); }
  .crest-line.right{background:linear-gradient(90deg, var(--gold), transparent);}
  .brand{
    font-family:'Poppins',sans-serif;
    font-size:12px; letter-spacing:4.5px; text-transform:uppercase;
    color:var(--gold); font-weight:400;
  }
  h1{
    font-family:'Poppins',sans-serif;
    font-weight:400; font-size:28px; letter-spacing:0.3px; margin:0;
    color:var(--ink); text-shadow:0 2px 20px rgba(0,0,0,0.4);
  }
  .subtitle{ font-size:12.5px; color:var(--ink-faint); margin-top:6px; letter-spacing:0.4px; }

  .panel{
    background:linear-gradient(165deg, rgba(16,22,46,0.88) 0%, rgba(9,13,30,0.94) 100%);
    border:1px solid rgba(217,184,114,0.26);
    border-radius:24px;
    padding:24px 22px;
    backdrop-filter:blur(24px) saturate(140%);
    -webkit-backdrop-filter:blur(24px) saturate(140%);
    box-shadow:0 20px 50px -15px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.08);
    margin-bottom:18px;
  }

  .empty-hint{
    text-align:center; padding:36px 20px; color:var(--ink-faint); font-size:13px;
    border:1px dashed rgba(217,184,114,0.25); border-radius:20px; background:rgba(217,184,114,0.02);
  }
  .empty-hint span{ display:block; font-family:'Poppins',sans-serif; font-size:16px; color:#d9b872; margin-bottom:5px; }

  .req-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .req-item{
    background:rgba(255,255,255,0.035); border:1px solid rgba(217,184,114,0.18); border-radius:14px;
    padding:12px 16px; display:flex; align-items:center; gap:12px;
    box-shadow:0 4px 14px rgba(0,0,0,0.2); transition:all .18s cubic-bezier(0.16,1,0.3,1);
  }
  .req-item:hover{ background:rgba(217,184,114,0.06); border-color:rgba(217,184,114,0.35); transform:translateY(-1px); }
  .req-item.done{ opacity:0.55; }
  .req-check{
    flex:0 0 auto; width:24px; height:24px; border-radius:50%; cursor:pointer;
    border:1.5px solid rgba(217,184,114,0.6); background:rgba(255,255,255,0.04);
    display:flex; align-items:center; justify-content:center; transition:all .18s ease;
  }
  .req-check:hover{ box-shadow:0 0 0 4px rgba(217,184,114,0.16); }
  .req-check svg{ width:12px; height:12px; stroke:#140e03; fill:none; stroke-width:2.4; opacity:0; transition:opacity .15s ease; }
  .req-item.done .req-check{ background:linear-gradient(135deg, #fae6a2, #d9b872); border-color:#d9b872; }
  .req-item.done .req-check svg{ opacity:1; }
  .req-name{ flex:1 1 auto; min-width:0; font-size:14px; line-height:1.4; word-break:break-word; font-weight:500; }
  .req-item.done .req-name{ text-decoration:line-through; color:var(--ink-faint); }
  .req-qty{
    flex:0 0 auto; min-width:36px; height:30px; padding:0 10px; border-radius:999px;
    background:linear-gradient(135deg, rgba(217,184,114,0.22), rgba(217,184,114,0.08));
    border:1px solid rgba(217,184,114,0.45); color:#ffd166;
    font-size:13.5px; font-weight:700; display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,0.2);
  }
  .req-controls{ flex:0 0 auto; display:flex; align-items:center; gap:6px; }
  .req-btn{
    width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12);
    color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px;
    transition:all .15s ease;
  }
  .req-btn:hover{ color:#d9b872; background:rgba(217,184,114,0.14); border-color:rgba(217,184,114,0.4); transform:scale(1.08); }
  .req-btn.danger:hover{ color:#ff6b6b; background:rgba(224,139,125,0.14); border-color:rgba(224,139,125,0.4); }

  .add-item-btn{
    width:100%; padding:12px; font-size:12.5px; letter-spacing:0.4px; text-align:center;
    border-radius:14px; cursor:pointer; background:rgba(217,184,114,0.04);
    border:1px dashed rgba(217,184,114,0.45); color:#d9b872;
    transition:all .18s cubic-bezier(0.16,1,0.3,1); margin-top:16px; font-family:inherit; font-weight:600;
  }
  .add-item-btn:hover{ background:rgba(217,184,114,0.12); border-color:#d9b872; transform:translateY(-1px); }

  .picker{
    margin-top:14px; padding:16px; border-radius:18px;
    background:rgba(4,7,18,0.5); border:1px solid rgba(217,184,114,0.3); box-shadow:0 8px 24px rgba(0,0,0,0.35);
  }
  .picker-row{ display:flex; gap:8px; margin-bottom:10px; }
  .picker-row input{
    flex:1; padding:11px 16px; font-size:13px; border:1px solid rgba(217,184,114,0.25);
    border-radius:999px; background:rgba(4,7,18,0.5); color:var(--ink); font-family:inherit;
    outline:none; transition:border-color .15s ease;
  }
  .picker-row input:focus{ border-color:rgba(217,184,114,0.7); }
  .picker-row button{
    flex:0 0 auto; padding:0 16px; font-size:12px; font-weight:600; border-radius:999px; cursor:pointer;
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.16); color:var(--ink-soft); transition:all .15s ease;
  }
  .picker-row button:hover{ background:rgba(255,255,255,0.12); color:#f3efe4; }
  .picker-results{ display:flex; flex-direction:column; gap:6px; max-height:230px; overflow-y:auto; }
  .picker-result{
    display:flex; flex-direction:column; padding:10px 14px; border-radius:12px; cursor:pointer;
    background:rgba(255,255,255,0.035); border:1px solid rgba(217,184,114,0.15);
    transition:all .18s cubic-bezier(0.16,1,0.3,1);
  }
  .picker-result:hover{ background:rgba(217,184,114,0.12); border-color:#d9b872; transform:translateY(-1px); }
  .picker-result-name{ font-size:13.5px; font-weight:500; }
  .picker-result-cat{ font-size:11px; color:rgba(217,184,114,0.7); margin-top:2px; }
  .picker-custom{
    display:flex; align-items:center; justify-content:center; gap:6px;
    padding:11px 14px; border-radius:12px; cursor:pointer; margin-top:4px;
    background:rgba(217,184,114,0.06); border:1px dashed rgba(217,184,114,0.45); color:#d9b872;
    font-size:13px; text-align:center; font-weight:600; transition:all .18s ease;
  }
  .picker-custom:hover{ background:rgba(217,184,114,0.14); border-color:#d9b872; }
  .picker-empty{ text-align:center; font-size:12px; color:var(--ink-faint); padding:10px; }

  .qty-step{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 16px; border-radius:14px; background:rgba(4,7,18,0.5);
    border:1px solid rgba(217,184,114,0.3); margin-bottom:12px;
  }
  .qty-step-name{ font-size:14px; font-weight:500; flex:1 1 auto; min-width:0; word-break:break-word; }
  .qty-step-controls{ flex:0 0 auto; display:flex; align-items:center; gap:8px; }
  .qty-step-controls button{
    width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.06);
    border:1px solid rgba(217,184,114,0.35); color:#d9b872; cursor:pointer; font-size:16px;
    display:flex; align-items:center; justify-content:center; transition:all .15s ease;
  }
  .qty-step-controls button:hover{ background:linear-gradient(135deg,#fae6a2,#d9b872); color:#140e03; border-color:#d9b872; transform:scale(1.08); }
  .qty-step-val{ min-width:28px; text-align:center; font-size:15px; font-weight:700; color:#ffd166; }
  .qty-confirm-row{ display:flex; gap:10px; }
  .qty-confirm-row button{
    flex:1; padding:12px 16px; font-size:13px; font-weight:600; letter-spacing:0.3px;
    border-radius:999px; cursor:pointer; font-family:inherit; transition:all .18s cubic-bezier(0.16,1,0.3,1);
  }
  .qty-confirm-row .cancel-btn{ background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.16); color:var(--ink-soft); }
  .qty-confirm-row .cancel-btn:hover{ background:rgba(255,255,255,0.12); color:#f3efe4; }
  .qty-confirm-row .confirm-btn{ background:linear-gradient(135deg,#fae6a2 0%,#d9b872 50%,#aa8232 100%); border:none; color:#140e03; box-shadow:0 4px 14px rgba(217,184,114,0.45); }
  .qty-confirm-row .confirm-btn:hover{ transform:translateY(-1px); box-shadow:0 6px 18px rgba(217,184,114,0.6); }

  footer{ text-align:center; margin-top:24px; font-size:11px; color:var(--ink-faint); letter-spacing:0.3px; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(10px);
    background:linear-gradient(165deg,#131c44 0%,#090e24 100%); border:1px solid rgba(217,184,114,0.4); color:var(--ink);
    padding:12px 24px; border-radius:999px; font-size:13px; z-index:600;
    opacity:0; pointer-events:none; transition:all .22s cubic-bezier(0.16,1,0.3,1);
    box-shadow:0 12px 36px rgba(0,0,0,0.65); text-align:center; max-width:90vw;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .footer-gold{color:var(--gold);}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
  @media (max-width:420px){
    .panel{border-radius:22px; padding:16px;}
    h1{font-size:24px;}
  }

  /* Reusable Companion Tool Switcher */
  .context-tabs{
    display:flex; gap:6px; margin:0 auto 20px; max-width:480px; padding:5px;
    background:rgba(4,7,18,0.48); border:1px solid rgba(217,184,114,0.25); border-radius:999px;
    box-shadow:inset 0 2px 6px rgba(0,0,0,0.3);
  }
  body.light .context-tabs{
    background:rgba(255,255,255,0.7); border-color:rgba(26,58,143,0.18);
    box-shadow:inset 0 1px 4px rgba(26,58,143,0.08);
  }
  .context-tab{
    flex:1; display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:10px 16px; border-radius:999px; font-family:'Poppins',sans-serif; font-size:12.5px;
    font-weight:600; letter-spacing:0.3px; text-decoration:none; color:var(--ink-soft);
    transition:all 0.2s cubic-bezier(0.16,1,0.3,1); white-space:nowrap;
  }
  .context-tab svg{ width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .context-tab:hover{ color:#f3efe4; }
  body.light .context-tab:hover{ color:#0a1f44; }
  .context-tab.active{
    background:linear-gradient(135deg,#fae6a2 0%,#d9b872 50%,#aa8232 100%); color:#140e03; font-weight:700;
    box-shadow:0 4px 14px rgba(217,184,114,0.45), inset 0 1px 0 rgba(255,255,255,0.6);
  }
  body.light .context-tab.active{
    background:linear-gradient(135deg,#1f47b2 0%,#10296e 100%); color:#ffffff;
    box-shadow:0 4px 14px rgba(26,58,143,0.35);
  }

  /* ── Light mode (navy blue) ── */
  body.light{
    --ink:#0a1f44; --ink-soft:rgba(10,31,68,0.68); --ink-faint:rgba(10,31,68,0.42);
    --gold:#1a3a8f; --gold-soft:#15316f;
    --glass:linear-gradient(165deg, rgba(255,255,255,0.95) 0%, rgba(246,248,254,0.98) 100%);
    --glass-strong:#ffffff;
    --glass-border:rgba(26,58,143,0.18);
    background:
      radial-gradient(900px 560px at 15% -8%, rgba(26,58,143,0.06), transparent 60%),
      radial-gradient(1000px 700px at 100% 10%, rgba(26,58,143,0.08), transparent 55%),
      linear-gradient(160deg, #f5f7fc 0%, #eef1fa 55%, #f2effa 100%);
  }
  body.light h1{ text-shadow:none; }
  body.light .req-item{ background:#ffffff; border-color:rgba(26,58,143,0.14); box-shadow:0 4px 14px rgba(10,31,68,0.04); }
  body.light .req-check{ border-color:rgba(26,58,143,0.35); background:rgba(26,58,143,0.04); }
  body.light .req-item.done .req-check{ background:#1a3a8f; border-color:#1a3a8f; }
  body.light .req-item.done .req-check svg{ stroke:#ffffff; }
  body.light .req-qty{ background:linear-gradient(135deg, rgba(26,58,143,0.09), rgba(26,58,143,0.03)); border-color:rgba(26,58,143,0.25); color:#1a3a8f; box-shadow:none; }
  body.light .req-btn{ background:rgba(26,58,143,0.06); border-color:rgba(26,58,143,0.15); color:var(--ink-soft); }
  body.light .req-btn:hover{ color:#1a3a8f; background:rgba(26,58,143,0.12); border-color:rgba(26,58,143,0.35); }
  body.light .add-item-btn{ border-color:rgba(26,58,143,0.35); color:#1a3a8f; background:rgba(26,58,143,0.03); }
  body.light .add-item-btn:hover{ background:rgba(26,58,143,0.08); }
  body.light .picker{ background:#ffffff; border-color:rgba(26,58,143,0.22); box-shadow:0 8px 24px rgba(10,31,68,0.08); }
  body.light .picker-row input{ background:#ffffff; border-color:rgba(26,58,143,0.2); color:#0a1f44; }
  body.light .picker-row button{ background:rgba(26,58,143,0.06); border-color:rgba(26,58,143,0.18); color:var(--ink-soft); }
  body.light .picker-result{ background:rgba(26,58,143,0.03); border-color:rgba(26,58,143,0.12); }
  body.light .picker-result:hover{ background:rgba(26,58,143,0.1); border-color:rgba(26,58,143,0.3); }
  body.light .picker-custom{ background:rgba(26,58,143,0.04); border-color:rgba(26,58,143,0.3); color:#1a3a8f; }
  body.light .qty-step{ background:#ffffff; border-color:rgba(26,58,143,0.2); box-shadow:0 4px 14px rgba(10,31,68,0.04); }
  body.light .qty-step-controls button{ background:rgba(26,58,143,0.06); border-color:rgba(26,58,143,0.22); color:#0a1f44; }
  body.light .qty-step-controls button:hover{ background:#1a3a8f; color:#ffffff; }
  body.light .qty-step-val{ color:#1a3a8f; }
  body.light .qty-confirm-row .cancel-btn{ background:rgba(26,58,143,0.05); border-color:rgba(26,58,143,0.16); color:var(--ink-soft); }
  body.light .qty-confirm-row .confirm-btn{ background:linear-gradient(135deg,#1f47b2 0%,#10296e 100%); color:#ffffff; }
  body.light .empty-hint{ background:rgba(255,255,255,0.4); border-color:rgba(26,58,143,0.18); }
  body.light .toast{ background:#ffffff; border:1px solid rgba(26,58,143,0.22); color:#0a1f44; box-shadow:0 12px 32px rgba(10,31,68,0.15); }
</style>
</head>

  <header>
    <div class="crest">
      <span class="crest-line"></span>
      <span class="brand">Truefitt &amp; Hill</span>
      <span class="crest-line right"></span>
    </div>
    <h1>Product Requests</h1>
    <div class="subtitle" id="subtitle">Loading&hellip;</div>
  </header>

  <div class="context-tabs">
    <a class="context-tab" href="products.html">
      <svg viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
      Product Catalog
    </a>

      <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2m-6 9l2 2 4-4"/></svg>
      Product Requests
    </a>
  </div>

  <div class="panel">
    <div id="viewBody"></div>
  </div>

  <footer>Product Requests &nbsp;<span class="footer-gold">&middot;</span>&nbsp; Truefitt &amp; Hill</footer>
</div>

<div class="toast" id="toastEl"></div>

<script>
(function(){
  const COLLECTION = 'th-staff-tools';
  const DOC_ID = 'product-requests';

  let CATALOG = (window.TH_CATALOG || []).slice();

  let reqState = null;   // { items: [{id, name, qty, done}] }
  let reqDocRef = null;

  const toastEl = document.getElementById('toastEl');
  let toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3200);
  }

  // picker state machine: 'closed' -> 'search' -> 'qty'
  let pickerMode = 'closed';
  let pickerQuery = '';
  let pendingName = '';
  let pendingQty = 1;

  const subtitleEl = document.getElementById('subtitle');
  const viewBodyEl = document.getElementById('viewBody');

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function normName(s){ return (s || '').trim(); }
  function keyOf(s){ return normName(s).toLowerCase(); }
  function makeId(){ return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function load(){
    subtitleEl.textContent = 'Connecting\u2026';
    window.thAuthReady.then(function(){
      const db = window.thDB;

      reqDocRef = db.collection(COLLECTION).doc(DOC_ID);
      reqDocRef.onSnapshot(function(snap){
        if(snap.metadata.hasPendingWrites) return;
        reqState = snap.exists ? snap.data() : { items: [] };
        if(!Array.isArray(reqState.items)) reqState.items = [];
        render();
      }, function(err){
        console.error('Product requests sync error', err);
        subtitleEl.textContent = 'Could not connect \u2014 check your internet connection.';
      });

      db.collection(COLLECTION).doc('products').onSnapshot(function(snap){
        if(snap.exists && Array.isArray(snap.data().items)){
          CATALOG.length = 0;
          snap.data().items.forEach(p => CATALOG.push([p.name, p.category || '']));
          if(pickerMode !== 'closed') render();
        }
      }, function(err){ console.error('Product catalog sync error', err); });
    });
  }

  function save(){
    if(!reqDocRef || !reqState) return;
    const payload = Object.assign({}, reqState, { updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    reqDocRef.set(payload).catch(e => console.error('Could not save product requests', e));
  }

  function addOrMerge(name, qty){
    const k = keyOf(name);
    const existing = reqState.items.find(it => keyOf(it.name) === k);
    if(existing){
      existing.qty = (existing.qty || 0) + qty;
    } else {
      reqState.items.push({ id: makeId(), name: normName(name), qty: qty, done: false });
    }
    save();
    render();
    showToast('Added \u201c' + normName(name) + '\u201d \u00d7' + qty + ' to the list.');
  }

  function setQty(id, qty){
    const it = reqState.items.find(i => i.id === id);
    if(!it) return;
    if(qty <= 0){
      reqState.items = reqState.items.filter(i => i.id !== id);
    } else {
      it.qty = qty;
    }
    save();
    render();
  }

  function toggleDone(id){
    const it = reqState.items.find(i => i.id === id);
    if(!it) return;
    it.done = !it.done;
    save();
    render();
  }

  async function removeItem(id){
    const it = reqState.items.find(i => i.id === id);
    if(!it) return;
    const ok = await THDialog.confirm('Remove \u201c' + it.name + '\u201d from the list?', { okText: 'Remove', danger: true });
    if(!ok) return;
    reqState.items = reqState.items.filter(i => i.id !== id);
    save();
    render();
  }

  function render(){
    if(!reqState){
      subtitleEl.textContent = 'Connecting\u2026';
      viewBodyEl.innerHTML = '';
      return;
    }

    const items = reqState.items.slice();
    const pendingCount = items.filter(it => !it.done).length;
    subtitleEl.textContent = items.length === 0
      ? 'Nothing requested right now'
      : pendingCount + ' to fetch' + (items.length !== pendingCount ? ' \u00b7 ' + (items.length - pendingCount) + ' done' : '');

    viewBodyEl.innerHTML = '';

    if(items.length === 0 && pickerMode === 'closed'){
      const hint = document.createElement('div');
      hint.className = 'empty-hint';
      hint.innerHTML = '<span>All clear</span>Add a product below to build the fetch list.';
      viewBodyEl.appendChild(hint);
    } else if(items.length > 0){
      const ul = document.createElement('ul');
      ul.className = 'req-list';
      items.forEach(entry => {
        const li = document.createElement('li');
        li.className = 'req-item' + (entry.done ? ' done' : '');

        const check = document.createElement('div');
        check.className = 'req-check';
        check.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        check.addEventListener('click', () => toggleDone(entry.id));

        const nameWrap = document.createElement('div');
        nameWrap.className = 'req-name';
        nameWrap.textContent = entry.name;

        const qty = document.createElement('div');
        qty.className = 'req-qty';
        qty.textContent = entry.qty;

        const controls = document.createElement('div');
        controls.className = 'req-controls';

        const minus = document.createElement('button');
        minus.className = 'req-btn';
        minus.textContent = '\u2212';
        minus.title = 'Decrease quantity';
        minus.addEventListener('click', () => setQty(entry.id, entry.qty - 1));

        const plus = document.createElement('button');
        plus.className = 'req-btn';
        plus.textContent = '+';
        plus.title = 'Increase quantity';
        plus.addEventListener('click', () => setQty(entry.id, entry.qty + 1));

        const del = document.createElement('button');
        del.className = 'req-btn danger';
        del.innerHTML = '&times;';
        del.title = 'Remove item';
        del.addEventListener('click', () => removeItem(entry.id));

        controls.appendChild(minus);
        controls.appendChild(plus);
        controls.appendChild(del);

        li.appendChild(check);
        li.appendChild(nameWrap);
        li.appendChild(qty);
        li.appendChild(controls);
        ul.appendChild(li);
      });
      viewBodyEl.appendChild(ul);
    }

    if(pickerMode === 'search'){
      viewBodyEl.appendChild(renderSearchPicker());
    } else if(pickerMode === 'qty'){
      viewBodyEl.appendChild(renderQtyStep());
    } else {
      const addBtn = document.createElement('button');
      addBtn.className = 'add-item-btn';
      addBtn.textContent = '+ Add product';
      addBtn.addEventListener('click', () => { pickerMode = 'search'; pickerQuery = ''; render(); });
      viewBodyEl.appendChild(addBtn);
    }
  }

  function renderSearchPicker(){
    const wrap = document.createElement('div');
    wrap.className = 'picker';

    const row = document.createElement('div');
    row.className = 'picker-row';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'Search products\u2026';
    input.value = pickerQuery;
    const closeBtn = document.createElement('button');
    closeBtn.textContent = 'Close';
    closeBtn.addEventListener('click', () => { pickerMode = 'closed'; pickerQuery = ''; render(); });
    row.appendChild(input);
    row.appendChild(closeBtn);
    wrap.appendChild(row);

    const resultsWrap = document.createElement('div');
    resultsWrap.className = 'picker-results';
    wrap.appendChild(resultsWrap);

    function pickProduct(name){
      pendingName = normName(name);
      pendingQty = 1;
      pickerMode = 'qty';
      render();
    }

    function renderResults(){
      resultsWrap.innerHTML = '';
      const q = pickerQuery.trim().toLowerCase();
      if(!q){
        const hint = document.createElement('div');
        hint.className = 'picker-empty';
        hint.textContent = 'Start typing to search the product catalog.';
        resultsWrap.appendChild(hint);
        return;
      }
      const matches = CATALOG.filter(([name]) => name.toLowerCase().includes(q)).slice(0, 8);
      if(matches.length === 0){
        const empty = document.createElement('div');
        empty.className = 'picker-empty';
        empty.textContent = 'No matches in the catalog.';
        resultsWrap.appendChild(empty);
      } else {
        matches.forEach(([name, cat]) => {
          const r = document.createElement('div');
          r.className = 'picker-result';
          r.innerHTML = '<div class="picker-result-name">' + escapeHtml(name) + '</div><div class="picker-result-cat">' + escapeHtml(cat) + '</div>';
          r.addEventListener('click', () => pickProduct(name));
          resultsWrap.appendChild(r);
        });
      }
      const custom = document.createElement('div');
      custom.className = 'picker-custom';
      custom.textContent = 'Add \u201c' + pickerQuery.trim() + '\u201d as a new item';
      custom.addEventListener('click', () => pickProduct(pickerQuery.trim()));
      resultsWrap.appendChild(custom);
    }

    input.addEventListener('input', () => {
      pickerQuery = input.value;
      renderResults();
    });
    setTimeout(() => input.focus(), 0);

    renderResults();
    return wrap;
  }

  function renderQtyStep(){
    const wrap = document.createElement('div');
    wrap.className = 'picker';

    const step = document.createElement('div');
    step.className = 'qty-step';

    const nameEl = document.createElement('div');
    nameEl.className = 'qty-step-name';
    nameEl.textContent = pendingName;

    const controls = document.createElement('div');
    controls.className = 'qty-step-controls';

    const minus = document.createElement('button');
    minus.textContent = '\u2212';
    minus.addEventListener('click', () => { pendingQty = Math.max(1, pendingQty - 1); render(); });

    const val = document.createElement('div');
    val.className = 'qty-step-val';
    val.textContent = pendingQty;

    const plus = document.createElement('button');
    plus.textContent = '+';
    plus.addEventListener('click', () => { pendingQty = pendingQty + 1; render(); });

    controls.appendChild(minus);
    controls.appendChild(val);
    controls.appendChild(plus);

    step.appendChild(nameEl);
    step.appendChild(controls);
    wrap.appendChild(step);

    const confirmRow = document.createElement('div');
    confirmRow.className = 'qty-confirm-row';

    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'cancel-btn';
    cancelBtn.textContent = 'Back';
    cancelBtn.addEventListener('click', () => { pickerMode = 'search'; render(); });

    const confirmBtn = document.createElement('button');
    confirmBtn.className = 'confirm-btn';
    confirmBtn.textContent = 'Add to list';
    confirmBtn.addEventListener('click', () => {
      addOrMerge(pendingName, pendingQty);
      pickerMode = 'closed';
      pickerQuery = '';
    });

    confirmRow.appendChild(cancelBtn);
    confirmRow.appendChild(confirmBtn);
    wrap.appendChild(confirmRow);

    return wrap;
  }

  load();
})();
</script>
<script src="nav.js"></script>
<script src="shared.js"></script>
</body>
