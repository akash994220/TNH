<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T&H Station Checklist</title>
<style>html,body{background:#0d1535;}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="auth.js"></script>
<script src="catalog.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  :root{
    --ink:#f3efe4;
    --ink-soft:rgba(243,239,228,0.62);
    --ink-faint:rgba(243,239,228,0.4);
    --gold:#d9b872;
    --gold-soft:#a9884f;
    --green:#3a8562;
    --green-deep:#1f4a35;
    --red:#e08b7d;
    --amber:#d9a45c;
    --glass:rgba(255,255,255,0.055);
    --glass-strong:rgba(255,255,255,0.09);
    --glass-border:rgba(255,255,255,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Poppins',sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:48px 16px;
    background:
      radial-gradient(900px 560px at 15% -8%, rgba(217,184,114,0.16), transparent 60%),
      radial-gradient(1000px 700px at 100% 10%, rgba(26,58,143,0.35), transparent 55%),
      radial-gradient(800px 600px at 50% 120%, rgba(26,58,143,0.22), transparent 55%),
      linear-gradient(160deg, #0d1535 0%, #080d1e 45%, #120828 100%);
    background-attachment:fixed;
  }

  .app{ width:100%; max-width:560px; }

  header{ text-align:center; margin-bottom:22px; }
  .crest{ display:inline-flex; align-items:center; gap:12px; margin-bottom:10px; }
  .crest-line{ width:30px; height:1px; background:linear-gradient(90deg, transparent, var(--gold)); }
  .crest-line.right{background:linear-gradient(90deg, var(--gold), transparent);}
  .brand{
    font-family:'Poppins',sans-serif;
    font-size:12px; letter-spacing:4.5px; text-transform:uppercase;
    color:var(--gold); font-weight:400;
  }
  h1{
    font-family:'Poppins',sans-serif;
    font-weight:400; font-size:28px; letter-spacing:0.3px; margin:0;
    color:var(--ink); text-shadow:0 2px 20px rgba(0,0,0,0.4);
  }
  .subtitle{ font-size:12.5px; color:var(--ink-faint); margin-top:6px; letter-spacing:0.4px; }

  /* Breadcrumb */
  .breadcrumb{
    display:flex; align-items:center; flex-wrap:wrap; gap:6px;
    margin:0 4px 14px; font-size:12.5px; color:var(--ink-soft);
  }
  .crumb-back{
    display:inline-flex; align-items:center; gap:5px; color:var(--gold); cursor:pointer;
    background:rgba(217,184,114,0.08); border:1px solid rgba(217,184,114,0.3); border-radius:999px;
    font-size:12px; font-family:inherit; padding:6px 12px; transition:all .15s ease;
  }
  .crumb-back:hover{ background:rgba(217,184,114,0.16); border-color:rgba(217,184,114,0.55); }
  .crumb-back svg{ width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:2.2; }
  .crumb-sep{ color:var(--ink-faint); }
  .crumb-current{ color:var(--ink); font-weight:600; }
  .crumb-actions{ display:flex; gap:6px; margin-left:auto; }
  .crumb-action{
    width:28px; height:28px; border-radius:50%; background:rgba(0,0,0,0.2); border:none;
    color:var(--ink-faint); cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all .15s ease;
  }
  .crumb-action:hover{ color:var(--gold); background:rgba(217,184,114,0.14); }
  .crumb-action.danger:hover{ color:var(--red); background:rgba(224,139,125,0.14); }
  .crumb-action svg{ width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:1.8; }

  .panel{
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:28px;
    padding:20px;
    backdrop-filter:blur(24px) saturate(140%);
    -webkit-backdrop-filter:blur(24px) saturate(140%);
    box-shadow:
      0 24px 60px -20px rgba(0,0,0,0.6),
      0 2px 0 rgba(255,255,255,0.05) inset,
      0 -1px 0 rgba(0,0,0,0.3) inset;
    margin-bottom:16px;
  }

  /* Nav cards (groups / stations grid) */
  .card-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(148px,1fr)); gap:12px; }
  .nav-card{
    position:relative; background:var(--glass-strong); border:1px solid var(--glass-border);
    border-radius:20px; padding:16px 14px; cursor:pointer; display:flex; flex-direction:column;
    justify-content:space-between; min-height:112px; transition:all .15s ease;
  }
  .nav-card:hover{ border-color:rgba(217,184,114,0.45); }
  .status-dot{ width:9px; height:9px; border-radius:50%; flex:0 0 auto; }
  .status-dot.ok{ background:var(--green); box-shadow:0 0 6px rgba(58,133,98,0.8); }
  .status-dot.missing{ background:var(--red); box-shadow:0 0 6px rgba(224,139,125,0.7); }
  .status-dot.refill{ background:var(--amber); box-shadow:0 0 6px rgba(217,164,92,0.7); }
  .status-dot.empty{ background:rgba(255,255,255,0.2); }
  .nav-card-title{
    font-family:'Poppins',sans-serif; font-size:15px; color:var(--gold);
    line-height:1.3; word-break:break-word; margin-top:8px;
  }
  .nav-card-meta{ font-size:10.5px; color:var(--ink-faint); margin-top:6px; }
  .nav-card-actions{ display:flex; gap:5px; margin-top:10px; }
  .nav-card-action{
    width:26px; height:26px; border-radius:50%; background:rgba(0,0,0,0.22); border:none;
    color:var(--ink-faint); cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all .15s ease;
  }
  .nav-card-action:hover{ color:var(--gold); background:rgba(217,184,114,0.14); }
  .nav-card-action.danger:hover{ color:var(--red); background:rgba(224,139,125,0.14); }
  .nav-card-action svg{ width:12.5px; height:12.5px; stroke:currentColor; fill:none; stroke-width:1.8; }

  .add-nav-card{
    border:1px dashed rgba(217,184,114,0.5); background:transparent; display:flex;
    align-items:center; justify-content:center; min-height:112px; border-radius:20px;
    color:var(--gold); font-size:12.5px; letter-spacing:0.3px; cursor:pointer;
    flex-direction:column; gap:6px; transition:all .15s ease; font-family:inherit;
  }
  .add-nav-card:hover{ background:rgba(217,184,114,0.08); border-color:rgba(217,184,114,0.85); }
  .add-nav-card .plus{ font-size:22px; line-height:1; }

  .empty-hint{
    text-align:center; padding:36px 20px; color:var(--ink-faint); font-size:13px;
    border:1px dashed rgba(255,255,255,0.14); border-radius:20px; background:rgba(255,255,255,0.02);
    margin-bottom:14px;
  }
  .empty-hint span{ display:block; font-family:'Poppins',sans-serif; font-size:16px; color:var(--gold); margin-bottom:5px; }

  /* station-wide progress bar */
  .progress-row{
    display:flex; align-items:center; gap:12px; margin-bottom:18px;
    padding:12px 16px; border-radius:18px;
    background:rgba(0,0,0,0.18); border:1px solid rgba(255,255,255,0.06);
  }
  .progress-bar{
    flex:1; height:8px; border-radius:999px; background:rgba(255,255,255,0.08);
    overflow:hidden; display:flex;
  }
  .progress-seg.yes{ background:var(--green); }
  .progress-seg.refill{ background:var(--amber); }
  .progress-seg.no{ background:var(--red); }
  .progress-seg.unset{ background:rgba(255,255,255,0.12); }
  .progress-label{ font-size:11.5px; color:var(--ink-soft); white-space:nowrap; flex:0 0 auto; }

  .print-btn{
    width:100%; padding:12px; font-size:12.5px; letter-spacing:0.3px; text-align:center;
    border-radius:14px; cursor:pointer; background:rgba(217,184,114,0.06);
    border:1px solid rgba(217,184,114,0.3); color:var(--gold); font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin-bottom:16px; font-family:inherit;
    transition:all .15s ease;
  }
  .print-btn:hover{ background:rgba(217,184,114,0.14); border-color:rgba(217,184,114,0.55); }
  .print-btn:disabled{ opacity:0.55; cursor:default; }
  .print-btn svg{ width:15px; height:15px; stroke:var(--gold); fill:none; stroke-width:1.6; flex:0 0 auto; }

  /* Category cards */
  .categories{ display:flex; flex-direction:column; gap:14px; margin-bottom:16px; }
  .category{
    background:var(--glass-strong); border:1px solid var(--glass-border); border-radius:20px;
    padding:16px;
  }
  .cat-header{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    cursor:pointer; user-select:none;
  }
  .category.expanded .cat-header{ margin-bottom:12px; }
  .cat-header-left{ display:flex; align-items:center; gap:10px; min-width:0; flex:1; }
  .cat-chevron{
    flex:0 0 auto; width:18px; height:18px; color:var(--gold); opacity:0.75;
    display:flex; align-items:center; justify-content:center;
    transition:transform .2s ease;
  }
  .cat-chevron svg{ width:12px; height:12px; }
  .category.expanded .cat-chevron{ transform:rotate(90deg); }
  .cat-title-wrap{ min-width:0; }
  .cat-title{
    font-family:'Poppins',sans-serif; font-size:16px; color:var(--gold);
    letter-spacing:0.2px; word-break:break-word;
  }
  .cat-badges{ display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
  .cat-badge{ font-size:10px; letter-spacing:0.3px; padding:2px 8px; border-radius:999px; }
  .cat-badge.yes{ color:#8fd6ae; background:rgba(58,133,98,0.16); border:1px solid rgba(58,133,98,0.35); }
  .cat-badge.no{ color:var(--red); background:rgba(224,139,125,0.14); border:1px solid rgba(224,139,125,0.35); }
  .cat-badge.refill{ color:var(--amber); background:rgba(217,164,92,0.16); border:1px solid rgba(217,164,92,0.4); }
  .cat-badge.unset{ color:var(--ink-faint); background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); }
  .cat-del{
    flex:0 0 auto; width:26px; height:26px; border-radius:50%; background:none; border:none;
    color:var(--ink-faint); font-size:17px; cursor:pointer; display:flex; align-items:center;
    justify-content:center; transition:all .15s ease;
  }
  .cat-del:hover{ color:var(--red); background:rgba(224,139,125,0.12); }

  .items{ list-style:none; margin:0 0 12px; padding:0; display:flex; flex-direction:column; gap:8px; }
  .item{
    background:rgba(0,0,0,0.16); border:1px solid rgba(255,255,255,0.08); border-radius:14px;
    padding:11px 12px;
  }
  .item-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:9px; }
  .item-name{ font-size:13.5px; line-height:1.4; padding-top:1px; word-break:break-word; }
  .item-del{
    flex:0 0 auto; width:20px; height:20px; border-radius:50%; background:none; border:none;
    color:var(--ink-faint); font-size:15px; cursor:pointer; display:flex; align-items:center;
    justify-content:center; transition:all .15s ease;
  }
  .item-del:hover{ color:var(--red); background:rgba(224,139,125,0.12); }
  .status-btns{ display:flex; gap:6px; }
  .status-btn{
    flex:1; padding:8px 4px; font-size:11px; letter-spacing:0.2px; text-align:center;
    border-radius:10px; cursor:pointer; background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.12); color:var(--ink-soft);
    transition:all .15s ease;
  }
  .status-btn:hover{ border-color:rgba(255,255,255,0.3); }
  .status-btn.yes.active{ background:linear-gradient(135deg, var(--green), var(--green-deep)); border-color:var(--green); color:#fbf7ea; }
  .status-btn.no.active{ background:rgba(224,139,125,0.9); border-color:var(--red); color:#2a1512; }
  .status-btn.refill.active{ background:linear-gradient(135deg, #e3c684, var(--amber)); border-color:var(--amber); color:#2a1e0c; }

  .remark-input{
    width:100%; margin-top:8px; padding:8px 14px; font-size:12px; line-height:1.3;
    border-radius:999px; border:1px solid rgba(255,255,255,0.1); background:rgba(0,0,0,0.2);
    color:var(--ink); font-family:inherit; outline:none; box-sizing:border-box;
    transition:border-color .15s ease, background .15s ease;
  }
  .remark-input::placeholder{ color:var(--ink-faint); }
  .remark-input:focus{ border-color:rgba(217,184,114,0.5); background:rgba(0,0,0,0.28); }

  .add-item-btn{
    width:100%; padding:10px; font-size:12px; letter-spacing:0.3px; text-align:center;
    border-radius:12px; cursor:pointer; background:transparent;
    border:1px dashed rgba(217,184,114,0.4); color:var(--gold);
    transition:all .15s ease;
  }
  .add-item-btn:hover{ background:rgba(217,184,114,0.08); border-color:rgba(217,184,114,0.7); }

  /* Picker */
  .picker{
    margin-top:10px; padding:12px; border-radius:14px;
    background:rgba(0,0,0,0.22); border:1px solid rgba(217,184,114,0.25);
  }
  .picker-row{ display:flex; gap:8px; margin-bottom:8px; }
  .picker-row input{
    flex:1; padding:10px 14px; font-size:13px; border:1px solid rgba(255,255,255,0.12);
    border-radius:999px; background:rgba(0,0,0,0.25); color:var(--ink); font-family:inherit;
    outline:none;
  }
  .picker-row input:focus{ border-color:rgba(217,184,114,0.5); }
  .picker-row button{
    flex:0 0 auto; padding:0 14px; font-size:12px; border-radius:999px; cursor:pointer;
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.14); color:var(--ink-soft);
  }
  .picker-results{ display:flex; flex-direction:column; gap:5px; max-height:230px; overflow-y:auto; }
  .picker-result{
    display:flex; flex-direction:column; padding:9px 12px; border-radius:10px; cursor:pointer;
    background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08);
    transition:background .15s ease, border-color .15s ease;
  }
  .picker-result:hover{ background:rgba(217,184,114,0.1); border-color:rgba(217,184,114,0.4); }
  .picker-result-name{ font-size:13px; }
  .picker-result-cat{ font-size:10.5px; color:var(--ink-faint); margin-top:1px; }
  .picker-custom{
    display:flex; align-items:center; justify-content:center; gap:6px;
    padding:10px 12px; border-radius:10px; cursor:pointer; margin-top:2px;
    background:rgba(217,184,114,0.08); border:1px dashed rgba(217,184,114,0.5); color:var(--gold);
    font-size:12.5px; text-align:center;
  }
  .picker-custom:hover{ background:rgba(217,184,114,0.16); }
  .picker-empty{ text-align:center; font-size:11.5px; color:var(--ink-faint); padding:8px; }
  .picker-hint{ font-size:10.5px; color:var(--ink-faint); text-align:center; padding:4px 0 0; }

  .add-cat-btn{
    width:100%; padding:13px; font-size:13px; letter-spacing:0.3px; text-align:center;
    border-radius:14px; cursor:pointer; background:rgba(217,184,114,0.06);
    border:1px solid rgba(217,184,114,0.3); color:var(--gold); font-weight:600;
    transition:all .15s ease;
  }
  .add-cat-btn:hover{ background:rgba(217,184,114,0.14); border-color:rgba(217,184,114,0.55); }

  /* ---- Custom modal (Add item to stations) ---- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(5,8,20,0.68); backdrop-filter:blur(3px);
    display:flex; align-items:flex-end; justify-content:center; z-index:500;
    padding:0; opacity:0; pointer-events:none; transition:opacity .18s ease;
  }
  .modal-overlay.open{ opacity:1; pointer-events:auto; }
  @media (min-width:640px){ .modal-overlay{ align-items:center; padding:24px; } }
  .modal-box{
    width:100%; max-width:520px; max-height:88vh; overflow-y:auto;
    background:linear-gradient(160deg, #16204a 0%, #0d1330 60%, #1a0f38 100%);
    border:1px solid rgba(217,184,114,0.28); border-radius:22px 22px 0 0;
    box-shadow:0 -8px 40px rgba(0,0,0,0.5); padding:22px 20px 24px;
    transform:translateY(16px); transition:transform .18s ease;
  }
  .modal-overlay.open .modal-box{ transform:translateY(0); }
  @media (min-width:640px){ .modal-box{ border-radius:22px; } }
  .modal-title{ font-size:16px; font-weight:600; color:var(--gold); margin:0 0 3px; }
  .modal-sub{ font-size:12px; color:var(--ink-soft); margin:0 0 16px; }
  .modal-section{ margin-bottom:16px; }
  .modal-label{ font-size:11px; letter-spacing:0.6px; text-transform:uppercase; color:var(--ink-faint); margin-bottom:8px; font-weight:600; }
  .modal-close{
    position:absolute; top:16px; right:16px; width:30px; height:30px; border-radius:50%;
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.14); color:var(--ink-soft);
    cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:15px;
  }
  .modal-close:hover{ background:rgba(255,255,255,0.12); }
  .modal-box{ position:relative; }

  .cat-pick-list{ display:flex; flex-direction:column; gap:6px; max-height:180px; overflow-y:auto; }
  .cat-pick-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:11px 13px; border-radius:12px; cursor:pointer;
    background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08);
    transition:background .15s ease, border-color .15s ease;
  }
  .cat-pick-row:hover{ background:rgba(217,184,114,0.08); border-color:rgba(217,184,114,0.35); }
  .cat-pick-row.selected{ background:rgba(217,184,114,0.16); border-color:rgba(217,184,114,0.6); }
  .cat-pick-name{ font-size:13px; }
  .cat-pick-count{ font-size:10.5px; color:var(--ink-faint); white-space:nowrap; }
  .cat-pick-count.missing{ color:var(--amber); }
  .new-cat-row{ display:flex; gap:8px; margin-top:8px; }
  .new-cat-row input{
    flex:1; padding:10px 14px; font-size:13px; border:1px solid rgba(255,255,255,0.12);
    border-radius:999px; background:rgba(0,0,0,0.25); color:var(--ink); font-family:inherit; outline:none;
  }
  .new-cat-row input:focus{ border-color:rgba(217,184,114,0.5); }
  .new-cat-row button{
    flex:0 0 auto; padding:0 16px; font-size:12px; border-radius:999px; cursor:pointer;
    background:rgba(217,184,114,0.1); border:1px solid rgba(217,184,114,0.4); color:var(--gold); font-weight:600;
  }
  .new-cat-row button:hover{ background:rgba(217,184,114,0.2); }

  .station-check-list{ display:flex; flex-direction:column; gap:5px; max-height:190px; overflow-y:auto; }
  .station-check-row{
    display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:10px;
    background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); cursor:pointer;
  }
  .station-check-row:hover{ background:rgba(255,255,255,0.06); }
  .station-check-row input[type=checkbox]{ width:16px; height:16px; accent-color:var(--gold); cursor:pointer; }
  .station-check-name{ font-size:13px; flex:1; }
  .station-check-tag{ font-size:10px; color:var(--amber); }
  .station-select-actions{ display:flex; gap:8px; margin:8px 0 2px; }
  .station-select-actions button{
    flex:1; padding:7px; font-size:11px; border-radius:999px; cursor:pointer;
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.14); color:var(--ink-soft);
  }
  .station-select-actions button:hover{ background:rgba(255,255,255,0.1); }

  .product-input-wrap{ position:relative; }
  .product-input-wrap input{
    width:100%; padding:11px 14px; font-size:13px; border:1px solid rgba(255,255,255,0.12);
    border-radius:14px; background:rgba(0,0,0,0.25); color:var(--ink); font-family:inherit; outline:none;
  }
  .product-input-wrap input:focus{ border-color:rgba(217,184,114,0.5); }
  .product-suggestions{
    position:absolute; top:calc(100% + 6px); left:0; right:0; max-height:200px; overflow-y:auto;
    background:#161c3d; border:1px solid rgba(217,184,114,0.3); border-radius:12px; z-index:10;
    box-shadow:0 8px 24px rgba(0,0,0,0.4);
  }
  .product-suggestion{ padding:10px 13px; font-size:13px; cursor:pointer; }
  .product-suggestion:hover{ background:rgba(217,184,114,0.14); }

  .modal-confirm-btn{
    width:100%; padding:14px; font-size:13.5px; font-weight:700; letter-spacing:0.3px;
    border-radius:999px; cursor:pointer; border:none; margin-top:4px;
    background:linear-gradient(135deg, var(--gold), var(--gold-soft)); color:#1a1305;
    transition:filter .15s ease;
  }
  .modal-confirm-btn:hover{ filter:brightness(1.08); }
  .modal-confirm-btn:disabled{ opacity:0.4; cursor:not-allowed; filter:none; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(10px);
    background:#16204a; border:1px solid rgba(217,184,114,0.4); color:var(--ink);
    padding:12px 20px; border-radius:999px; font-size:12.5px; z-index:600;
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
    box-shadow:0 8px 24px rgba(0,0,0,0.4); text-align:center; max-width:90vw;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  footer{ text-align:center; margin-top:24px; font-size:11px; color:var(--ink-faint); letter-spacing:0.3px; }
  .footer-gold{color:var(--gold);}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
  @media (max-width:420px){
    .panel{border-radius:22px; padding:16px;}
    h1{font-size:24px;}
    .status-btn{font-size:10px; padding:8px 2px;}
    .card-grid{grid-template-columns:repeat(auto-fill, minmax(130px,1fr));}
  }

  /* ── Light mode (navy blue) ── */
  body.light{
    --ink:#0a1f44; --ink-soft:rgba(10,31,68,0.68); --ink-faint:rgba(10,31,68,0.42);
    --gold:#1a3a8f; --gold-soft:#15316f;
    --glass:rgba(255,255,255,0.7); --glass-strong:rgba(255,255,255,0.85); --glass-border:rgba(26,58,143,0.15);
    background:
      radial-gradient(900px 560px at 15% -8%, rgba(26,58,143,0.06), transparent 60%),
      radial-gradient(1000px 700px at 100% 10%, rgba(26,58,143,0.08), transparent 55%),
      linear-gradient(160deg, #f5f7fc 0%, #eef1fa 55%, #f2effa 100%);
  }
  body.light .remark-input{ background:rgba(255,255,255,0.6); border-color:rgba(26,58,143,0.15); }
  body.light .picker-custom{ background:rgba(26,58,143,0.05); }
</style>
</head>
<body>
<script>try{if(localStorage.getItem('th-theme')==='light')document.body.classList.add('light');}catch(e){}</script>
<div class="app">
  <header>
    <div class="crest">
      <span class="crest-line"></span>
      <span class="brand">Truefitt &amp; Hill</span>
      <span class="crest-line right"></span>
    </div>
    <h1 id="pageTitle">Station Checklist</h1>
    <div class="subtitle" id="subtitle">Loading&hellip;</div>
  </header>

  <div class="breadcrumb" id="breadcrumb" style="display:none;"></div>

  <div class="panel" id="mainPanel">
    <div id="viewBody"></div>
  </div>

  <footer>Station Checklist &nbsp;<span class="footer-gold">&middot;</span>&nbsp; Truefitt &amp; Hill</footer>
</div>

<div class="modal-overlay" id="everywhereModal">
  <div class="modal-box" id="everywhereModalBox"></div>
</div>
<div class="toast" id="toastEl"></div>

<script>
(function(){
  const DOC_COLLECTION = 'th-staff-tools';
  const DOC_ID = 'station-checklist';

  // Product catalog defaults to the static bootstrap file for instant search,
  // then swaps to the live Products page data (th-staff-tools/products) once it loads —
  // so edits made on the Products page show up here without a redeploy.
  let CATALOG = (window.TH_CATALOG || []).slice();

  const DEFAULT_STATE = {
    groups: [{ id: 'g_default', title: 'Service Station' }],
    stations: [{ id: 'st_default', title: 'Station 1', groupId: 'g_default' }],
    data: { 'st_default': [] },
    view: 'groups',
    activeGroup: null,
    activeStation: null
  };

  let state = null;
  let docRef = null;
  let openPicker = null;   // category id whose "add item" picker is open
  let pickerQuery = '';
  let expandedCats = new Set(); // category ids currently expanded

  const pageTitleEl = document.getElementById('pageTitle');
  const subtitleEl = document.getElementById('subtitle');
  const breadcrumbEl = document.getElementById('breadcrumb');
  const viewBodyEl = document.getElementById('viewBody');

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ---------- Migration ----------
  function migrateIfNeeded(data){
    if(data && Array.isArray(data.groups) && Array.isArray(data.stations) && typeof data.data === 'object'){
      return data;
    }
    // Old flat format: { stations: [names...], active: name, data: { name: [cats] } }
    if(data && Array.isArray(data.stations) && typeof data.data === 'object'){
      const groupId = 'g_migrated';
      const migrated = {
        groups: [{ id: groupId, title: 'Stations' }],
        stations: data.stations.map(name => ({ id: name, title: name, groupId: groupId })),
        data: data.data,
        view: 'groups',
        activeGroup: null,
        activeStation: null
      };
      return migrated;
    }
    return JSON.parse(JSON.stringify(DEFAULT_STATE));
  }

  function applyIncoming(data){
    state = migrateIfNeeded(data);
    if(!state.groups || !state.groups.length){
      state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    }
    if(!state.data) state.data = {};
    state.stations.forEach(s => { if(!state.data[s.id]) state.data[s.id] = []; });
    // Validate active pointers
    if(state.activeGroup && !state.groups.some(g => g.id === state.activeGroup)){
      state.activeGroup = null;
    }
    if(state.activeStation && !state.stations.some(s => s.id === state.activeStation)){
      state.activeStation = null;
    }
    if(state.view === 'stations' && !state.activeGroup) state.view = 'groups';
    if(state.view === 'checklist' && !state.activeStation) state.view = state.activeGroup ? 'stations' : 'groups';
    if(!state.view) state.view = 'groups';
    render();
  }

  function load(){
    subtitleEl.textContent = 'Connecting\u2026';
    window.thAuthReady.then(function(){
      docRef = window.thDB.collection(DOC_COLLECTION).doc(DOC_ID);
      docRef.onSnapshot(function(snap){
        if(snap.metadata.hasPendingWrites) return; // ignore this device's own echo
        if(snap.exists){
          applyIncoming(snap.data());
        } else {
          state = JSON.parse(JSON.stringify(DEFAULT_STATE));
          save();
          render();
        }
      }, function(err){
        console.error('Sync error', err);
        subtitleEl.textContent = 'Could not connect \u2014 check your internet connection.';
      });
    });
  }

  function save(){
    if(!docRef || !state) return;
    const payload = Object.assign({}, state, { updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    docRef.set(payload).catch(e => console.error('Could not save', e));
  }

  // Debounced save for free-typing fields (like remarks) so we don't write
  // to Firestore on every keystroke and don't need to re-render mid-typing.
  let saveTimer = null;
  function queueSave(){
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { saveTimer = null; save(); }, 600);
  }

  // ---------- Data helpers ----------
  function groupById(id){ return state.groups.find(g => g.id === id); }
  function stationById(id){ return state.stations.find(s => s.id === id); }
  function stationsInGroup(groupId){ return state.stations.filter(s => s.groupId === groupId); }

  function categoriesForStation(stationId){
    if(!state.data[stationId]) state.data[stationId] = [];
    return state.data[stationId];
  }

  function activeCats(){
    return categoriesForStation(state.activeStation);
  }

  function itemsOfStation(stationId){
    const cats = state.data[stationId] || [];
    let items = [];
    cats.forEach(c => items = items.concat(c.items));
    return items;
  }

  function itemsOfGroup(groupId){
    let items = [];
    stationsInGroup(groupId).forEach(s => { items = items.concat(itemsOfStation(s.id)); });
    return items;
  }

  function itemsStatus(items){
    if(items.length === 0) return 'empty';
    if(items.some(i => i.status === 'no')) return 'missing';
    if(items.some(i => i.status === 'refill')) return 'refill';
    if(items.some(i => !i.status)) return 'empty';
    return 'ok';
  }

  function countsFor(items){
    return {
      yes: items.filter(i => i.status === 'yes').length,
      no: items.filter(i => i.status === 'no').length,
      refill: items.filter(i => i.status === 'refill').length,
      unset: items.filter(i => !i.status).length
    };
  }

  // ---------- Navigation ----------
  function goToGroups(){
    state.view = 'groups';
    state.activeGroup = null;
    state.activeStation = null;
    openPicker = null;
    save();
    render();
  }

  function openGroup(groupId){
    state.view = 'stations';
    state.activeGroup = groupId;
    state.activeStation = null;
    openPicker = null;
    save();
    render();
  }

  function openStation(stationId){
    const st = stationById(stationId);
    state.view = 'checklist';
    state.activeGroup = st ? st.groupId : state.activeGroup;
    state.activeStation = stationId;
    openPicker = null;
    save();
    render();
  }

  function backToStations(){
    state.view = 'stations';
    state.activeStation = null;
    openPicker = null;
    save();
    render();
  }

  // ---------- Group CRUD ----------
  async function addGroup(){
    const name = await THDialog.prompt('Name for the new group:', '', { title: 'Add group', placeholder: 'e.g. Service Station, Desks, Pantry Room' });
    if(!name) return;
    const trimmed = name.trim();
    if(!trimmed) return;
    if(state.groups.some(g => g.title.toLowerCase() === trimmed.toLowerCase())){
      await THDialog.alert('A group with that name already exists.');
      return;
    }
    state.groups.push({ id: uid(), title: trimmed });
    save();
    render();
  }

  async function renameGroup(groupId){
    const g = groupById(groupId);
    if(!g) return;
    const name = await THDialog.prompt('Rename group:', g.title, { title: 'Rename group' });
    if(!name) return;
    const trimmed = name.trim();
    if(!trimmed || trimmed === g.title) return;
    if(state.groups.some(x => x.id !== groupId && x.title.toLowerCase() === trimmed.toLowerCase())){
      await THDialog.alert('A group with that name already exists.');
      return;
    }
    g.title = trimmed;
    save();
    render();
  }

  async function deleteGroup(groupId){
    const g = groupById(groupId);
    if(!g) return;
    const stCount = stationsInGroup(groupId).length;
    const msg = stCount > 0
      ? 'Delete "' + g.title + '" and all ' + stCount + ' station(s) inside it, including their checklists?'
      : 'Delete "' + g.title + '"?';
    const ok = await THDialog.confirm(msg, { title: 'Delete group', okText: 'Delete', danger: true });
    if(!ok) return;
    const removedStationIds = stationsInGroup(groupId).map(s => s.id);
    state.groups = state.groups.filter(x => x.id !== groupId);
    state.stations = state.stations.filter(s => s.groupId !== groupId);
    removedStationIds.forEach(id => { delete state.data[id]; });
    if(state.activeGroup === groupId){
      state.activeGroup = null;
      state.activeStation = null;
      state.view = 'groups';
    }
    save();
    render();
  }

  // ---------- Station CRUD ----------
  async function addStation(groupId){
    const name = await THDialog.prompt('Name for the new station:', '', { title: 'Add station', placeholder: 'e.g. Station 1, Station 2' });
    if(!name) return;
    const trimmed = name.trim();
    if(!trimmed) return;
    if(stationsInGroup(groupId).some(s => s.title.toLowerCase() === trimmed.toLowerCase())){
      await THDialog.alert('A station with that name already exists in this group.');
      return;
    }
    const id = uid();
    state.stations.push({ id: id, title: trimmed, groupId: groupId });
    state.data[id] = [];
    save();
    render();
  }

  async function renameStation(stationId){
    const st = stationById(stationId);
    if(!st) return;
    const name = await THDialog.prompt('Rename station:', st.title, { title: 'Rename station' });
    if(!name) return;
    const trimmed = name.trim();
    if(!trimmed || trimmed === st.title) return;
    if(stationsInGroup(st.groupId).some(s => s.id !== stationId && s.title.toLowerCase() === trimmed.toLowerCase())){
      await THDialog.alert('A station with that name already exists in this group.');
      return;
    }
    st.title = trimmed;
    save();
    render();
  }

  async function duplicateStation(stationId){
    const source = stationById(stationId);
    if(!source) return;
    const sourceCats = state.data[stationId] || [];

    let suggestion = source.title + ' Copy';
    let n = 2;
    while(stationsInGroup(source.groupId).some(s => s.title === suggestion)){ suggestion = source.title + ' Copy ' + n; n++; }

    const name = await THDialog.prompt('Name for the duplicated station:', suggestion, { title: 'Duplicate station' });
    if(!name) return;
    const trimmed = name.trim();
    if(!trimmed) return;
    if(stationsInGroup(source.groupId).some(s => s.title.toLowerCase() === trimmed.toLowerCase())){
      await THDialog.alert('A station with that name already exists in this group.');
      return;
    }

    const clonedCats = sourceCats.map(cat => ({
      id: uid(),
      title: cat.title,
      items: cat.items.map(item => ({ id: uid(), name: item.name, status: null }))
    }));

    const newId = uid();
    state.stations.push({ id: newId, title: trimmed, groupId: source.groupId });
    state.data[newId] = clonedCats;
    save();
    render();
  }

  async function deleteStation(stationId){
    const st = stationById(stationId);
    if(!st) return;
    const ok = await THDialog.confirm('Delete "' + st.title + '" and its entire checklist?', { title: 'Delete station', okText: 'Delete', danger: true });
    if(!ok) return;
    state.stations = state.stations.filter(s => s.id !== stationId);
    delete state.data[stationId];
    if(state.activeStation === stationId){
      state.activeStation = null;
      state.view = 'stations';
    }
    save();
    render();
  }

  // ---------- Icons ----------
  const ICON_BACK = '<svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const ICON_EDIT = '<svg viewBox="0 0 24 24" fill="none"><path d="M4 20l1-4.2L15.5 5.3a1.5 1.5 0 0 1 2.1 0l1.1 1.1a1.5 1.5 0 0 1 0 2.1L8.2 19 4 20z" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 7h14M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-8 0v12a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const ICON_COPY = '<svg viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="11" height="11" rx="1.5"/><path d="M5 15V5a1 1 0 0 1 1-1h10" stroke-linecap="round"/></svg>';

  // ---------- Rendering ----------
  function render(){
    if(!state){ return; }
    if(state.view === 'groups'){
      pageTitleEl.textContent = 'Station Checklist';
      breadcrumbEl.style.display = 'none';
      renderGroupsView();
    } else if(state.view === 'stations'){
      const g = groupById(state.activeGroup);
      pageTitleEl.textContent = g ? g.title : 'Station Checklist';
      renderStationsBreadcrumb(g);
      renderStationsView(g);
    } else if(state.view === 'checklist'){
      const st = stationById(state.activeStation);
      pageTitleEl.textContent = st ? st.title : 'Station Checklist';
      renderChecklistBreadcrumb(st);
      renderChecklistView(st);
    }
  }

  function updateSubtitleGroups(){
    const allItems = [];
    state.stations.forEach(s => { allItems.push.apply(allItems, itemsOfStation(s.id)); });
    const withItems = state.stations.filter(s => itemsOfStation(s.id).length > 0);
    if(withItems.length === 0){
      subtitleEl.textContent = 'Build your first checklist below';
      return;
    }
    const fullyStocked = withItems.filter(s => itemsStatus(itemsOfStation(s.id)) === 'ok').length;
    subtitleEl.textContent = fullyStocked + ' of ' + withItems.length + ' stations fully stocked';
  }

  function renderGroupsView(){
    updateSubtitleGroups();
    viewBodyEl.innerHTML = '';

    const grid = document.createElement('div');
    grid.className = 'card-grid';

    if(state.groups.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty-hint';
      empty.innerHTML = '<span>No groups yet</span>Add a group like "Service Station", "Desks" or "Pantry Room" to get started';
      viewBodyEl.appendChild(empty);
    } else {
      state.groups.forEach(g => {
        const stations = stationsInGroup(g.id);
        const status = itemsStatus(itemsOfGroup(g.id));
        const card = document.createElement('div');
        card.className = 'nav-card';
        card.addEventListener('click', () => openGroup(g.id));

        const top = document.createElement('div');
        top.className = 'status-dot ' + status;
        card.appendChild(top);

        const title = document.createElement('div');
        title.className = 'nav-card-title';
        title.textContent = g.title;
        card.appendChild(title);

        const meta = document.createElement('div');
        meta.className = 'nav-card-meta';
        meta.textContent = stations.length + (stations.length === 1 ? ' station' : ' stations');
        card.appendChild(meta);

        const actions = document.createElement('div');
        actions.className = 'nav-card-actions';
        const editBtn = makeIconBtn(ICON_EDIT, 'Rename group', (e) => { e.stopPropagation(); renameGroup(g.id); });
        const delBtn = makeIconBtn(ICON_TRASH, 'Delete group', (e) => { e.stopPropagation(); deleteGroup(g.id); }, true);
        actions.appendChild(editBtn);
        actions.appendChild(delBtn);
        card.appendChild(actions);

        grid.appendChild(card);
      });
    }

    const addCard = document.createElement('button');
    addCard.className = 'add-nav-card';
    addCard.innerHTML = '<span class="plus">+</span><span>Add group</span>';
    addCard.addEventListener('click', addGroup);
    grid.appendChild(addCard);

    viewBodyEl.appendChild(grid);

    const addEverywhereBtn = document.createElement('button');
    addEverywhereBtn.className = 'add-cat-btn';
    addEverywhereBtn.style.marginTop = '14px';
    addEverywhereBtn.textContent = '+ Add item to every station';
    addEverywhereBtn.addEventListener('click', addItemToAllStations);
    viewBodyEl.appendChild(addEverywhereBtn);
  }

  // ---------- Add item to stations (custom modal) ----------
  const modalOverlayEl = document.getElementById('everywhereModal');
  const modalBoxEl = document.getElementById('everywhereModalBox');
  const toastEl = document.getElementById('toastEl');
  let toastTimer = null;

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3200);
  }

  function closeModal(){
    modalOverlayEl.classList.remove('open');
  }
  modalOverlayEl.addEventListener('click', (e) => { if(e.target === modalOverlayEl) closeModal(); });

  // All categories that exist on ANY station, with which stations have them.
  function unionCategoriesInfo(){
    const map = new Map(); // lowercase title -> { title, stationIds:Set }
    state.stations.forEach(st => {
      categoriesForStation(st.id).forEach(cat => {
        const key = cat.title.toLowerCase();
        if(!map.has(key)) map.set(key, { title: cat.title, stationIds: new Set() });
        map.get(key).stationIds.add(st.id);
      });
    });
    return [...map.values()].sort((a, b) => a.title.localeCompare(b.title));
  }

  // Product names pulled from the live catalog + anything already typed into any checklist.
  function allKnownProductNames(){
    const set = new Set();
    CATALOG.forEach(p => { if(p[0]) set.add(p[0]); });
    state.stations.forEach(st => {
      categoriesForStation(st.id).forEach(cat => {
        cat.items.forEach(it => { if(it.name) set.add(it.name); });
      });
    });
    return [...set].sort((a, b) => a.localeCompare(b));
  }

  function addItemToAllStations(){
    if(!state){ showToast('Still connecting \u2014 please wait a moment.'); return; }
    if(state.stations.length === 0){ showToast('Add a station first.'); return; }
    openCategoryStep();
    modalOverlayEl.classList.add('open');
  }

  function openCategoryStep(){
    const cats = unionCategoriesInfo();
    const totalStations = state.stations.length;

    modalBoxEl.innerHTML = '';
    const closeBtn = document.createElement('button');
    closeBtn.className = 'modal-close';
    closeBtn.innerHTML = '&times;';
    closeBtn.addEventListener('click', closeModal);
    modalBoxEl.appendChild(closeBtn);

    const title = document.createElement('div');
    title.className = 'modal-title';
    title.textContent = 'Add item to stations';
    modalBoxEl.appendChild(title);

    const sub = document.createElement('div');
    sub.className = 'modal-sub';
    sub.textContent = 'Step 1 of 2 \u2014 choose a category';
    modalBoxEl.appendChild(sub);

    const section = document.createElement('div');
    section.className = 'modal-section';
    const label = document.createElement('div');
    label.className = 'modal-label';
    label.textContent = 'Existing categories';
    section.appendChild(label);

    const list = document.createElement('div');
    list.className = 'cat-pick-list';
    if(cats.length === 0){
      const empty = document.createElement('div');
      empty.className = 'picker-empty';
      empty.textContent = 'No categories yet \u2014 create one below.';
      list.appendChild(empty);
    }
    cats.forEach(c => {
      const row = document.createElement('div');
      row.className = 'cat-pick-row';
      const name = document.createElement('div');
      name.className = 'cat-pick-name';
      name.textContent = c.title;
      const count = document.createElement('div');
      const have = c.stationIds.size;
      const missing = totalStations - have;
      count.className = 'cat-pick-count' + (missing > 0 ? ' missing' : '');
      count.textContent = missing > 0
        ? have + ' of ' + totalStations + ' stations \u2014 ' + missing + ' missing'
        : 'all ' + totalStations + ' stations';
      row.appendChild(name);
      row.appendChild(count);
      row.addEventListener('click', () => openStationStep(c.title, c.stationIds));
      list.appendChild(row);
    });
    section.appendChild(list);
    modalBoxEl.appendChild(section);

    const newSection = document.createElement('div');
    newSection.className = 'modal-section';
    const newLabel = document.createElement('div');
    newLabel.className = 'modal-label';
    newLabel.textContent = 'Or create a new category';
    newSection.appendChild(newLabel);
    const newRow = document.createElement('div');
    newRow.className = 'new-cat-row';
    const newInput = document.createElement('input');
    newInput.type = 'text';
    newInput.placeholder = 'e.g. Aftershave Balm';
    newInput.maxLength = 80;
    const newBtn = document.createElement('button');
    newBtn.textContent = 'Use this';
    const submitNew = () => {
      const trimmed = newInput.value.trim();
      if(!trimmed) return;
      openStationStep(trimmed, new Set());
    };
    newBtn.addEventListener('click', submitNew);
    newInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') submitNew(); });
    newRow.appendChild(newInput);
    newRow.appendChild(newBtn);
    newSection.appendChild(newRow);
    modalBoxEl.appendChild(newSection);
  }

  function openStationStep(catTitle, stationIdsWithCat){
    const totalStations = state.stations.length;

    modalBoxEl.innerHTML = '';
    const closeBtn = document.createElement('button');
    closeBtn.className = 'modal-close';
    closeBtn.innerHTML = '&times;';
    closeBtn.addEventListener('click', closeModal);
    modalBoxEl.appendChild(closeBtn);

    const backRow = document.createElement('div');
    backRow.style.cssText = 'font-size:11px;color:var(--gold);cursor:pointer;margin-bottom:8px;';
    backRow.textContent = '\u2039 Back to category';
    backRow.addEventListener('click', openCategoryStep);
    modalBoxEl.appendChild(backRow);

    // Product field: type-ahead over catalog + already-used item names, or type a custom one.
    const pSection = document.createElement('div');

    suggestBox.className = 'product-suggestions';

    const names = allKnownProductNames();
    function renderSuggestions(){
      const q = pInput.value.trim().toLowerCase();
      suggestBox.innerHTML = '';
      if(!q){ suggestBox.style.display = 'none'; return; }
      const matches = names.filter(n => n.toLowerCase().includes(q)).slice(0, 8);
      if(matches.length === 0){ suggestBox.style.display = 'none'; return; }
      matches.forEach(n => {
        const opt = document.createElement('div');
        opt.className = 'product-suggestion';
        opt.textContent = n;
        opt.addEventListener('mousedown', (e) => {
          e.preventDefault();
          pInput.value = n;
          suggestBox.style.display = 'none';
        });
        suggestBox.appendChild(opt);
      });
      suggestBox.style.display = 'block';
    }
    pInput.addEventListener('input', renderSuggestions);
    pInput.addEventListener('focus', renderSuggestions);
    pInput.addEventListener('blur', () => setTimeout(() => { suggestBox.style.display = 'none'; }, 120));

    const confirmBtn = document.createElement('button');
    confirmBtn.className = 'modal-confirm-btn';
    confirmBtn.textContent = 'Add to selected stations';
    confirmBtn.addEventListener('click', () => {
      const itemName = pInput.value.trim();
      if(!itemName){ pInput.focus(); return; }
      const selectedIds = checkboxes.filter(cb => cb.checked).map(cb => cb.dataset.stationId);
      if(selectedIds.length === 0){ showToast('Pick at least one station.'); return; }

      let addedCount = 0;
      selectedIds.forEach(stId => {
        const cats = categoriesForStation(stId);
        let cat = cats.find(c => c.title.toLowerCase() === catTitle.toLowerCase());
        if(!cat){
          cat = { id: uid(), title: catTitle, items: [] };
          cats.push(cat);
        }
        const exists = cat.items.some(i => i.name.toLowerCase() === itemName.toLowerCase());
        if(!exists){
          cat.items.push({ id: uid(), name: itemName, status: null });
          addedCount++;
        }
      });

      save();
      render();
      closeModal();
      showToast('Added \u201c' + itemName + '\u201d to ' + addedCount + ' of ' + selectedIds.length + ' selected station(s).');
    });
    modalBoxEl.appendChild(confirmBtn);
  }

    });

  function renderPickerResults(cat, resultsWrap, customBtn){
    const q = pickerQuery.trim();
    const existingNames = cat.items.map(i => i.name.toLowerCase());

    customBtn.innerHTML = '';
    if(q.length > 0){
      customBtn.style.display = 'flex';
      customBtn.textContent = '+ Add "' + q + '" as custom item';
      customBtn.onclick = () => addItemToCategory(cat, q);
    } else {
      customBtn.style.display = 'none';
    }

    resultsWrap.innerHTML = '';
    if(q.length === 0){
      const hint = document.createElement('div');
      hint.className = 'picker-hint';
      hint.textContent = 'Type to search the product list, or add a custom item.';
      resultsWrap.appendChild(hint);
      return;
    }
    const ql = q.toLowerCase();
    const matches = CATALOG.filter(([name]) => name.toLowerCase().includes(ql)).slice(0, 8);
    if(matches.length === 0){
      const empty = document.createElement('div');
      empty.className = 'picker-empty';
      empty.textContent = 'No matching products — add it as custom above.';
      resultsWrap.appendChild(empty);
      return;
    }
    matches.forEach(([name, category]) => {
      const row = document.createElement('div');
      row.className = 'picker-result';
      const already = existingNames.includes(name.toLowerCase());
      if(already) row.style.opacity = '0.45';
      const n = document.createElement('div');
      n.className = 'picker-result-name';
      n.textContent = name + (already ? '  ✓ added' : '');
      const c = document.createElement('div');
      c.className = 'picker-result-cat';
      c.textContent = category;
      row.appendChild(n);
      row.appendChild(c);
      if(!already){
        row.addEventListener('click', () => addItemToCategory(cat, name));
      }
      resultsWrap.appendChild(row);
    });
  }

  function addItemToCategory(cat, name){
    const trimmed = name.trim();
    if(!trimmed) return;
    if(cat.items.some(i => i.name.toLowerCase() === trimmed.toLowerCase())){
      pickerQuery = '';
      render();
      return;
    }
    cat.items.push({ id: uid(), name: trimmed, status: null });
    pickerQuery = '';
    save();
    render();
  }

  function renderCategories(categoriesWrap){
    categoriesWrap.innerHTML = '';
    const cats = activeCats();

    if(cats.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty-hint';
      empty.innerHTML = '<span>No categories yet</span>Add a category like "Aftershave Balm" to start checking items for this station';
      categoriesWrap.appendChild(empty);
      return;
    }

    cats.forEach(cat => {
      const isExpanded = expandedCats.has(cat.id);
      const card = document.createElement('div');
      card.className = 'category' + (isExpanded ? ' expanded' : '');

      const header = document.createElement('div');
      header.className = 'cat-header';
      header.addEventListener('click', () => {
        if(isExpanded){
          expandedCats.delete(cat.id);
          if(openPicker === cat.id) openPicker = null;
        } else {
          expandedCats.add(cat.id);
        }
        render();
      });

      const headerLeft = document.createElement('div');
      headerLeft.className = 'cat-header-left';

      const chevron = document.createElement('div');
      chevron.className = 'cat-chevron';
      chevron.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

      const titleWrap = document.createElement('div');
      titleWrap.className = 'cat-title-wrap';
      const title = document.createElement('div');
      title.className = 'cat-title';
      title.textContent = cat.title;
      titleWrap.appendChild(title);

      const counts = countsFor(cat.items);
      const badges = document.createElement('div');
      badges.className = 'cat-badges';
      if(counts.yes) badges.appendChild(makeBadge('yes', counts.yes + ' there'));
      if(counts.refill) badges.appendChild(makeBadge('refill', counts.refill + ' refill'));
      if(counts.no) badges.appendChild(makeBadge('no', counts.no + ' missing'));
      if(counts.unset) badges.appendChild(makeBadge('unset', counts.unset + ' unchecked'));
      titleWrap.appendChild(badges);

      headerLeft.appendChild(chevron);
      headerLeft.appendChild(titleWrap);

      const delCat = document.createElement('button');
      delCat.className = 'cat-del';
      delCat.innerHTML = '&times;';
      delCat.title = 'Delete category';
      delCat.addEventListener('click', async (e) => {
        e.stopPropagation();
        const ok = await THDialog.confirm('Delete "' + cat.title + '" and all its items?', { title: 'Delete category', okText: 'Delete', danger: true });
        if(!ok) return;
        const arr = activeCats();
        const idx = arr.findIndex(c => c.id === cat.id);
        if(idx > -1) arr.splice(idx, 1);
        if(openPicker === cat.id) openPicker = null;
        expandedCats.delete(cat.id);
        save();
        render();
      });

      header.appendChild(headerLeft);
      header.appendChild(delCat);
      card.appendChild(header);

      if(isExpanded){
        const list = document.createElement('ul');
        list.className = 'items';
        if(cat.items.length === 0){
          const li = document.createElement('li');
          li.className = 'picker-hint';
          li.style.padding = '4px 0 10px';
          li.textContent = 'No items in this category yet.';
          list.appendChild(li);
        }
        cat.items.forEach(item => {
          const li = document.createElement('li');
          li.className = 'item';

          const top = document.createElement('div');
          top.className = 'item-top';
          const name = document.createElement('div');
          name.className = 'item-name';
          name.textContent = item.name;
          const del = document.createElement('button');
          del.className = 'item-del';
          del.innerHTML = '&times;';
          del.title = 'Remove item';
          del.addEventListener('click', () => {
            const idx = cat.items.findIndex(i => i.id === item.id);
            if(idx > -1) cat.items.splice(idx, 1);
            save();
            render();
          });
          top.appendChild(name);
          top.appendChild(del);

          const btns = document.createElement('div');
          btns.className = 'status-btns';
          [['yes','আছে'], ['no','নাই'], ['refill','রিফিল করতে হবে']].forEach(([val,label]) => {
            const b = document.createElement('button');
            b.className = 'status-btn ' + val + (item.status === val ? ' active' : '');
            b.textContent = label;
            b.addEventListener('click', () => {
              item.status = (item.status === val) ? null : val;
              save();
              render();
            });
            btns.appendChild(b);
          });

          const remarkInput = document.createElement('input');
          remarkInput.type = 'text';
          remarkInput.className = 'remark-input';
          remarkInput.placeholder = 'Add a remark…';
          remarkInput.value = item.remark || '';
          remarkInput.maxLength = 200;
          remarkInput.addEventListener('input', () => {
            item.remark = remarkInput.value;
            queueSave();
          });

          li.appendChild(top);
          li.appendChild(btns);
          li.appendChild(remarkInput);
          list.appendChild(li);
        });
        card.appendChild(list);

        if(openPicker === cat.id){
          card.appendChild(renderPicker(cat));
        } else {
          const addBtn = document.createElement('button');
          addBtn.className = 'add-item-btn';
          addBtn.textContent = '+ Add item';
          addBtn.addEventListener('click', () => {
            openPicker = cat.id;
            pickerQuery = '';
            render();
          });
          card.appendChild(addBtn);
        }
      }

      categoriesWrap.appendChild(card);
    });
  }

  function makeBadge(cls, text){
    const b = document.createElement('span');
    b.className = 'cat-badge ' + cls;
    b.textContent = text;
    return b;
  }

  async function addCategory(){
    if(!state){ await THDialog.alert('Still connecting to your account \u2014 please wait a moment.'); return; }
    const name = await THDialog.prompt('Name for the new category:', '', { title: 'Add category', placeholder: 'e.g. Aftershave Balm' });
    if(!name) return;
    const trimmed = name.trim();
    if(!trimmed) return;
    const cats = activeCats();
    if(cats.some(c => c.title.toLowerCase() === trimmed.toLowerCase())){
      await THDialog.alert('A category with that name already exists for this station.');
      return;
    }
    const newCat = { id: uid(), title: trimmed, items: [] };
    cats.push(newCat);
    expandedCats.add(newCat.id);
    save();
    render();
  }

  // ---------- Excel export (with real borders, via ExcelJS) ----------
  async function exportStationExcel(stationId){
    if(!state){ await THDialog.alert('Still connecting to your account \u2014 please wait a moment.'); return; }
    if(typeof ExcelJS === 'undefined'){
      await THDialog.alert('Excel export library failed to load. Check your internet connection and try again.');
      return;
    }
    const st = stationById(stationId);
    if(!st) return;
    const g = groupById(st.groupId);
    const cats = (state.data[stationId] || []).filter(c => c.items.length > 0);
    if(cats.length === 0){
      await THDialog.alert('This station has no items yet \u2014 add some before printing a checklist.');
      return;
    }

    const thin = { style: 'thin', color: { argb: 'FFB8B8B8' } };
    const cellBorder = { top: thin, left: thin, bottom: thin, right: thin };

    const wb = new ExcelJS.Workbook();
    const sheetName = (st.title || 'Station').replace(/[\\\/\?\*\[\]:]/g, '').slice(0, 31) || 'Station';
    const ws = wb.addWorksheet(sheetName);
    ws.columns = [{ width: 42 }, { width: 24 }, { width: 32 }, { width: 16 }];

    // Title
    ws.mergeCells('A1:D1');
    const titleCell = ws.getCell('A1');
    titleCell.value = (g ? g.title + ' \u2014 ' : '') + st.title + ' \u2014 Station Checklist';
    titleCell.font = { name: 'Calibri', size: 14, bold: true, color: { argb: 'FF1F4A35' } };
    titleCell.alignment = { horizontal: 'center', vertical: 'middle' };
    ws.getRow(1).height = 26;

    // Date / Staff row
    const infoRowNum = 3;
    ws.getCell('A' + infoRowNum).value = 'Date:';
    ws.getCell('A' + infoRowNum).font = { bold: true, size: 11 };
    ws.getCell('D' + infoRowNum).value = 'Staff Name:';
    ws.getCell('D' + infoRowNum).font = { bold: true, size: 11 };
    ['A', 'B', 'C', 'D'].forEach(col => { ws.getCell(col + infoRowNum).border = cellBorder; });
    ws.getRow(infoRowNum).height = 20;

    let rowNum = infoRowNum + 2;

    cats.forEach(cat => {
      // Category header row (merged, filled)
      ws.mergeCells('A' + rowNum + ':D' + rowNum);
      const catCell = ws.getCell('A' + rowNum);
      catCell.value = cat.title;
      catCell.font = { bold: true, size: 12, color: { argb: 'FFFBF7EA' } };
      catCell.alignment = { vertical: 'middle' };
      catCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1F4A35' } };
      ['A', 'B', 'C', 'D'].forEach(col => { ws.getCell(col + rowNum).border = cellBorder; });
      ws.getRow(rowNum).height = 20;
      rowNum++;

      // Column header row
      const headers = ['Item', 'Present / Missing / Refill', 'Remarks', ''];
      headers.forEach((h, i) => {
        const cell = ws.getCell(rowNum, i + 1);
        cell.value = h;
        cell.font = { bold: true, size: 10.5, color: { argb: 'FF1F4A35' } };
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFEFE7D2' } };
        cell.alignment = { vertical: 'middle', wrapText: true };
        cell.border = cellBorder;
      });
      rowNum++;

      cat.items.forEach(item => {
        const nameCell = ws.getCell(rowNum, 1);
        nameCell.value = item.name;
        nameCell.alignment = { vertical: 'middle', wrapText: true };
        const c2 = ws.getCell(rowNum, 2);
        const c3 = ws.getCell(rowNum, 3);
        c3.value = item.remark || '';
        c3.alignment = { vertical: 'middle', wrapText: true };
        const c4 = ws.getCell(rowNum, 4);
        [nameCell, c2, c3, c4].forEach(cell => { cell.border = cellBorder; });
        rowNum++;
      });

      rowNum++; // spacer row between categories (no border)
    });

    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const safeName = (st.title || 'station').replace(/[\\/:*?"<>|]/g, '').trim() || 'station';
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = 'th-checklist-' + safeName + '-' + stamp + '.xlsx';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ---------- Backup import / reset ----------
  async function importData(file){
    if(!state){ await THDialog.alert('Still connecting to your account \u2014 please wait a moment.'); return; }
    const reader = new FileReader();
    reader.onload = async function(e){
      try{
        const parsed = JSON.parse(e.target.result);
        const incoming = parsed && parsed.state ? parsed.state : parsed;
        const migrated = migrateIfNeeded(incoming);
        if(!migrated || !Array.isArray(migrated.groups) || typeof migrated.data !== 'object'){
          await THDialog.alert('This file does not look like a valid station checklist backup.');
          return;
        }
        const ok = await THDialog.confirm('Import this file? It will replace your current checklist data on this device.', { title: 'Import backup', okText: 'Import' });
        if(!ok) return;
        state = migrated;
        state.view = 'groups';
        state.activeGroup = null;
        state.activeStation = null;
        openPicker = null;
        expandedCats = new Set();
        save();
        render();
      }catch(err){
        await THDialog.alert('Could not read that file. Make sure it is a JSON backup exported from this app.');
      }
    };
    reader.readAsText(file);
  }

  async function resetAll(){
    if(!state){ await THDialog.alert('Still connecting to your account \u2014 please wait a moment.'); return; }
    const ok = await THDialog.confirm('Reset all groups, stations and categories? This cannot be undone.', { title: 'Reset everything', okText: 'Reset', danger: true });
    if(!ok) return;
    state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    openPicker = null;
    expandedCats = new Set();
    save();
    render();
  }

  function loadCatalog(){
    window.thAuthReady.then(function(){
      window.thDB.collection(DOC_COLLECTION).doc('products').onSnapshot(function(snap){
        if(snap.exists && Array.isArray(snap.data().items)){
          CATALOG = snap.data().items.map(p => [p.name, p.category || '']);
          if(openPicker) render();
        }
      }, function(err){ console.error('Product catalog sync error', err); });
    });
  }

  window.THBackup = {
    note: 'Your checklists sync automatically to your account in real time. Use Import to restore a previously exported backup file.',
    importFile: importData,
    reset: resetAll
  };

  load();
  loadCatalog();
})();
</script>
