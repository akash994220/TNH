<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Truefitt &amp; Hill — Station Checklist</title>
<style>html,body{background:#0a0f24;}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="auth.js"></script>
<script src="catalog.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  :root {
    --ink: #f4f6fc;
    --ink-soft: rgba(244, 246, 252, 0.72);
    --ink-faint: rgba(244, 246, 252, 0.44);
    --gold: #d9b872;
    --gold-light: #f3dfaa;
    --gold-dark: #ad8a42;
    --gold-glow: rgba(217, 184, 114, 0.25);
    --navy-deep: #070b1a;
    --navy-mid: #0d1532;
    --navy-card: rgba(16, 24, 52, 0.72);
    --navy-border: rgba(217, 184, 114, 0.22);
    --green: #2ecc71;
    --green-deep: #166534;
    --green-glow: rgba(46, 204, 113, 0.25);
    --amber: #f59e0b;
    --amber-deep: #92400e;
    --amber-glow: rgba(245, 158, 11, 0.25);
    --red: #f43f5e;
    --red-deep: #9f1239;
    --red-glow: rgba(244, 63, 94, 0.25);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: 'Poppins', sans-serif;
    color: var(--ink);
    padding: 36px 16px 110px;
    background:
      radial-gradient(1100px 650px at 15% -10%, rgba(217,184,114,0.14), transparent 60%),
      radial-gradient(1100px 750px at 95% 10%, rgba(26,58,143,0.32), transparent 55%),
      radial-gradient(900px 650px at 50% 115%, rgba(26,58,143,0.2), transparent 50%),
      linear-gradient(160deg, #090e21 0%, #060a18 50%, #0d081f 100%);
    background-attachment: fixed;
    display: flex;
    justify-content: center;
    transition: background 0.25s ease, color 0.25s ease;
  }

  .app-container {
    width: 100%;
    max-width: 1040px;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  header { text-align: center; margin-bottom: 20px; }
  .crest {
    display: inline-flex; align-items: center; justify-content: center; gap: 14px;
    margin-bottom: 8px;
  }
  .crest-line {
    width: 38px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold));
  }
  .crest-line.right {
    background: linear-gradient(90deg, var(--gold), transparent);
  }
  .crest-icon {
    width: 32px; height: 32px; border-radius: 50%;
    border: 1px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    color: var(--gold);
    box-shadow: 0 0 14px var(--gold-glow);
  }
  .crest-icon svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; }
  .brand-eyebrow {
    font-size: 11px; letter-spacing: 4px; text-transform: uppercase;
    color: var(--gold); font-weight: 500;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 600; font-size: 32px; letter-spacing: 0.3px;
    color: #ffffff; text-shadow: 0 3px 20px rgba(0,0,0,0.5);
    margin-top: 2px;
  }
  .subtitle {
    font-size: 13px; color: var(--ink-soft); margin-top: 4px; letter-spacing: 0.3px;
  }

  /* Companion Tab Switcher */
  .context-tabs {
    display: flex; gap: 8px; margin: 0 auto 20px; max-width: 440px; width: 100%; padding: 4px;
    background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(217, 184, 114, 0.28); border-radius: 999px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.35);
  }
  .context-tab {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 9px 16px; border-radius: 999px; font-size: 12px; font-weight: 500;
    letter-spacing: 0.2px; text-decoration: none; color: var(--ink-soft);
    transition: all 0.18s ease; white-space: nowrap;
  }
  .context-tab svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .context-tab:hover { color: #ffffff; background: rgba(217, 184, 114, 0.1); }
  .context-tab.active {
    background: linear-gradient(135deg, #e3c684, #ad8a42); color: #120d03; font-weight: 600;
    box-shadow: 0 4px 16px rgba(217, 184, 114, 0.35);
  }

  /* Breadcrumbs bar */
  .nav-bar-strip {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    margin-bottom: 16px; padding: 10px 18px; border-radius: 16px;
    background: rgba(255, 255, 255, 0.035); border: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  .breadcrumbs {
    display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft);
    flex-wrap: wrap;
  }
  .crumb-link {
    display: inline-flex; align-items: center; gap: 6px; color: var(--gold);
    background: rgba(217, 184, 114, 0.1); border: 1px solid rgba(217, 184, 114, 0.28);
    border-radius: 999px; padding: 5px 12px; font-size: 12px; cursor: pointer;
    font-family: inherit; transition: all 0.15s ease;
  }
  .crumb-link:hover {
    background: rgba(217, 184, 114, 0.2); border-color: var(--gold); color: #ffffff;
  }
  .crumb-link svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.2; }
  .crumb-sep { color: var(--ink-faint); font-size: 12px; }
  .crumb-current { color: #ffffff; font-weight: 600; font-size: 13.5px; }

  .strip-actions {
    display: flex; align-items: center; gap: 8px;
  }
  .strip-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px;
    font-size: 12px; font-weight: 500; font-family: inherit; cursor: pointer;
    background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.12);
    color: var(--ink-soft); transition: all 0.15s ease;
  }
  .strip-btn:hover { color: #ffffff; background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.25); }
  .strip-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .strip-btn.gold {
    background: rgba(217, 184, 114, 0.12); border-color: rgba(217, 184, 114, 0.4); color: var(--gold);
  }
  .strip-btn.gold:hover {
    background: rgba(217, 184, 114, 0.22); border-color: var(--gold); color: #ffffff;
  }
  .strip-btn.danger:hover {
    background: rgba(244, 63, 94, 0.15); border-color: var(--red); color: var(--red);
  }

  /* Quick Station Switcher Dropdown inside Station */
  .station-switcher-wrap {
    display: inline-flex; align-items: center; gap: 8px; position: relative;
  }
  .station-select {
    padding: 6px 12px; border-radius: 999px; font-size: 12px; font-family: inherit;
    background: rgba(13, 21, 50, 0.9); border: 1px solid rgba(217, 184, 114, 0.35);
    color: var(--gold); outline: none; cursor: pointer;
  }

  /* Metric Stat Cards */
  .stat-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--navy-card); border: 1px solid var(--navy-border); border-radius: 18px;
    padding: 14px 16px; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3); display: flex; flex-direction: column; justify-content: space-between;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .stat-card:hover { transform: translateY(-2px); border-color: rgba(217,184,114,0.45); }
  .stat-label {
    font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; color: var(--ink-faint);
    font-weight: 500; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between;
  }
  .stat-dot { width: 7px; height: 7px; border-radius: 50%; }
  .stat-dot.green { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .stat-dot.amber { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  .stat-dot.red { background: var(--red); box-shadow: 0 0 8px var(--red); }
  .stat-dot.gold { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
  .stat-value {
    font-size: 26px; font-weight: 700; color: #ffffff; line-height: 1.1; font-feature-settings: 'tnum';
  }
  .stat-sub {
    font-size: 11px; color: var(--ink-soft); margin-top: 4px;
  }

  /* Main Surface Panel */
  .surface-panel {
    background: rgba(13, 21, 50, 0.7);
    border: 1px solid rgba(217, 184, 114, 0.25);
    border-radius: 24px;
    padding: 24px;
    backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
  }

  /* Groups & Stations Grid Views */
  .section-headline {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  .section-title {
    font-family: 'Playfair Display', serif; font-size: 20px; color: var(--gold);
    display: flex; align-items: center; gap: 10px;
  }
  .section-badge {
    font-family: 'Poppins', sans-serif; font-size: 11px; font-weight: 600;
    padding: 3px 9px; border-radius: 999px; background: rgba(217, 184, 114, 0.15);
    color: var(--gold-light); border: 1px solid rgba(217, 184, 114, 0.3);
  }

  /* Station & Group Cards */
  .grid-container {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;
  }
  .item-card {
    background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px; padding: 20px; cursor: pointer; display: flex; flex-direction: column;
    justify-content: space-between; min-height: 160px; transition: all 0.2s ease;
    position: relative; overflow: hidden;
  }
  .item-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: transparent; transition: background 0.2s ease;
  }
  .item-card:hover {
    background: rgba(255, 255, 255, 0.065); border-color: rgba(217, 184, 114, 0.45);
    transform: translateY(-2px); box-shadow: 0 12px 32px rgba(0,0,0,0.4);
  }
  .item-card.status-ok::before { background: linear-gradient(90deg, var(--green), #10b981); }
  .item-card.status-refill::before { background: linear-gradient(90deg, var(--amber), #fbbf24); }
  .item-card.status-missing::before { background: linear-gradient(90deg, var(--red), #f43f5e); }
  .item-card.status-empty::before { background: rgba(255,255,255,0.15); }

  .card-top {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    margin-bottom: 12px;
  }
  .card-title {
    font-family: 'Playfair Display', serif; font-size: 19px; font-weight: 600;
    color: #ffffff; line-height: 1.3;
  }
  .card-pill {
    font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
    padding: 3px 8px; border-radius: 999px; white-space: nowrap; flex-shrink: 0;
  }
  .card-pill.ok { background: rgba(46, 204, 113, 0.16); color: #86efac; border: 1px solid rgba(46, 204, 113, 0.35); }
  .card-pill.refill { background: rgba(245, 158, 11, 0.16); color: #fde047; border: 1px solid rgba(245, 158, 11, 0.35); }
  .card-pill.missing { background: rgba(244, 63, 94, 0.16); color: #fda4af; border: 1px solid rgba(244, 63, 94, 0.35); }
  .card-pill.empty { background: rgba(255, 255, 255, 0.08); color: var(--ink-soft); border: 1px solid rgba(255, 255, 255, 0.15); }

  /* Station progress mini bar */
  .card-progress-bar {
    height: 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.1);
    overflow: hidden; display: flex; margin: 12px 0 14px;
  }
  .progress-slice { height: 100%; }
  .progress-slice.yes { background: var(--green); }
  .progress-slice.refill { background: var(--amber); }
  .progress-slice.no { background: var(--red); }
  .progress-slice.unset { background: rgba(255, 255, 255, 0.15); }

  .card-meta-row {
    display: flex; align-items: center; justify-content: space-between; font-size: 11.5px;
    color: var(--ink-soft); margin-top: auto; padding-top: 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
  }
  .card-actions {
    display: flex; align-items: center; gap: 6px;
  }
  .icon-btn {
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12);
    color: var(--ink-soft); cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s ease;
  }
  .icon-btn:hover { background: rgba(217, 184, 114, 0.2); border-color: var(--gold); color: #ffffff; }
  .icon-btn.danger:hover { background: rgba(244, 63, 94, 0.2); border-color: var(--red); color: var(--red); }
  .icon-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.8; }

  /* Create new item card */
  .add-card {
    border: 1px dashed rgba(217, 184, 114, 0.45); background: rgba(217, 184, 114, 0.03);
    border-radius: 20px; padding: 20px; cursor: pointer; display: flex; flex-direction: column;
    align-items: center; justify-content: center; min-height: 160px; color: var(--gold);
    transition: all 0.2s ease; font-family: inherit;
  }
  .add-card:hover {
    background: rgba(217, 184, 114, 0.09); border-color: var(--gold); transform: translateY(-2px);
  }
  .add-card-circle {
    width: 38px; height: 38px; border-radius: 50%;
    background: rgba(217, 184, 114, 0.15); border: 1px solid rgba(217, 184, 114, 0.4);
    display: flex; align-items: center; justify-content: center; font-size: 20px;
    margin-bottom: 8px;
  }
  .add-card-title { font-size: 13px; font-weight: 600; letter-spacing: 0.3px; }
  .add-card-sub { font-size: 11px; color: var(--ink-faint); margin-top: 2px; }

  /* Checklist View Specifics */
  .checklist-toolbar {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    margin-bottom: 20px;
  }
  .search-filter-wrap {
    display: flex; align-items: center; gap: 10px; flex: 1; min-width: 240px;
  }
  .search-input-box {
    position: relative; flex: 1;
  }
  .search-input-box svg {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 15px; height: 15px; stroke: var(--ink-faint); fill: none; stroke-width: 2;
  }
  .search-input {
    width: 100%; padding: 10px 14px 10px 38px; border-radius: 999px;
    background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.14);
    color: #ffffff; font-size: 13px; font-family: inherit; outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .search-input:focus {
    border-color: var(--gold); background: rgba(0, 0, 0, 0.45);
  }
  .filter-pills {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .filter-pill {
    padding: 6px 12px; border-radius: 999px; font-size: 11px; font-weight: 500;
    cursor: pointer; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--ink-soft); transition: all 0.15s ease;
  }
  .filter-pill:hover { color: #ffffff; background: rgba(255, 255, 255, 0.1); }
  .filter-pill.active {
    background: var(--gold); color: #151004; font-weight: 600; border-color: var(--gold);
  }

  .action-buttons-wrap {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .primary-action-btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px;
    font-size: 12.5px; font-weight: 600; font-family: inherit; cursor: pointer; border: none;
    background: linear-gradient(135deg, #e3c684, #ad8a42); color: #140e04;
    box-shadow: 0 4px 14px rgba(217, 184, 114, 0.3); transition: filter 0.15s ease, transform 0.15s ease;
  }
  .primary-action-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .primary-action-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.2; }

  /* Station Overview Banner */
  .station-overview-banner {
    display: flex; flex-direction: column; gap: 12px;
    background: rgba(255, 255, 255, 0.035); border: 1px solid rgba(217, 184, 114, 0.2);
    border-radius: 18px; padding: 16px 20px; margin-bottom: 24px;
  }
  .banner-top {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  .banner-title {
    font-family: 'Playfair Display', serif; font-size: 22px; color: #ffffff;
  }
  .banner-progress-wrap {
    display: flex; align-items: center; gap: 14px;
  }
  .full-progress-bar {
    flex: 1; height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.1);
    overflow: hidden; display: flex; min-width: 140px;
  }

  /* Category Accordion Blocks */
  .categories-list {
    display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px;
  }
  .cat-block {
    background: rgba(255, 255, 255, 0.035); border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 20px; overflow: hidden; transition: border-color 0.2s ease;
  }
  .cat-block:hover { border-color: rgba(217, 184, 114, 0.35); }
  .cat-head {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 16px 20px; cursor: pointer; user-select: none;
    background: rgba(255, 255, 255, 0.02); transition: background 0.15s ease;
  }
  .cat-head:hover { background: rgba(255, 255, 255, 0.045); }
  .cat-head-left {
    display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1;
  }
  .cat-toggle-arrow {
    width: 24px; height: 24px; border-radius: 50%;
    background: rgba(217, 184, 114, 0.12); border: 1px solid rgba(217, 184, 114, 0.25);
    color: var(--gold); display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s ease; flex-shrink: 0;
  }
  .cat-toggle-arrow svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.2; }
  .cat-block.expanded .cat-toggle-arrow { transform: rotate(90deg); }

  .cat-name-box { min-width: 0; }
  .cat-name {
    font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 600;
    color: var(--gold); letter-spacing: 0.2px; word-break: break-word;
  }
  .cat-badges-strip {
    display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px;
  }
  .cat-status-tag {
    font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 999px;
  }
  .cat-status-tag.yes { background: rgba(46, 204, 113, 0.15); color: #86efac; border: 1px solid rgba(46, 204, 113, 0.3); }
  .cat-status-tag.refill { background: rgba(245, 158, 11, 0.15); color: #fde047; border: 1px solid rgba(245, 158, 11, 0.3); }
  .cat-status-tag.no { background: rgba(244, 63, 94, 0.15); color: #fda4af; border: 1px solid rgba(244, 63, 94, 0.3); }
  .cat-status-tag.unset { background: rgba(255, 255, 255, 0.06); color: var(--ink-soft); border: 1px solid rgba(255, 255, 255, 0.12); }

  .cat-head-actions {
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  }
  .cat-quick-stock-btn {
    padding: 5px 11px; font-size: 11px; font-weight: 600; border-radius: 999px;
    background: rgba(46, 204, 113, 0.12); border: 1px solid rgba(46, 204, 113, 0.3);
    color: #86efac; cursor: pointer; transition: all 0.15s ease;
  }
  .cat-quick-stock-btn:hover {
    background: rgba(46, 204, 113, 0.25); border-color: var(--green); color: #ffffff;
  }

  /* Items List Inside Category */
  .cat-body {
    padding: 0 20px 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
  }
  .items-table {
    display: flex; flex-direction: column; gap: 10px; margin-top: 14px;
  }
  .item-row {
    background: rgba(0, 0, 0, 0.25); border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px; padding: 12px 16px; transition: all 0.15s ease;
  }
  .item-row:hover {
    border-color: rgba(217, 184, 114, 0.3); background: rgba(0, 0, 0, 0.35);
  }
  .item-main {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  .item-title {
    font-size: 14px; font-weight: 500; color: #ffffff; flex: 1; min-width: 180px;
  }
  .item-controls {
    display: flex; align-items: center; gap: 8px;
  }
  
  /* Status Toggle Pills (Present / Refill / Missing) */
  .status-toggle-group {
    display: inline-flex; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 999px; padding: 3px; gap: 3px;
  }
  .status-toggle-btn {
    padding: 5px 12px; font-size: 11.5px; font-weight: 500; border-radius: 999px;
    background: transparent; border: none; color: var(--ink-soft); cursor: pointer;
    font-family: inherit; transition: all 0.15s ease; display: inline-flex; align-items: center; gap: 5px;
    white-space: nowrap;
  }
  .status-toggle-btn:hover { color: #ffffff; background: rgba(255, 255, 255, 0.08); }
  
  .status-toggle-btn.yes.active {
    background: linear-gradient(135deg, #2ecc71, #166534); color: #ffffff; font-weight: 600;
    box-shadow: 0 2px 8px var(--green-glow);
  }
  .status-toggle-btn.refill.active {
    background: linear-gradient(135deg, #f59e0b, #b45309); color: #ffffff; font-weight: 600;
    box-shadow: 0 2px 8px var(--amber-glow);
  }
  .status-toggle-btn.no.active {
    background: linear-gradient(135deg, #f43f5e, #be123c); color: #ffffff; font-weight: 600;
    box-shadow: 0 2px 8px var(--red-glow);
  }

  .item-remark-input {
    width: 100%; margin-top: 8px; padding: 7px 14px; font-size: 12px;
    border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.09);
    background: rgba(0, 0, 0, 0.2); color: var(--ink); font-family: inherit;
    outline: none; transition: all 0.15s ease;
  }
  .item-remark-input:focus {
    border-color: var(--gold); background: rgba(0, 0, 0, 0.4);
  }
  .item-remark-input::placeholder { color: var(--ink-faint); }

  /* Add Item Picker Drawer inside Category */
  .picker-box {
    margin-top: 14px; padding: 14px; border-radius: 16px;
    background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(217, 184, 114, 0.35);
  }
  .picker-input-row {
    display: flex; gap: 8px; margin-bottom: 8px;
  }
  .picker-input {
    flex: 1; padding: 9px 14px; font-size: 13px; border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.15); background: rgba(0, 0, 0, 0.3);
    color: #ffffff; font-family: inherit; outline: none;
  }
  .picker-input:focus { border-color: var(--gold); }
  .picker-close-btn {
    padding: 0 14px; font-size: 12px; border-radius: 999px; cursor: pointer;
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);
    color: var(--ink-soft); font-family: inherit;
  }
  .picker-results-list {
    display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto;
  }
  .picker-item-option {
    display: flex; align-items: center; justify-content: space-between; padding: 8px 12px;
    border-radius: 10px; background: rgba(255, 255, 255, 0.035); border: 1px solid rgba(255, 255, 255, 0.07);
    cursor: pointer; transition: all 0.15s ease;
  }
  .picker-item-option:hover {
    background: rgba(217, 184, 114, 0.15); border-color: var(--gold);
  }
  .picker-add-custom {
    padding: 10px; border-radius: 10px; cursor: pointer; margin-top: 4px;
    background: rgba(217, 184, 114, 0.1); border: 1px dashed rgba(217, 184, 114, 0.5);
    color: var(--gold); font-size: 12.5px; text-align: center; font-weight: 500;
  }
  .picker-add-custom:hover { background: rgba(217, 184, 114, 0.2); }

  .add-item-trigger-btn {
    width: 100%; margin-top: 12px; padding: 10px; font-size: 12.5px; font-weight: 600;
    border-radius: 12px; cursor: pointer; background: transparent;
    border: 1px dashed rgba(217, 184, 114, 0.4); color: var(--gold);
    transition: all 0.15s ease; font-family: inherit;
  }
  .add-item-trigger-btn:hover {
    background: rgba(217, 184, 114, 0.1); border-color: var(--gold);
  }

  /* Modal Windows */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(5, 8, 20, 0.75);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center; z-index: 999;
    padding: 16px; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal-dialog {
    width: 100%; max-width: 580px; max-height: 90vh; overflow-y: auto;
    background: linear-gradient(160deg, #131c3f 0%, #0c122a 60%, #160c2b 100%);
    border: 1px solid rgba(217, 184, 114, 0.35); border-radius: 24px;
    padding: 24px; box-shadow: 0 24px 70px rgba(0,0,0,0.6);
    transform: scale(0.96); transition: transform 0.2s ease; position: relative;
  }
  .modal-overlay.open .modal-dialog { transform: scale(1); }
  .modal-header {
    display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px;
  }
  .modal-title {
    font-family: 'Playfair Display', serif; font-size: 20px; color: var(--gold); font-weight: 600;
  }
  .modal-subtitle {
    font-size: 12px; color: var(--ink-soft); margin-top: 4px;
  }
  .modal-close-btn {
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);
    color: var(--ink-soft); cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 16px; transition: all 0.15s ease;
  }
  .modal-close-btn:hover { color: #ffffff; background: rgba(255, 255, 255, 0.16); }

  .toast {
    position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%) translateY(12px);
    background: #111a3b; border: 1px solid var(--gold); color: #ffffff;
    padding: 12px 24px; border-radius: 999px; font-size: 13px; font-weight: 500;
    z-index: 1000; opacity: 0; pointer-events: none; transition: all 0.2s ease;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5); text-align: center; max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  footer {
    text-align: center; margin-top: 32px; font-size: 11px; color: var(--ink-faint);
    letter-spacing: 0.4px;
  }
  .footer-gold { color: var(--gold); }

  /* ── Light Mode Custom Palette ── */
  body.light {
    --ink: #0b1a3d;
    --ink-soft: rgba(11, 26, 61, 0.72);
    --ink-faint: rgba(11, 26, 61, 0.45);
    --gold: #1a3a8f;
    --gold-light: #244eb8;
    --gold-dark: #0f245c;
    --gold-glow: rgba(26, 58, 143, 0.2);
    --navy-deep: #f6f8fd;
    --navy-mid: #ebf0fa;
    --navy-card: rgba(255, 255, 255, 0.9);
    --navy-border: rgba(26, 58, 143, 0.16);
    background:
      radial-gradient(1100px 650px at 15% -10%, rgba(26, 58, 143, 0.08), transparent 60%),
      radial-gradient(1100px 750px at 95% 10%, rgba(217, 184, 114, 0.12), transparent 55%),
      linear-gradient(160deg, #f4f6fc 0%, #edf1fa 55%, #f6f3fc 100%);
  }
  body.light h1 { color: #0b1a3d; text-shadow: none; }
  body.light .context-tabs {
    background: rgba(255, 255, 255, 0.7); border-color: rgba(26, 58, 143, 0.18);
  }
  body.light .context-tab.active {
    background: linear-gradient(135deg, #1a3a8f, #10255c); color: #ffffff;
    box-shadow: 0 4px 14px rgba(26, 58, 143, 0.3);
  }
  body.light .surface-panel {
    background: rgba(255, 255, 255, 0.82); border-color: rgba(26, 58, 143, 0.16);
    box-shadow: 0 20px 50px rgba(11, 26, 61, 0.08);
  }
  body.light .item-card {
    background: #ffffff; border-color: rgba(26, 58, 143, 0.12);
    box-shadow: 0 6px 20px rgba(11, 26, 61, 0.04);
  }
  body.light .item-card:hover {
    background: #ffffff; border-color: #1a3a8f; box-shadow: 0 12px 30px rgba(11, 26, 61, 0.1);
  }
  body.light .card-title { color: #0b1a3d; }
  body.light .add-card {
    background: rgba(26, 58, 143, 0.03); border-color: rgba(26, 58, 143, 0.35); color: #1a3a8f;
  }
  body.light .add-card-circle {

  }
  body.light .cat-name { color: #1a3a8f; }
  body.light .item-row {
    background: rgba(244, 246, 252, 0.6); border-color: rgba(26, 58, 143, 0.1);
  }
  body.light .item-title { color: #0b1a3d; }
  body.light .status-toggle-group {
    background: rgba(26, 58, 143, 0.06); border-color: rgba(26, 58, 143, 0.14);
  }
  body.light .item-remark-input {

</style>

<body>
<script>try{var t=localStorage.getItem('th-theme');if(t==='light'||(!t&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches))document.body.classList.add('light');}catch(e){}</script>

<div class="app-container">
  <header>
    <div class="crest">
      <span class="crest-line"></span>
      <div class="crest-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      </div>
      <span class="crest-line right"></span>
    </div>
    <div class="brand-eyebrow">Truefitt &amp; Hill &middot; Mayfair</div>
    <h1 id="pageTitle">Station Checklist</h1>
    <div class="subtitle" id="subtitle">Connecting to salon cloud&hellip;</div>
  </header>

  <!-- Reusable Companion Tool Switcher -->
  <div class="context-tabs">
    <a class="context-tab active" href="station-checklist.html" id="tabChecklist">
      <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Station Checklist
    </a>
    <a class="context-tab" href="requirements.html" id="tabRequirements">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      Station Requirements
    </a>
  </div>

  <!-- Navigation bar strip (Breadcrumbs, Station Switcher, Actions) -->
  <div class="nav-bar-strip" id="navBarStrip" style="display:none;"></div>

  <!-- Stat summary cards -->
  <div class="stat-grid" id="statGrid"></div>

  <!-- Main Surface Viewport -->
  <div class="surface-panel" id="mainSurface">
    <div id="viewBody"></div>
  </div>

  <footer>Station Checklist &nbsp;<span class="footer-gold">&middot;</span>&nbsp; Truefitt &amp; Hill London</footer>

<!-- Modal for "Add Item to Stations" -->
<div class="modal-overlay" id="everywhereModal">
  <div class="modal-dialog" id="everywhereModalBox"></div>
</div>

<div class="toast" id="toastEl"></div>

<script>
(function(){
  const DOC_COLLECTION = 'th-staff-tools';
  const DOC_ID = 'station-checklist';

  let CATALOG = (window.TH_CATALOG || []).slice();

  const DEFAULT_STATE = {
    groups: [{ id: 'g_default', title: 'Service Station' }],
    stations: [{ id: 'st_default', title: 'Station 1', groupId: 'g_default' }],
    data: { 'st_default': [] },
    view: 'groups',
    activeGroup: null,
    activeStation: null
  };

  let state = null;
  let docRef = null;
  let openPicker = null;        // category id whose "add item" picker is open
  let pickerQuery = '';
  let expandedCats = new Set();  // category ids currently expanded
  let searchQuery = '';          // in-station checklist search query
  let activeFilter = 'all';      // 'all' | 'no' | 'refill' | 'yes' | 'unset'

  const pageTitleEl = document.getElementById('pageTitle');
  const subtitleEl = document.getElementById('subtitle');
  const navBarStripEl = document.getElementById('navBarStrip');
  const statGridEl = document.getElementById('statGrid');
  const viewBodyEl = document.getElementById('viewBody');
  const toastEl = document.getElementById('toastEl');
  let toastTimer = null;

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3000);
  }

  // ---------- Migration Helper ----------
  function migrateIfNeeded(data){
    if(data && Array.isArray(data.groups) && Array.isArray(data.stations) && typeof data.data === 'object'){
      return data;
    }
    if(data && Array.isArray(data.stations) && typeof data.data === 'object'){
      const groupId = 'g_migrated';
      return {
        groups: [{ id: groupId, title: 'Stations' }],
        stations: data.stations.map(name => ({ id: name, title: name, groupId: groupId })),
        data: data.data,
        view: 'groups',
        activeGroup: null,
        activeStation: null
      };
    }
    return JSON.parse(JSON.stringify(DEFAULT_STATE));
  }

  function applyIncoming(data){
    state = migrateIfNeeded(data);
    if(!state.groups || !state.groups.length){
      state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    }
    if(!state.data) state.data = {};
    state.stations.forEach(s => { if(!state.data[s.id]) state.data[s.id] = []; });
    if(state.activeGroup && !state.groups.some(g => g.id === state.activeGroup)) state.activeGroup = null;
    if(state.activeStation && !state.stations.some(s => s.id === state.activeStation)) state.activeStation = null;
    if(state.view === 'stations' && !state.activeGroup) state.view = 'groups';
    if(state.view === 'checklist' && !state.activeStation) state.view = state.activeGroup ? 'stations' : 'groups';
    if(!state.view) state.view = 'groups';
    render();
  }

  function load(){
    subtitleEl.textContent = 'Connecting to salon cloud\u2026';
    window.thAuthReady.then(function(){
      docRef = window.thDB.collection(DOC_COLLECTION).doc(DOC_ID);
      docRef.onSnapshot(function(snap){
        if(snap.metadata.hasPendingWrites) return;
        if(snap.exists){
          applyIncoming(snap.data());
        } else {
          state = JSON.parse(JSON.stringify(DEFAULT_STATE));
          save();
          render();
        }
      }, function(err){
        console.error('Checklist sync error', err);
        subtitleEl.textContent = 'Could not sync \u2014 check your connection.';
      });
    });
  }

  function save(){
    if(!docRef || !state) return;
    const payload = Object.assign({}, state, { updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    docRef.set(payload).catch(e => console.error('Checklist save error', e));
  }

  let saveTimer = null;
  function queueSave(){
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { saveTimer = null; save(); }, 500);
  }

  // ---------- Helpers ----------
  function groupById(id){ return (state.groups || []).find(g => g.id === id); }
  function stationById(id){ return (state.stations || []).find(s => s.id === id); }
  function stationsInGroup(groupId){ return (state.stations || []).filter(s => s.groupId === groupId); }
  function categoriesForStation(stationId){
    if(!state.data[stationId]) state.data[stationId] = [];
    return state.data[stationId];
  }
  function activeCats(){ return categoriesForStation(state.activeStation); }

  function itemsOfStation(stationId){
    const cats = state.data[stationId] || [];
    let items = [];
    cats.forEach(c => { items = items.concat(c.items || []); });
    return items;
  }

  function itemsOfGroup(groupId){
    let items = [];
    stationsInGroup(groupId).forEach(s => { items = items.concat(itemsOfStation(s.id)); });
    return items;
  }

  function itemsStatus(items){
    if(!items || items.length === 0) return 'empty';
    if(items.some(i => i.status === 'no')) return 'missing';
    if(items.some(i => i.status === 'refill')) return 'refill';
    if(items.some(i => !i.status)) return 'empty';
    return 'ok';
  }

  function countsFor(items){
    items = items || [];
    return {
      yes: items.filter(i => i.status === 'yes').length,
      no: items.filter(i => i.status === 'no').length,
      refill: items.filter(i => i.status === 'refill').length,
      unset: items.filter(i => !i.status).length,
      total: items.length
    };
  }

  // ---------- Navigation Flow ----------
  function goToGroups(){
    state.view = 'groups';
    state.activeGroup = null;
    state.activeStation = null;
    openPicker = null;
    searchQuery = '';
    activeFilter = 'all';
    save();
    render();
  }

  function openGroup(groupId){
    state.view = 'stations';
    state.activeGroup = groupId;
    state.activeStation = null;
    openPicker = null;
    searchQuery = '';
    activeFilter = 'all';
    save();
    render();
  }

  function openStation(stationId){
    const st = stationById(stationId);
    state.view = 'checklist';
    state.activeGroup = st ? st.groupId : state.activeGroup;
    state.activeStation = stationId;
    openPicker = null;
    searchQuery = '';
    activeFilter = 'all';
    save();
    render();
  }

  // ---------- Group CRUD ----------
  async function addGroup(){
    const name = await THDialog.prompt('Name for the new station group:', '', { title: 'Add Station Group', placeholder: 'e.g. Service Stations, Desks, VIP Room' });
    if(!name) return;
    const trimmed = name.trim();
    if(!trimmed) return;
    if(state.groups.some(g => g.title.toLowerCase() === trimmed.toLowerCase())){
      await THDialog.alert('A group with that name already exists.');
      return;
    }
    state.groups.push({ id: uid(), title: trimmed });
    save();
    render();
  }

  async function renameGroup(groupId){
    const g = groupById(groupId);
    if(!g) return;
    const name = await THDialog.prompt('Rename group:', g.title, { title: 'Rename Group' });
    if(!name) return;
    const trimmed = name.trim();
    if(!trimmed || trimmed === g.title) return;
    g.title = trimmed;
    save();
    render();
  }

  async function deleteGroup(groupId){
    const g = groupById(groupId);
    if(!g) return;
    const count = stationsInGroup(groupId).length;
    const msg = count > 0
      ? 'Delete "' + g.title + '" and all ' + count + ' station(s) inside it?'
      : 'Delete group "' + g.title + '"?';
    const ok = await THDialog.confirm(msg, { title: 'Delete Group', okText: 'Delete', danger: true });
    if(!ok) return;
    const removedIds = stationsInGroup(groupId).map(s => s.id);
    state.groups = state.groups.filter(x => x.id !== groupId);
    state.stations = state.stations.filter(s => s.groupId !== groupId);
    removedIds.forEach(id => { delete state.data[id]; });
    if(state.activeGroup === groupId){
      state.activeGroup = null;
      state.activeStation = null;
      state.view = 'groups';
    }
    save();
    render();
  }

  // ---------- Station CRUD ----------
  async function addStation(groupId){
    const name = await THDialog.prompt('Name for the new station:', '', { title: 'Add Station', placeholder: 'e.g. Station 1, Chair 4' });
    if(!name) return;
    const trimmed = name.trim();
    if(!trimmed) return;
    const id = uid();
    state.stations.push({ id: id, title: trimmed, groupId: groupId });
    state.data[id] = [];
    save();
    render();
  }

  async function renameStation(stationId){
    const st = stationById(stationId);
    if(!st) return;
    const name = await THDialog.prompt('Rename station:', st.title, { title: 'Rename Station' });
    if(!name) return;
    const trimmed = name.trim();
    if(!trimmed || trimmed === st.title) return;
    st.title = trimmed;
    save();
    render();
  }

  async function duplicateStation(stationId){
    const src = stationById(stationId);
    if(!src) return;
    const srcCats = state.data[stationId] || [];
    let suggestion = src.title + ' Copy';
    const name = await THDialog.prompt('Name for the duplicated station:', suggestion, { title: 'Duplicate Station' });
    if(!name) return;
    const trimmed = name.trim();
    if(!trimmed) return;

    const cloned = srcCats.map(cat => ({
      id: uid(),
      title: cat.title,
      items: (cat.items || []).map(item => ({ id: uid(), name: item.name, status: null, remark: '' }))
    }));

    const newId = uid();
    state.stations.push({ id: newId, title: trimmed, groupId: src.groupId });
    state.data[newId] = cloned;
    save();
    render();
    showToast('Station duplicated successfully.');
  }

  async function deleteStation(stationId){
    const st = stationById(stationId);
    if(!st) return;
    const ok = await THDialog.confirm('Delete "' + st.title + '" and its entire checklist?', { title: 'Delete Station', okText: 'Delete', danger: true });
    if(!ok) return;
    state.stations = state.stations.filter(s => s.id !== stationId);
    delete state.data[stationId];
    if(state.activeStation === stationId){
      state.activeStation = null;
      state.view = 'stations';
    }
    save();
    render();
  }

  // ---------- Central Renderer ----------
  function render(){
    if(!state) return;
    if(state.view === 'groups'){
      renderGroupsView();
    } else if(state.view === 'stations'){
      renderStationsView();
    } else if(state.view === 'checklist'){
      renderChecklistView();
    }
  }

  // 1. GROUPS VIEW
  function renderGroupsView(){
    pageTitleEl.textContent = 'Station Checklist';
    navBarStripEl.style.display = 'none';

    // Calculate global stats
    let totalStations = state.stations.length;
    let allItems = [];
    state.stations.forEach(s => { allItems = allItems.concat(itemsOfStation(s.id)); });
    let counts = countsFor(allItems);
    subtitleEl.textContent = totalStations + ' stations monitored across salon';

    // Render Stat Cards
    statGridEl.innerHTML = `
      <div class="stat-card" id="statCardStations">
        <div class="stat-label">Total Stations <span class="stat-dot gold"></span></div>
        <div class="stat-value">${totalStations}</div>
        <div class="stat-sub">${state.groups.length} station groups</div>
      </div>
      <div class="stat-card" id="statCardStocked">
        <div class="stat-label">In Stock (আছে) <span class="stat-dot green"></span></div>
        <div class="stat-value" style="color:var(--green);">${counts.yes}</div>
        <div class="stat-sub">Fully present items</div>
      </div>
      <div class="stat-card" id="statCardRefill">

  // Render individual category accordion with items
  function renderCategoryBlock(cat){
    const isExpanded = expandedCats.has(cat.id);
    const catBlock = document.createElement('div');
    catBlock.className = 'cat-block' + (isExpanded ? ' expanded' : '');

    const catItems = cat.items || [];
    const catCounts = countsFor(catItems);

    // Filter items according to search query and active status filter
    let visibleItems = catItems.filter(item => {
      if(searchQuery && !item.name.toLowerCase().includes(searchQuery)) return false;
      if(activeFilter === 'yes' && item.status !== 'yes') return false;
      if(activeFilter === 'refill' && item.status !== 'refill') return false;
      if(activeFilter === 'no' && item.status !== 'no') return false;
      if(activeFilter === 'unset' && item.status) return false;
      return true;
    });

    // Header
    const head = document.createElement('div');
    head.className = 'cat-head';
    head.addEventListener('click', () => {
      if(isExpanded){
        expandedCats.delete(cat.id);
        if(openPicker === cat.id) openPicker = null;
      } else {
        expandedCats.add(cat.id);
      }
      render();
    });

    head.innerHTML = `
      <div class="cat-head-left">
        <div class="cat-toggle-arrow">
          <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
        </div>
        <div class="cat-name-box">
          <div class="cat-name">${escapeHtml(cat.title)}</div>
          <div class="cat-badges-strip">
            <span class="cat-status-tag yes">${catCounts.yes} In Stock</span>
            ${catCounts.refill ? `<span class="cat-status-tag refill">${catCounts.refill} Refill</span>` : ''}
            ${catCounts.no ? `<span class="cat-status-tag no">${catCounts.no} Missing</span>` : ''}
            ${catCounts.unset ? `<span class="cat-status-tag unset">${catCounts.unset} Unchecked</span>` : ''}
          </div>
        </div>
      </div>
      <div class="cat-head-actions">
        <button class="cat-quick-stock-btn" title="Mark all items in this category ready" data-act="stock-cat">Stock Category</button>
        <button class="icon-btn" title="Rename Category" data-act="rename"><svg viewBox="0 0 24 24"><path d="M4 20l1-4.2L15.5 5.3a1.5 1.5 0 0 1 2.1 0l1.1 1.1a1.5 1.5 0 0 1 0 2.1L8.2 19 4 20z"/></svg></button>
        <button class="icon-btn danger" title="Delete Category" data-act="delete"><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-8 0v12a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V7"/></svg></button>
      </div>
    `;

    head.querySelector('[data-act="stock-cat"]').addEventListener('click', (e) => {
      e.stopPropagation();
      catItems.forEach(it => { it.status = 'yes'; });
      save();
      render();
      showToast(`Category "${cat.title}" marked as In Stock.`);
    });

    head.querySelector('[data-act="rename"]').addEventListener('click', async (e) => {
      e.stopPropagation();
      const name = await THDialog.prompt('Rename category:', cat.title, { title: 'Rename Category' });
      if(!name) return;
      const trimmed = name.trim();
      if(!trimmed || trimmed === cat.title) return;
      cat.title = trimmed;
      save();
      render();
    });

    head.querySelector('[data-act="delete"]').addEventListener('click', async (e) => {
      e.stopPropagation();
      const ok = await THDialog.confirm(`Delete "${cat.title}" and all its items?`, { title: 'Delete Category', okText: 'Delete', danger: true });
      if(!ok) return;
      const arr = activeCats();
      const idx = arr.findIndex(c => c.id === cat.id);
      if(idx > -1) arr.splice(idx, 1);
      expandedCats.delete(cat.id);
      if(openPicker === cat.id) openPicker = null;
      save();
      render();
    });

    catBlock.appendChild(head);

    // Body (Items + Picker)
    if(isExpanded){
      const body = document.createElement('div');
      body.className = 'cat-body';

      if(visibleItems.length === 0){
        const emptyMsg = document.createElement('div');
        emptyMsg.style.cssText = 'padding:14px;text-align:center;font-size:12px;color:var(--ink-faint);';
        emptyMsg.textContent = catItems.length === 0 ? 'No items in this category yet. Click "+ Add Item" below.' : 'No items match current filter.';
        body.appendChild(emptyMsg);
      } else {
        const table = document.createElement('div');
        table.className = 'items-table';

        visibleItems.forEach(item => {
          const row = document.createElement('div');
          row.className = 'item-row';

          row.innerHTML = `
            <div class="item-main">
              <div class="item-title">${escapeHtml(item.name)}</div>
              <div class="item-controls">
                <div class="status-toggle-group">
                  <button class="status-toggle-btn yes ${item.status==='yes'?'active':''}" data-status="yes">
                    <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" fill="none" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                    In Stock (আছে)
                  </button>
                  <button class="status-toggle-btn refill ${item.status==='refill'?'active':''}" data-status="refill">
                    <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" fill="none" stroke-width="2.5"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
                    Refill (রিফিল)
                  </button>
                  <button class="status-toggle-btn no ${item.status==='no'?'active':''}" data-status="no">
                    <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" fill="none" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    Missing (নাই)
                  </button>
                </div>
                <button class="icon-btn danger" title="Remove item" data-act="del-item"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
              </div>
            </div>
            <input type="text" class="item-remark-input" placeholder="Add remark or quantity notes (e.g. 2 bottles remaining)…" value="${escapeHtml(item.remark || '')}">
          `;

          // Status Button Clicks
          row.querySelectorAll('.status-toggle-btn').forEach(b => {
            b.addEventListener('click', () => {
              const val = b.dataset.status;
              item.status = (item.status === val) ? null : val;
              save();
              render();
            });
          });

          // Delete item
          row.querySelector('[data-act="del-item"]').addEventListener('click', () => {
            const idx = cat.items.findIndex(i => i.id === item.id);
            if(idx > -1) cat.items.splice(idx, 1);
            save();
            render();
          });

          // Remark Input
          const remInput = row.querySelector('.item-remark-input');
          remInput.addEventListener('input', () => {
            item.remark = remInput.value;
            queueSave();
          });

          table.appendChild(row);
        });

        body.appendChild(table);
      }

      // Add Item Picker or Button
      if(openPicker === cat.id){
        body.appendChild(renderPicker(cat));
      } else {
        const addBtn = document.createElement('button');
        addBtn.className = 'add-item-trigger-btn';
        addBtn.textContent = '+ Add Item to ' + cat.title;
        addBtn.addEventListener('click', () => {
          openPicker = cat.id;
          pickerQuery = '';
          render();
        });
        body.appendChild(addBtn);
      }

      catBlock.appendChild(body);
    }

    return catBlock;
  }

  // Inline product search picker inside a category
  function renderPicker(cat){
    const box = document.createElement('div');
    box.className = 'picker-box';

    box.innerHTML = `
      <div class="picker-input-row">
        <input type="text" class="picker-input" id="pickerInputEl" placeholder="Search catalog or type a custom product name…" value="${escapeHtml(pickerQuery)}">
        <button class="picker-close-btn" id="pickerCloseBtn">Close</button>
      </div>
      <div id="pickerCustomWrap"></div>
      <div class="picker-results-list" id="pickerResultsWrap"></div>
    `;

    const input = box.querySelector('#pickerInputEl');
    const closeBtn = box.querySelector('#pickerCloseBtn');
    const customWrap = box.querySelector('#pickerCustomWrap');
    const resultsWrap = box.querySelector('#pickerResultsWrap');

    closeBtn.addEventListener('click', () => {
      openPicker = null; pickerQuery = ''; render();
    });

    const updateResults = () => {
      pickerQuery = input.value;
      const q = pickerQuery.trim();
      const existingNames = (cat.items || []).map(i => i.name.toLowerCase());

      customWrap.innerHTML = '';
      if(q.length > 0){
        const customBtn = document.createElement('div');
        customBtn.className = 'picker-add-custom';
        customBtn.textContent = `+ Add "${q}" as custom item`;
        customBtn.addEventListener('click', () => addItemToCategory(cat, q));
        customWrap.appendChild(customBtn);
      }

      resultsWrap.innerHTML = '';
      if(q.length === 0){
        const hint = document.createElement('div');
        hint.style.cssText = 'font-size:11.5px;color:var(--ink-faint);text-align:center;padding:8px;';
        hint.textContent = 'Type above to search the salon catalog or add a custom item.';
        resultsWrap.appendChild(hint);
        return;
      }

      const ql = q.toLowerCase();
      const matches = CATALOG.filter(([name]) => name.toLowerCase().includes(ql)).slice(0, 10);
      if(matches.length === 0){
        const empty = document.createElement('div');
        empty.style.cssText = 'font-size:11.5px;color:var(--ink-faint);text-align:center;padding:8px;';
        empty.textContent = 'No catalog products match. Use the custom add button above.';
        resultsWrap.appendChild(empty);
        return;
      }

      matches.forEach(([name, prodCat]) => {
        const opt = document.createElement('div');
        opt.className = 'picker-item-option';
        const isAdded = existingNames.includes(name.toLowerCase());
        if(isAdded) opt.style.opacity = '0.4';

        opt.innerHTML = `
          <div>
            <div style="font-size:13px;font-weight:500;color:#ffffff;">${escapeHtml(name)} ${isAdded ? '<span style="font-size:10px;color:var(--green);">&check; Added</span>' : ''}</div>
            <div style="font-size:11px;color:var(--ink-faint);">${escapeHtml(prodCat || '')}</div>
          </div>
          <span style="font-size:11px;color:var(--gold);">&plus; Add</span>
        `;

        if(!isAdded){
          opt.addEventListener('click', () => addItemToCategory(cat, name));
        }
        resultsWrap.appendChild(opt);
      });
    };

    input.addEventListener('input', updateResults);
    setTimeout(() => input.focus(), 20);
    updateResults();

    return box;
  }

  function addItemToCategory(cat, name){
    const trimmed = name.trim();
    if(!trimmed) return;
    if((cat.items || []).some(i => i.name.toLowerCase() === trimmed.toLowerCase())){
      showToast(`"${trimmed}" is already in this category.`);
      return;
    }
    cat.items.push({ id: uid(), name: trimmed, status: null, remark: '' });
    pickerQuery = '';
    save();
    render();
    showToast(`Added "${trimmed}" to ${cat.title}.`);
  }

  async function addCategory(){
    const name = await THDialog.prompt('Name for the new category:', '', { title: 'Add Category', placeholder: 'e.g. Aftershave Balm, Towels & Linens' });
    if(!name) return;
    const trimmed = name.trim();
    if(!trimmed) return;
    const cats = activeCats();
    if(cats.some(c => c.title.toLowerCase() === trimmed.toLowerCase())){
      await THDialog.alert('A category with that name already exists for this station.');
      return;
    }
    const newCat = { id: uid(), title: trimmed, items: [] };
    cats.push(newCat);
    expandedCats.add(newCat.id);
    openPicker = newCat.id;
    save();
    render();
  }

  // ---------- Modal: "Add Item to Stations" (Batch) ----------
  const modalOverlayEl = document.getElementById('everywhereModal');
  const modalBoxEl = document.getElementById('everywhereModalBox');

  function closeModal(){ modalOverlayEl.classList.remove('open'); }
  modalOverlayEl.addEventListener('click', (e) => { if(e.target === modalOverlayEl) closeModal(); });

  function unionCategoriesInfo(){
    const map = new Map();
    state.stations.forEach(st => {
      categoriesForStation(st.id).forEach(cat => {
        const k = cat.title.toLowerCase();
        if(!map.has(k)) map.set(k, { title: cat.title, stationIds: new Set() });
        map.get(k).stationIds.add(st.id);
      });
    });
    return [...map.values()].sort((a, b) => a.title.localeCompare(b.title));
  }

  function allKnownProductNames(){
    const set = new Set();
    CATALOG.forEach(p => { if(p[0]) set.add(p[0]); });
    state.stations.forEach(st => {
      categoriesForStation(st.id).forEach(cat => {
        (cat.items || []).forEach(it => { if(it.name) set.add(it.name); });
      });
    });
    return [...set].sort((a, b) => a.localeCompare(b));
  }

  function addItemToAllStations(){
    if(!state.stations.length){ showToast('Add a station first.'); return; }
    openCategoryStep();
    modalOverlayEl.classList.add('open');
  }

  function openCategoryStep(){
    const cats = unionCategoriesInfo();
    const totalStations = state.stations.length;

    modalBoxEl.innerHTML = `
      <div class="modal-header">
        <div>
          <div class="modal-title">Batch Add Item to Stations</div>
          <div class="modal-subtitle">Step 1 of 2 &mdash; Choose or create target category</div>
        </div>
        <button class="modal-close-btn" id="modalCloseBtn">&times;</button>
      </div>

      <div style="margin-bottom:16px;">
        <div style="font-size:11px;letter-spacing:0.5px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px;font-weight:600;">Existing Categories</div>
        <div class="picker-results-list" id="catPickList" style="max-height:190px;">
          ${cats.length === 0 ? '<div style="font-size:12px;color:var(--ink-faint);padding:10px;text-align:center;">No categories yet. Create one below.</div>' : ''}
          ${cats.map(c => `
            <div class="picker-item-option" data-cat="${escapeHtml(c.title)}" style="padding:10px 14px;">
              <span style="font-weight:600;color:var(--gold);">${escapeHtml(c.title)}</span>
              <span style="font-size:11px;color:var(--ink-soft);">${c.stationIds.size} of ${totalStations} stations</span>
            </div>
          `).join('')}
        </div>
      </div>

      <div>
        <div style="font-size:11px;letter-spacing:0.5px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px;font-weight:600;">Or Create New Category</div>
        <div class="picker-input-row">
          <input type="text" class="picker-input" id="newCatModalInput" placeholder="e.g. Shaving Creams, Aftershave Balm">
          <button class="primary-action-btn" id="btnUseNewCat" style="border-radius:999px;">Use This</button>
        </div>
      </div>
    `;

    modalBoxEl.querySelector('#modalCloseBtn').addEventListener('click', closeModal);

    modalBoxEl.querySelectorAll('#catPickList .picker-item-option').forEach(row => {
      row.addEventListener('click', () => {
        const catTitle = row.dataset.cat;
        const info = cats.find(c => c.title.toLowerCase() === catTitle.toLowerCase());
        openStationStep(catTitle, info ? info.stationIds : new Set());
      });
    });

    const newIn = modalBoxEl.querySelector('#newCatModalInput');
    const newBtn = modalBoxEl.querySelector('#btnUseNewCat');
    const submitNew = () => {
      const trimmed = newIn.value.trim();
      if(!trimmed) return;
      openStationStep(trimmed, new Set());
    };
    newBtn.addEventListener('click', submitNew);
    newIn.addEventListener('keydown', (e) => { if(e.key === 'Enter') submitNew(); });
  }

  function openStationStep(catTitle, stationIdsWithCat){
    modalBoxEl.innerHTML = `
      <div class="modal-header">
        <div>
          <div style="font-size:11px;color:var(--gold);cursor:pointer;margin-bottom:4px;" id="modalBackCat">&lsaquo; Back to Category</div>
          <div class="modal-title">${escapeHtml(catTitle)}</div>
          <div class="modal-subtitle">Step 2 of 2 &mdash; Select destination stations & product</div>
        </div>
        <button class="modal-close-btn" id="modalCloseBtn2">&times;</button>
      </div>

      <div style="margin-bottom:16px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
          <span style="font-size:11px;letter-spacing:0.5px;text-transform:uppercase;color:var(--ink-faint);font-weight:600;">Stations</span>
          <div style="display:flex;gap:6px;">
            <button class="strip-btn" id="btnSelectAllSt">All</button>
            <button class="strip-btn" id="btnSelectMissingSt">Missing Only</button>
            <button class="strip-btn" id="btnSelectNoneSt">None</button>
          </div>
        </div>

        <div class="picker-results-list" style="max-height:160px;" id="stCheckList">
          ${state.stations.map(st => {
            const hasCat = stationIdsWithCat.has(st.id);
            return `
              <label class="picker-item-option" style="cursor:pointer;">
                <div style="display:flex;align-items:center;gap:10px;">
                  <input type="checkbox" value="${st.id}" ${!hasCat ? 'checked' : ''} style="width:16px;height:16px;accent-color:var(--gold);cursor:pointer;">
                  <span style="font-size:13px;font-weight:500;color:#ffffff;">${escapeHtml(st.title)}</span>
                </div>
                ${hasCat ? '<span style="font-size:10px;color:var(--amber);">has category</span>' : ''}
              </label>
            `;
          }).join('')}
        </div>
      </div>

      <div style="margin-bottom:20px;">
        <div style="font-size:11px;letter-spacing:0.5px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px;font-weight:600;">Product / Item Name</div>
        <input type="text" class="picker-input" id="batchProductInput" placeholder="Search catalog or type custom name…" style="width:100%;">
        <div class="picker-results-list" id="batchSuggestBox" style="display:none;margin-top:6px;max-height:140px;"></div>
      </div>

      <button class="primary-action-btn" id="btnConfirmBatchAdd" style="width:100%;justify-content:center;padding:12px;">
        Add Item to Selected Stations
      </button>
    `;

    modalBoxEl.querySelector('#modalCloseBtn2').addEventListener('click', closeModal);
    modalBoxEl.querySelector('#modalBackCat').addEventListener('click', openCategoryStep);

    const cbs = Array.from(modalBoxEl.querySelectorAll('#stCheckList input[type="checkbox"]'));
    modalBoxEl.querySelector('#btnSelectAllSt').addEventListener('click', () => cbs.forEach(c => c.checked = true));
    modalBoxEl.querySelector('#btnSelectNoneSt').addEventListener('click', () => cbs.forEach(c => c.checked = false));
    modalBoxEl.querySelector('#btnSelectMissingSt').addEventListener('click', () => cbs.forEach(c => { c.checked = !stationIdsWithCat.has(c.value); }));

    // Product search typeahead
    const pIn = modalBoxEl.querySelector('#batchProductInput');
    const suggestBox = modalBoxEl.querySelector('#batchSuggestBox');
    const knownNames = allKnownProductNames();

    const renderSuggest = () => {
      const q = pIn.value.trim().toLowerCase();
      suggestBox.innerHTML = '';
      if(!q){ suggestBox.style.display = 'none'; return; }
      const matches = knownNames.filter(n => n.toLowerCase().includes(q)).slice(0, 8);
      if(!matches.length){ suggestBox.style.display = 'none'; return; }
      matches.forEach(name => {
        const item = document.createElement('div');
        item.className = 'picker-item-option';
        item.textContent = name;
        item.addEventListener('mousedown', (e) => {
          e.preventDefault();
          pIn.value = name;
          suggestBox.style.display = 'none';
        });
        suggestBox.appendChild(item);
      });
      suggestBox.style.display = 'flex';
    };

    pIn.addEventListener('input', renderSuggest);
    pIn.addEventListener('focus', renderSuggest);
    pIn.addEventListener('blur', () => setTimeout(() => { suggestBox.style.display = 'none'; }, 150));

    modalBoxEl.querySelector('#btnConfirmBatchAdd').addEventListener('click', () => {
      const itemName = pIn.value.trim();
      if(!itemName){ pIn.focus(); return; }
      const selectedIds = cbs.filter(c => c.checked).map(c => c.value);
      if(!selectedIds.length){ showToast('Select at least one station.'); return; }

      let count = 0;
      selectedIds.forEach(stId => {
        const cats = categoriesForStation(stId);
        let cat = cats.find(c => c.title.toLowerCase() === catTitle.toLowerCase());
        if(!cat){
          cat = { id: uid(), title: catTitle, items: [] };
          cats.push(cat);
        }
        if(!cat.items.some(i => i.name.toLowerCase() === itemName.toLowerCase())){
          cat.items.push({ id: uid(), name: itemName, status: null, remark: '' });
          count++;
        }
      });

      save();
      render();
      closeModal();
      showToast(`Added "${itemName}" to ${count} of ${selectedIds.length} station(s).`);
    });
  }

  // ---------- Excel Export (ExcelJS) ----------
  async function exportStationExcel(stationId){
    if(typeof ExcelJS === 'undefined'){
      await THDialog.alert('Excel export library is loading. Please check connection and try again.');
      return;
    }
    const st = stationById(stationId);
    if(!st) return;
    const g = groupById(st.groupId);
    const cats = (state.data[stationId] || []).filter(c => (c.items || []).length > 0);
    if(!cats.length){
      await THDialog.alert('This station has no items to export yet.');
      return;
    }

    const thin = { style: 'thin', color: { argb: 'FFB8B8B8' } };
    const cellBorder = { top: thin, left: thin, bottom: thin, right: thin };

    const wb = new ExcelJS.Workbook();
    const sheetName = (st.title || 'Station').replace(/[\\\/\?\*\[\]:]/g, '').slice(0, 31) || 'Checklist';
    const ws = wb.addWorksheet(sheetName);
    ws.columns = [{ width: 42 }, { width: 24 }, { width: 34 }, { width: 18 }];

    // Title
    ws.mergeCells('A1:D1');
    const titleCell = ws.getCell('A1');
    titleCell.value = (g ? g.title + ' \u2014 ' : '') + st.title + ' \u2014 Station Checklist';
    titleCell.font = { name: 'Calibri', size: 14, bold: true, color: { argb: 'FF1F4A35' } };
    titleCell.alignment = { horizontal: 'center', vertical: 'middle' };
    ws.getRow(1).height = 26;

    // Header info
    ws.getCell('A3').value = 'Date: ' + new Date().toLocaleDateString();
    ws.getCell('A3').font = { bold: true, size: 11 };
    ws.getCell('D3').value = 'Staff Checked:';
    ws.getCell('D3').font = { bold: true, size: 11 };
    ['A', 'B', 'C', 'D'].forEach(col => { ws.getCell(col + '3').border = cellBorder; });
    ws.getRow(3).height = 20;

    let rowNum = 5;

    cats.forEach(cat => {
      ws.mergeCells('A' + rowNum + ':D' + rowNum);
      const catCell = ws.getCell('A' + rowNum);
      catCell.value = cat.title;
      catCell.font = { bold: true, size: 12, color: { argb: 'FFFBF7EA' } };
      catCell.alignment = { vertical: 'middle' };
      catCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1F4A35' } };
      ['A', 'B', 'C', 'D'].forEach(col => { ws.getCell(col + rowNum).border = cellBorder; });
      ws.getRow(rowNum).height = 20;
      rowNum++;

      const headers = ['Item', 'Status (Present / Refill / Missing)', 'Remarks / Notes', 'Sign'];
      headers.forEach((h, i) => {
        const cell = ws.getCell(rowNum, i + 1);
        cell.value = h;
        cell.font = { bold: true, size: 10.5, color: { argb: 'FF1F4A35' } };
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFEFE7D2' } };
        cell.alignment = { vertical: 'middle', wrapText: true };
        cell.border = cellBorder;
      });
      rowNum++;

      cat.items.forEach(item => {
        const c1 = ws.getCell(rowNum, 1);
        c1.value = item.name;
        c1.alignment = { vertical: 'middle', wrapText: true };

        const c2 = ws.getCell(rowNum, 2);
        c2.value = item.status === 'yes' ? 'Present (আছে)' : item.status === 'refill' ? 'Refill (রিফিল)' : item.status === 'no' ? 'Missing (নাই)' : 'Unchecked';
        c2.alignment = { vertical: 'middle', horizontal: 'center' };

        const c3 = ws.getCell(rowNum, 3);
        c3.value = item.remark || '';
        c3.alignment = { vertical: 'middle', wrapText: true };

        const c4 = ws.getCell(rowNum, 4);
        [c1, c2, c3, c4].forEach(c => { c.border = cellBorder; });
        rowNum++;
      });

      rowNum++;
    });

    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const safeName = (st.title || 'station').replace(/[\\/:*?"<>|]/g, '').trim() || 'station';
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `th-station-checklist-${safeName}-${stamp}.xlsx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Checklist downloaded as Excel.');
  }

  // Backup support
  window.THBackup = {
    note: 'Your checklists sync to salon cloud in real-time. Use Import to restore a backup file.',
    importFile: async function(file){
      const reader = new FileReader();
      reader.onload = async function(e){
        try{
          const parsed = JSON.parse(e.target.result);
          const incoming = parsed && parsed.state ? parsed.state : parsed;
          const migrated = migrateIfNeeded(incoming);
          if(!migrated || !Array.isArray(migrated.groups) || typeof migrated.data !== 'object'){
            await THDialog.alert('Invalid checklist backup format.');
            return;
          }
          const ok = await THDialog.confirm('Import backup? This will replace your current checklist data.', { title: 'Import Backup', okText: 'Import' });
          if(!ok) return;
          state = migrated;
          goToGroups();
          showToast('Backup restored successfully.');
        }catch(err){
          await THDialog.alert('Could not parse file.');
        }
      };
      reader.readAsText(file);
    },
    reset: async function(){
      const ok = await THDialog.confirm('Reset all groups, stations, and checklist items? This cannot be undone.', { title: 'Reset Checklist', okText: 'Reset All', danger: true });
      if(!ok) return;
      state = JSON.parse(JSON.stringify(DEFAULT_STATE));
      goToGroups();
      showToast('Checklist reset.');
    }
  };

  // Sync live products
  window.thAuthReady.then(function(){
    window.thDB.collection(DOC_COLLECTION).doc('products').onSnapshot(function(snap){
      if(snap.exists && Array.isArray(snap.data().items)){
        CATALOG = snap.data().items.map(p => [p.name, p.category || '']);
        if(openPicker) render();
      }
    });
  });

  load();
})();
</script>
