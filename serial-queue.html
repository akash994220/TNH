<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Truefitt &amp; Hill — Serial Queue</title>
<style>html,body{background:#0d1535;}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="auth.js"></script>
<style>
  :root{
    --ink:#f3efe4;
    --ink-soft:rgba(243,239,228,0.62);
    --ink-faint:rgba(243,239,228,0.4);
    --gold:#d9b872;
    --gold-soft:#a9884f;
    --green:#3a8562;
    --red:#e08b7d;
    --glass:rgba(255,255,255,0.055);
    --glass-border:rgba(255,255,255,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Poppins',sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:48px 16px;
    background:
      radial-gradient(900px 560px at 15% -8%, rgba(217,184,114,0.16), transparent 60%),
      radial-gradient(1000px 700px at 100% 10%, rgba(26,58,143,0.35), transparent 55%),
      radial-gradient(800px 600px at 50% 120%, rgba(26,58,143,0.22), transparent 55%),
      linear-gradient(160deg, #0d1535 0%, #080d1e 45%, #120828 100%);
    background-attachment:fixed;
  }

  .app{ width:100%; max-width:560px; }

  header{ text-align:center; margin-bottom:22px; }
  .crest{ display:inline-flex; align-items:center; gap:12px; margin-bottom:10px; }
  .crest-line{ width:30px; height:1px; background:linear-gradient(90deg, transparent, var(--gold)); }
  .crest-line.right{background:linear-gradient(90deg, var(--gold), transparent);}
  .brand{ font-size:12px; letter-spacing:4.5px; text-transform:uppercase; color:var(--gold); font-weight:400; }
  h1{ font-weight:400; font-size:28px; letter-spacing:0.3px; margin:0; color:var(--ink); text-shadow:0 2px 20px rgba(0,0,0,0.4); }
  .subtitle{ font-size:12.5px; color:var(--ink-faint); margin-top:6px; letter-spacing:0.4px; }

  .tabs{
    display:flex; gap:6px; margin-bottom:18px;
    background:rgba(4,7,18,0.48); border:1px solid rgba(217,184,114,0.25);
    border-radius:999px; padding:5px; box-shadow:inset 0 2px 6px rgba(0,0,0,0.3);
  }
  .tab-btn{
    flex:1; padding:10px 14px; font-size:12.5px; font-weight:600; letter-spacing:0.8px; text-align:center;
    border-radius:999px; cursor:pointer; font-family:inherit; transition:all .2s cubic-bezier(0.16,1,0.3,1);
    background:transparent; border:none; color:var(--ink-soft); text-transform:uppercase;
  }
  .tab-btn:hover{ color:#f3efe4; }
  .tab-btn.active{
    background:linear-gradient(135deg,#fae6a2 0%,#d9b872 50%,#aa8232 100%);
    color:#140e03; font-weight:700;
    box-shadow:0 4px 14px rgba(217,184,114,0.45), inset 0 1px 0 rgba(255,255,255,0.6);
  }

  .panel{
    background:linear-gradient(165deg, rgba(16,22,46,0.88) 0%, rgba(9,13,30,0.94) 100%);
    border:1px solid rgba(217,184,114,0.26);
    border-radius:24px;
    padding:24px 22px;
    backdrop-filter:blur(24px) saturate(140%);
    -webkit-backdrop-filter:blur(24px) saturate(140%);
    box-shadow:0 20px 50px -15px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.08);
    margin-bottom:18px;
  }

  .section-title{
    font-size:11px; letter-spacing:2.2px; text-transform:uppercase; color:#d9b872; margin:0 0 12px; font-weight:700;
  }
  .section-title:not(:first-child){ margin-top:24px; }

  .empty-hint{
    text-align:center; padding:26px 18px; color:var(--ink-faint); font-size:13px;
    border:1px dashed rgba(217,184,114,0.25); border-radius:16px; background:rgba(217,184,114,0.02);
  }

  .q-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .q-item{
    background:rgba(255,255,255,0.035); border:1px solid rgba(217,184,114,0.18); border-radius:14px;
    padding:12px 16px; display:flex; align-items:center; gap:12px;
    box-shadow:0 4px 14px rgba(0,0,0,0.2); transition:all .18s cubic-bezier(0.16,1,0.3,1);
  }
  .q-item:hover{ background:rgba(217,184,114,0.07); border-color:rgba(217,184,114,0.4); transform:translateY(-1px); }
  .q-item.next{ border-color:rgba(217,184,114,0.6); background:linear-gradient(135deg, rgba(217,184,114,0.15), rgba(217,184,114,0.04)); box-shadow:0 0 18px -4px rgba(217,184,114,0.35); }
  .q-item.busy{ border-color:rgba(224,139,125,0.4); background:rgba(224,139,125,0.06); }
  .q-pos{
    flex:0 0 auto; padding:6px 12px; border-radius:999px; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; letter-spacing:0.3px; white-space:nowrap;
    background:linear-gradient(135deg, rgba(217,184,114,0.22), rgba(217,184,114,0.08));
    border:1px solid rgba(217,184,114,0.45); color:#d9b872;
    box-shadow:0 2px 6px rgba(0,0,0,0.2);
  }
  .q-name{ flex:1 1 auto; min-width:0; font-size:14px; font-weight:500; word-break:break-word; }
  .q-since{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ink-faint); margin-top:2px; }
  .q-edit{
    flex:0 0 auto; width:20px; height:20px; border-radius:50%; background:transparent; border:none;
    color:var(--ink-faint); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
    transition:all .15s ease;
  }
  .q-edit svg{ width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:1.8; }
  .q-edit:hover{ color:#d9b872; transform:scale(1.1); }
  .time-edit-row{ display:flex; align-items:center; gap:6px; margin-top:6px; }
  .time-edit-row input[type="time"]{
    padding:6px 10px; font-size:12px; border-radius:8px; background:rgba(4,7,18,0.5);
    border:1px solid rgba(217,184,114,0.4); color:var(--ink); font-family:inherit; outline:none;
  }
  .time-edit-row button{
    padding:6px 12px; font-size:11.5px; font-weight:600; border-radius:999px; cursor:pointer; font-family:inherit;
    border:1px solid rgba(217,184,114,0.45); background:rgba(217,184,114,0.16); color:#d9b872;
    transition:all .15s ease;
  }
  .time-edit-row button:hover{ background:rgba(217,184,114,0.3); }
  .time-edit-row button.cancel{ border-color:rgba(255,255,255,0.16); background:rgba(255,255,255,0.06); color:var(--ink-soft); }
  .time-edit-row button.cancel:hover{ background:rgba(255,255,255,0.12); }
  .q-controls{ flex:0 0 auto; display:flex; align-items:center; gap:7px; }
  .q-btn{
    padding:8px 15px; font-size:11.5px; font-weight:700; letter-spacing:0.3px; border-radius:999px; cursor:pointer; font-family:inherit;
    border:1px solid rgba(217,184,114,0.45); background:rgba(217,184,114,0.12); color:#d9b872; transition:all .18s cubic-bezier(0.16,1,0.3,1);
    white-space:nowrap; box-shadow:0 2px 6px rgba(0,0,0,0.2);
  }
  .q-btn:hover{ background:linear-gradient(135deg, #fae6a2, #d9b872); color:#140e03; border-color:#d9b872; transform:translateY(-1px); }
  .q-btn.done-btn{ border-color:rgba(74,222,128,0.5); background:rgba(74,222,128,0.12); color:#4ade80; }
  .q-btn.done-btn:hover{ background:linear-gradient(135deg,#4ade80,#22c55e); color:#052e16; border-color:#4ade80; }
  .q-x{
    width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.14);
    color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; flex:0 0 auto;
    transition:all .15s ease;
  }
  .q-x:hover{ color:#ff6b6b; background:rgba(224,82,82,0.16); border-color:#e05252; transform:scale(1.08); }

  .add-item-btn{
    width:100%; padding:12px; font-size:12.5px; font-weight:600; letter-spacing:0.6px; text-align:center;
    border-radius:14px; cursor:pointer; background:rgba(217,184,114,0.04);
    border:1px dashed rgba(217,184,114,0.45); color:#d9b872;
    transition:all .18s cubic-bezier(0.16,1,0.3,1); margin-top:16px; font-family:inherit;
  }
  .add-item-btn:hover{ background:rgba(217,184,114,0.12); border-color:#d9b872; transform:translateY(-1px); }

  .picker{ margin-top:14px; padding:16px; border-radius:18px; background:rgba(4,7,18,0.5); border:1px solid rgba(217,184,114,0.3); box-shadow:0 8px 24px rgba(0,0,0,0.35); }
  .picker-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .picker-head span{ font-size:12px; color:#d9b872; font-weight:600; }
  .picker-head button{ padding:0 14px; height:30px; font-size:12px; font-weight:500; border-radius:999px; cursor:pointer; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.16); color:var(--ink-soft); transition:all .15s ease; }
  .picker-head button:hover{ background:rgba(255,255,255,0.12); color:#f3efe4; }
  .picker-results{ display:flex; flex-wrap:wrap; gap:8px; }
  .picker-chip{
    padding:8px 16px; border-radius:999px; cursor:pointer; font-size:13px; font-weight:500;
    background:rgba(255,255,255,0.04); border:1px solid rgba(217,184,114,0.22); color:var(--ink);
    transition:all .18s cubic-bezier(0.16,1,0.3,1);
  }
  .picker-chip:hover{ background:linear-gradient(135deg, rgba(217,184,114,0.24), rgba(217,184,114,0.08)); border-color:#d9b872; color:#ffd166; transform:translateY(-1px); }
  .picker-empty{ text-align:center; font-size:12px; color:var(--ink-faint); padding:12px; width:100%; }

  .time-confirm{ padding:4px; }
  .time-confirm-name{ font-size:14px; margin-bottom:12px; font-weight:600; color:#d9b872; }
  .time-confirm-row{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .time-confirm-row label{ font-size:12px; color:var(--ink-faint); }
  .time-confirm-row input[type="time"]{
    flex:1; padding:10px 14px; font-size:13.5px; border-radius:12px; background:rgba(4,7,18,0.5);
    border:1px solid rgba(217,184,114,0.4); color:var(--ink); font-family:inherit; outline:none;
  }
  .time-confirm-actions{ display:flex; gap:10px; }
  .time-confirm-actions button{
    flex:1; padding:12px 16px; font-size:13px; font-weight:600; letter-spacing:0.3px;
    border-radius:999px; cursor:pointer; font-family:inherit; transition:all .18s cubic-bezier(0.16,1,0.3,1);
  }
  .time-confirm-actions .cancel-btn{ background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.16); color:var(--ink-soft); }
  .time-confirm-actions .cancel-btn:hover{ background:rgba(255,255,255,0.12); color:#f3efe4; }
  .time-confirm-actions .confirm-btn{ background:linear-gradient(135deg,#fae6a2 0%,#d9b872 50%,#aa8232 100%); border:none; color:#140e03; box-shadow:0 4px 14px rgba(217,184,114,0.45); }
  .time-confirm-actions .confirm-btn:hover{ transform:translateY(-1px); box-shadow:0 6px 18px rgba(217,184,114,0.6); }

  footer{ text-align:center; margin-top:24px; font-size:11px; color:var(--ink-faint); letter-spacing:0.3px; }
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(10px);
    background:linear-gradient(165deg,#131c44 0%,#090e24 100%); border:1px solid rgba(217,184,114,0.4); color:var(--ink);
    padding:12px 24px; border-radius:999px; font-size:13px; z-index:600;
    opacity:0; pointer-events:none; transition:all .22s cubic-bezier(0.16,1,0.3,1);
    box-shadow:0 12px 36px rgba(0,0,0,0.65); text-align:center; max-width:90vw;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .footer-gold{color:var(--gold);}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
  @media (max-width:420px){ .panel{border-radius:22px; padding:16px;} h1{font-size:24px;} }

  body.light{
    --ink:#0a1f44; --ink-soft:rgba(10,31,68,0.68); --ink-faint:rgba(10,31,68,0.42);
    --gold:#1a3a8f; --gold-soft:#15316f;
    --glass:linear-gradient(165deg, rgba(255,255,255,0.95) 0%, rgba(246,248,254,0.98) 100%);
    --glass-border:rgba(26,58,143,0.18);
    background:
      radial-gradient(900px 560px at 15% -8%, rgba(26,58,143,0.06), transparent 60%),
      radial-gradient(1000px 700px at 100% 10%, rgba(26,58,143,0.08), transparent 55%),
      linear-gradient(160deg, #f5f7fc 0%, #eef1fa 55%, #f2effa 100%);
  }
  body.light h1{ text-shadow:none; }
  body.light .tabs{ background:rgba(255,255,255,0.7); border-color:rgba(26,58,143,0.18); box-shadow:inset 0 1px 4px rgba(26,58,143,0.08); }
  body.light .tab-btn{ color:var(--ink-soft); }
  body.light .tab-btn.active{ background:linear-gradient(135deg,#1f47b2 0%,#10296e 100%); color:#ffffff; box-shadow:0 4px 14px rgba(26,58,143,0.35); }
  body.light .empty-hint{ background:rgba(255,255,255,0.45); border-color:rgba(26,58,143,0.18); }
  body.light .q-item{ background:#ffffff; border-color:rgba(26,58,143,0.14); box-shadow:0 4px 12px rgba(10,31,68,0.04); }
  body.light .q-item.next{ background:linear-gradient(135deg, rgba(26,58,143,0.08), rgba(26,58,143,0.02)); border-color:rgba(26,58,143,0.35); }
  body.light .q-item.busy{ border-color:rgba(224,139,125,0.45); }
  body.light .q-pos{ background:linear-gradient(135deg, rgba(26,58,143,0.09), rgba(26,58,143,0.03)); border-color:rgba(26,58,143,0.25); color:#1a3a8f; box-shadow:none; }
  body.light .q-btn{ background:rgba(26,58,143,0.08); border-color:rgba(26,58,143,0.3); color:#1a3a8f; box-shadow:none; }
  body.light .q-btn:hover{ background:#1a3a8f; color:#ffffff; }
  body.light .q-x{ background:rgba(26,58,143,0.05); border-color:rgba(26,58,143,0.15); }
  body.light .add-item-btn{ border-color:rgba(26,58,143,0.35); color:#1a3a8f; background:rgba(26,58,143,0.03); }
  body.light .add-item-btn:hover{ background:rgba(26,58,143,0.08); border-color:#1a3a8f; }
  body.light .picker{ background:#ffffff; border-color:rgba(26,58,143,0.22); box-shadow:0 8px 24px rgba(10,31,68,0.08); }
  body.light .picker-chip{ background:rgba(26,58,143,0.04); border-color:rgba(26,58,143,0.18); color:#0a1f44; }
  body.light .picker-chip:hover{ background:rgba(26,58,143,0.12); border-color:rgba(26,58,143,0.35); color:#1a3a8f; }
  body.light .time-confirm-row input[type="time"],
  body.light .time-edit-row input[type="time"]{ background:#ffffff; border-color:rgba(26,58,143,0.25); color:#0a1f44; }
  body.light .time-confirm-actions .cancel-btn{ background:rgba(26,58,143,0.05); border-color:rgba(26,58,143,0.16); color:var(--ink-soft); }
  body.light .time-confirm-actions .confirm-btn{ background:linear-gradient(135deg,#1f47b2 0%,#10296e 100%); color:#ffffff; }
  body.light .toast{ background:#ffffff; border:1px solid rgba(26,58,143,0.22); color:#0a1f44; box-shadow:0 12px 32px rgba(10,31,68,0.15); }
</style>
</head>
<body>
<script>try{var t=localStorage.getItem('th-theme');if(t==='light'||(!t&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches))document.body.classList.add('light');}catch(e){}</script>
<div class="app">
  <header>
    <div class="crest">
      <span class="crest-line"></span>
      <span class="brand">Truefitt &amp; Hill</span>
      <span class="crest-line right"></span>
    </div>
    <h1>Serial Queue</h1>
    <div class="subtitle" id="subtitle">Loading&hellip;</div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" id="tabBarber">Barbers</button>
    <button class="tab-btn" id="tabTherapist">Therapists</button>
  </div>

  <div class="panel">
    <div id="viewBody"></div>
  </div>

  <footer>Serial Queue &nbsp;<span class="footer-gold">&middot;</span>&nbsp; Truefitt &amp; Hill</footer>
</div>

<div class="toast" id="toastEl"></div>

<script>
(function(){
  const COLLECTION = 'th-staff-tools';
  const DOC_ID = 'serial-queue';

  const STAFF_LISTS = {
    barber: ["Ashutosh","Poritosh","Sushanto","Sanjit","Nasir","Kaium","Dipok","Nitol","Sumon"],
    therapist: ["Rana","Rasel","Privan","Tipu","Arup","Maki","Hemar"]
  };
  const TAB_LABEL = { barber: 'barber', therapist: 'therapist' };

  let state = null;     // { barber: [{name,status,since}], therapist: [...] }
  let docRef = null;
  let currentTab = 'barber';
  let pickerOpen = false;
  let pendingAddName = null;   // name chosen from picker, awaiting time confirm
  let pendingAddTime = null;   // "HH:MM" string for the time-confirm step
  let editingName = null;      // name whose "since" time is being edited inline

  const toastEl = document.getElementById('toastEl');
  let toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3000);
  }

  const subtitleEl = document.getElementById('subtitle');
  const viewBodyEl = document.getElementById('viewBody');
  const tabBarberBtn = document.getElementById('tabBarber');
  const tabTherapistBtn = document.getElementById('tabTherapist');

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function fmtTime(ms){
    if(!ms) return '';
    return new Date(ms).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  }

  function ordinal(n){
    const s = ['th','st','nd','rd'];
    const v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]) + ' Serial';
  }

  // <input type="time"> <-> epoch ms, using today's date
  function msToTimeStr(ms){
    const d = new Date(ms);
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  function timeStrToMs(timeStr, baseMs){
    const parts = (timeStr || '').split(':');
    if(parts.length !== 2) return baseMs;
    const h = parseInt(parts[0], 10), m = parseInt(parts[1], 10);
    if(isNaN(h) || isNaN(m)) return baseMs;
    const d = new Date(baseMs || Date.now());
    d.setHours(h, m, 0, 0);
    return d.getTime();
  }

  function load(){
    subtitleEl.textContent = 'Connecting\u2026';
    window.thAuthReady.then(function(){
      const db = window.thDB;
      docRef = db.collection(COLLECTION).doc(DOC_ID);
      docRef.onSnapshot(function(snap){
        if(snap.metadata.hasPendingWrites) return;
        const d = snap.exists ? snap.data() : {};
        state = { barber: Array.isArray(d.barber) ? d.barber : [], therapist: Array.isArray(d.therapist) ? d.therapist : [] };
        render();
      }, function(err){
        console.error('Serial queue sync error', err);
        subtitleEl.textContent = 'Could not connect \u2014 check your internet connection.';
      });
    });
  }

  function save(){
    if(!docRef || !state) return;
    const payload = Object.assign({}, state, { updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    docRef.set(payload).catch(e => console.error('Could not save serial queue', e));
  }

  function listFor(tab){ return state[tab]; }

  function addToQueue(tab, name, sinceMs){
    const list = listFor(tab);
    if(list.some(p => p.name === name)) return;
    list.push({ name: name, status: 'waiting', since: sinceMs || Date.now() });
    save();
    pickerOpen = false;
    pendingAddName = null;
    pendingAddTime = null;
    render();
    showToast(name + ' clocked in at ' + fmtTime(sinceMs || Date.now()) + '.');
  }

  function setSince(tab, name, newMs){
    const list = listFor(tab);
    const p = list.find(x => x.name === name);
    if(!p) return;
    p.since = newMs;
    save();
    editingName = null;
    render();
  }

  function assign(tab, name){
    const list = listFor(tab);
    const p = list.find(x => x.name === name);
    if(!p) return;
    p.status = 'busy';
    save();
    render();
    showToast(name + ' assigned to a client.');
  }

  function markDone(tab, name){
    const list = listFor(tab);
    const p = list.find(x => x.name === name);
    if(!p) return;
    p.status = 'waiting';
    p.since = Date.now();
    save();
    render();
    showToast(name + ' back in the queue.');
  }

  async function clockOut(tab, name){
    const ok = await THDialog.confirm('Clock out ' + name + ' for the day?', { okText: 'Clock out', danger: true });
    if(!ok) return;
    state[tab] = listFor(tab).filter(x => x.name !== name);
    save();
    render();
  }

  function render(){
    tabBarberBtn.classList.toggle('active', currentTab === 'barber');
    tabTherapistBtn.classList.toggle('active', currentTab === 'therapist');

    if(!state){
      subtitleEl.textContent = 'Connecting\u2026';
      viewBodyEl.innerHTML = '';
      return;
    }

    const list = listFor(currentTab);
    const waiting = list.filter(p => p.status === 'waiting').sort((a, b) => a.since - b.since);
    const busy = list.filter(p => p.status === 'busy');

    subtitleEl.textContent = list.length === 0
      ? 'No one clocked in yet'
      : waiting.length + ' waiting \u00b7 ' + busy.length + ' with a client';

    viewBodyEl.innerHTML = '';

    const waitingTitle = document.createElement('div');
    waitingTitle.className = 'section-title';
    waitingTitle.textContent = 'Next up';
    viewBodyEl.appendChild(waitingTitle);

    if(waiting.length === 0){
      const hint = document.createElement('div');
      hint.className = 'empty-hint';
      hint.textContent = 'No one waiting right now.';
      viewBodyEl.appendChild(hint);
    } else {
      const ul = document.createElement('ul');
      ul.className = 'q-list';
      waiting.forEach((p, idx) => {
        const li = document.createElement('li');
        li.className = 'q-item' + (idx === 0 ? ' next' : '');

        const pos = document.createElement('div');
        pos.className = 'q-pos';
        pos.textContent = ordinal(idx + 1);

        const nameWrap = document.createElement('div');
        nameWrap.className = 'q-name';
        const nameLine = document.createElement('div');
        nameLine.textContent = p.name;
        nameWrap.appendChild(nameLine);

        if(editingName === p.name){
          nameWrap.appendChild(renderTimeEditor(currentTab, p));
        } else {
          const sinceLine = document.createElement('div');
          sinceLine.className = 'q-since';
          const sinceText = document.createElement('span');
          sinceText.textContent = 'Arrived ' + fmtTime(p.since);
          const editBtn = document.createElement('button');
          editBtn.className = 'q-edit';
          editBtn.title = 'Edit arrival time';
          editBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 20l3.5-.8L18.5 8.2a1.5 1.5 0 0 0 0-2.1l-1.6-1.6a1.5 1.5 0 0 0-2.1 0L3.8 15.5 3 19z" stroke-linecap="round" stroke-linejoin="round"/></svg>';
          editBtn.addEventListener('click', () => { editingName = p.name; render(); });
          sinceLine.appendChild(sinceText);
          sinceLine.appendChild(editBtn);
          nameWrap.appendChild(sinceLine);
        }

        const controls = document.createElement('div');
        controls.className = 'q-controls';

        const assignBtn = document.createElement('button');
        assignBtn.className = 'q-btn';
        assignBtn.textContent = 'Assign';
        assignBtn.addEventListener('click', () => assign(currentTab, p.name));

        const x = document.createElement('div');
        x.className = 'q-x';
        x.innerHTML = '&times;';
        x.title = 'Clock out';
        x.addEventListener('click', () => clockOut(currentTab, p.name));

        controls.appendChild(assignBtn);
        controls.appendChild(x);

        li.appendChild(pos);
        li.appendChild(nameWrap);
        li.appendChild(controls);
        ul.appendChild(li);
      });
      viewBodyEl.appendChild(ul);
    }

    if(busy.length > 0){
      const busyTitle = document.createElement('div');
      busyTitle.className = 'section-title';
      busyTitle.textContent = 'With a client';
      viewBodyEl.appendChild(busyTitle);

      const ul2 = document.createElement('ul');
      ul2.className = 'q-list';
      busy.forEach(p => {
        const li = document.createElement('li');
        li.className = 'q-item busy';

        const nameWrap = document.createElement('div');
        nameWrap.className = 'q-name';
        nameWrap.style.marginLeft = '2px';
        nameWrap.textContent = p.name;

        const controls = document.createElement('div');
        controls.className = 'q-controls';

        const doneBtn = document.createElement('button');
        doneBtn.className = 'q-btn done-btn';
        doneBtn.textContent = 'Done';
        doneBtn.addEventListener('click', () => markDone(currentTab, p.name));

        const x = document.createElement('div');
        x.className = 'q-x';
        x.innerHTML = '&times;';
        x.title = 'Clock out';
        x.addEventListener('click', () => clockOut(currentTab, p.name));

        controls.appendChild(doneBtn);
        controls.appendChild(x);

        li.appendChild(nameWrap);
        li.appendChild(controls);
        ul2.appendChild(li);
      });
      viewBodyEl.appendChild(ul2);
    }

    if(pendingAddName){
      viewBodyEl.appendChild(renderTimeConfirm());
    } else if(pickerOpen){
      viewBodyEl.appendChild(renderPicker());
    } else {
      const addBtn = document.createElement('button');
      addBtn.className = 'add-item-btn';
      addBtn.textContent = '+ Add staff';
      addBtn.addEventListener('click', () => { pickerOpen = true; render(); });
      viewBodyEl.appendChild(addBtn);
    }
  }

  function renderTimeEditor(tab, p){
    const row = document.createElement('div');
    row.className = 'time-edit-row';

    const input = document.createElement('input');
    input.type = 'time';
    input.value = msToTimeStr(p.since);

    const saveBtn = document.createElement('button');
    saveBtn.textContent = 'Save';
    saveBtn.addEventListener('click', () => setSince(tab, p.name, timeStrToMs(input.value, p.since)));

    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'cancel';
    cancelBtn.textContent = 'Cancel';
    cancelBtn.addEventListener('click', () => { editingName = null; render(); });

    row.appendChild(input);
    row.appendChild(saveBtn);
    row.appendChild(cancelBtn);
    return row;
  }

  function renderPicker(){
    const wrap = document.createElement('div');
    wrap.className = 'picker';

    const head = document.createElement('div');
    head.className = 'picker-head';
    const label = document.createElement('span');
    label.textContent = 'Tap a name to clock in';
    const closeBtn = document.createElement('button');
    closeBtn.textContent = 'Close';
    closeBtn.addEventListener('click', () => { pickerOpen = false; render(); });
    head.appendChild(label);
    head.appendChild(closeBtn);
    wrap.appendChild(head);

    const results = document.createElement('div');
    results.className = 'picker-results';

    const list = listFor(currentTab);
    const already = new Set(list.map(p => p.name));
    const available = STAFF_LISTS[currentTab].filter(n => !already.has(n));

    if(available.length === 0){
      const empty = document.createElement('div');
      empty.className = 'picker-empty';
      empty.textContent = 'Everyone is already clocked in.';
      results.appendChild(empty);
    } else {
      available.forEach(name => {
        const chip = document.createElement('div');
        chip.className = 'picker-chip';
        chip.textContent = name;
        chip.addEventListener('click', () => {
          pendingAddName = name;
          pendingAddTime = msToTimeStr(Date.now());
          render();
        });
        results.appendChild(chip);
      });
    }
    wrap.appendChild(results);
    return wrap;
  }

  function renderTimeConfirm(){
    const wrap = document.createElement('div');
    wrap.className = 'picker time-confirm';

    const nameEl = document.createElement('div');
    nameEl.className = 'time-confirm-name';
    nameEl.innerHTML = 'Clocking in <strong>' + escapeHtml(pendingAddName) + '</strong>';
    wrap.appendChild(nameEl);

    const row = document.createElement('div');
    row.className = 'time-confirm-row';
    const label = document.createElement('label');
    label.textContent = 'Arrived at';
    const input = document.createElement('input');
    input.type = 'time';
    input.value = pendingAddTime;
    input.addEventListener('input', () => { pendingAddTime = input.value; });
    row.appendChild(label);
    row.appendChild(input);
    wrap.appendChild(row);

    const actions = document.createElement('div');
    actions.className = 'time-confirm-actions';
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'cancel-btn';
    cancelBtn.textContent = 'Cancel';
    cancelBtn.addEventListener('click', () => { pendingAddName = null; pendingAddTime = null; render(); });
    const confirmBtn = document.createElement('button');
    confirmBtn.className = 'confirm-btn';
    confirmBtn.textContent = 'Clock in';
    confirmBtn.addEventListener('click', () => {
      addToQueue(currentTab, pendingAddName, timeStrToMs(pendingAddTime));
    });
    actions.appendChild(cancelBtn);
    actions.appendChild(confirmBtn);
    wrap.appendChild(actions);

    return wrap;
  }

  tabBarberBtn.addEventListener('click', () => { currentTab = 'barber'; pickerOpen = false; pendingAddName = null; editingName = null; render(); });
  tabTherapistBtn.addEventListener('click', () => { currentTab = 'therapist'; pickerOpen = false; pendingAddName = null; editingName = null; render(); });

  load();
})();
</script>
<script src="nav.js"></script>
<script src="shared.js"></script>
</body>
</html>
